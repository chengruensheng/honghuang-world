name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  RUST_BACKTRACE: 1

jobs:
  # ── 车道 1：格式 + 警告 ── 快速反馈，3 平台 ──
  格式与警告:
    name: 格式 + 警告 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: 警告检查（deny warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 车道 2：测试 ── 核心门禁，3 平台 ──
  测试:
    name: 测试 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: 格式与警告
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2
      - name: 全量测试
        run: cargo test --workspace --lib --no-fail-fast

  # ── 车道 3：文档 ── 单平台即可 ──
  文档:
    name: 文档检查
    runs-on: ubuntu-latest
    needs: 格式与警告
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2
      - name: 生成文档（无报错即过）
        run: cargo doc --workspace --no-deps

  # ── 车道 4：安全审计 ── 单平台，已知 ring CVE 待修 ──
  安全审计:
    name: 依赖审计
    runs-on: ubuntu-latest
    needs: 格式与警告
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 安装 cargo-audit + cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: 漏洞审计
        run: cargo audit
      - name: 依赖检查（许可协议 + 重复依赖 + 源码）
        run: cargo deny check

  # ── 车道 5：门禁脚本 ── 跑 道果树/质量门禁-域/门禁-府/ 下验证 ──
  门禁脚本:
    name: 门禁脚本
    runs-on: windows-latest
    needs: 测试
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2
      - name: 检查全部
        run: pwsh 道果树/质量门禁-域/门禁-府/检查-全部.ps1
