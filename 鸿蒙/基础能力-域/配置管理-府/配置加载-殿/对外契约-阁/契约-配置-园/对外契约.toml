# 对外契约 —— 后端对外暴露的「呈现参数」（前端/客户端消费面）。
# 增删前端只改本文件，不动后端代码；空值 = 关闭对应能力。
# 注：事件词表/交互协议属「契约」，由 Rust 契约 crate 单一真相源，不在此文件。
# 注：TOML 裸键仅支持 ASCII，中文表名必须加双引号，故写作 ["对外"]。

["对外"]
# 允许跨源访问的来源白名单（如 ["http://localhost:8321", "tauri://localhost"]）；空 = 不启用 CORS
cors_origins = []
# 静态资源托管目录（如 "artifacts/agent-workspace"）；空 = 不托管，纯 API
static_dir = ""
# SSE 并发连接上限（0 = 不限制）
sse_max = 10
