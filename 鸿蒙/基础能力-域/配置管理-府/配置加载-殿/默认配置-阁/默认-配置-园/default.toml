[app]
name = "洪荒·世界"
version = "0.1.0"
run_self_test = false
run_dev_agent = false
dev_workspace = "./工作区"
dev_task = ""
dev_max_rounds = 60
executor_timeout_secs = 30
executor_max_output_bytes = 65536

[log]
level = "info"

[http]
bind = "127.0.0.1"
port = 8321
auth_token = ""

[persistence]
# 运行时状态持久化目录（相对项目根；空 = 纯内存，重启丢失全部状态）。
# 落盘内容：五行引擎(任务/迭代/记忆/规则/事件).toml、任务看板.jsonl、看板驱动上下文.jsonl、
# 驱动会话/、认知三态/(心智地图/图谱/上下文库)、道祖接待.json、llm-选择.json。
# 目录位于 道果/ 下（已 gitignore，状态不入库），不存在时启动自动创建。
dir = "道果/持久化"

[llm]
# 商业级 LLM 池：多供应商配置（配置顺序即故障转移优先级）。
# selected_provider / selected_model 留空 = 自动选择第一个启用供应商。
# api_key 推荐写 env:环境变量名（密钥不入库，项目根 .env 由后端 dotenvy 自动加载）；开发期可写明文。
# models_url 留空时推导为 {base_url}/models（供应商 list 端点不同时请显式配置）。
# 快捷接入：客户端对话页「＋ 接入供应商」可选内置模板（DeepSeek/智谱GLM/通义Qwen/Kimi/
# MiniMax/火山方舟/OpenAI/OpenRouter/Ollama）或自定义供应商——填官网+密钥 → 获取可用模型
# → 接入并选择；api_key 写 env:变量名 会记入 llm-接入.json，重启自动恢复；明文仅会话内有效。
selected_provider = "minimax"
selected_model = "MiniMax-M3"
state_file = "llm-选择.json"

# 主供应商：MiniMax（OpenAI 兼容，endpoint 为 {base_url} 即 /v1/chat/completions）。
# 密钥走项目根 .env 的 LLM_API_KEY（后端启动时 dotenvy 自动加载）。
# ⚠️ base_url/model 只接受字面量（不支持 env: 前缀），请与真实网关核对后再改。
[[llm.providers]]
name = "minimax"
kind = "openai"
base_url = "https://api.minimaxi.com/v1/chat/completions"
models_url = "https://api.minimaxi.com/v1/models"
api_key = "env:LLM_API_KEY"
model = "MiniMax-M3"
# 超时 300 秒：MiniMax-M3 为推理模型（思考链占输出大头，实测 4000 输出 token 中 3176 为 reasoning），
# 大上下文下单次生成可远超 60 秒——复跑实测单轮最长 163 秒（180 秒仅余 17 秒余量，风险高），故取 300 秒。
# 原 60 秒会「重试 2 次全部超时」（实测失败耗时 182s≈3×60）致整轮驱动失败。
timeout_secs = 300
retry = 2
enabled = true
json_mode = false

# 备用：a6api 网关（主供应商失败时自动故障转移）
[[llm.providers]]
name = "a6api"
kind = "openai"
base_url = "https://api.a6api.com/v1/chat/completions"
models_url = "https://api.a6api.com/v1/models"
api_key = "env:LLM_FALLBACK_API_KEY"
model = "deepseek-v4-pro-0813"
timeout_secs = 180
retry = 2
enabled = true
json_mode = false
