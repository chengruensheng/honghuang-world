[app]
name = "洪荒·世界"
version = "0.1.0"
run_self_test = false
run_dev_agent = false
dev_workspace = "./工作区"
dev_task = ""
dev_max_rounds = 20
executor_timeout_secs = 30
executor_max_output_bytes = 65536

[log]
level = "info"

[http]
bind = "127.0.0.1"
port = 8321
static_dir = "乾坤/界面呈现-域/世界入口-府"
# 前端热更新：开发期开启（前端文件变化自动刷新桌面窗口，改代码即时生效）；生产请置 false
hot_reload = true
auth_token = ""

[persistence]
dir = ""

[llm]
# 商业级 LLM 池：多供应商配置（配置顺序即故障转移优先级）。
# selected_provider / selected_model 留空 = 自动选择第一个启用供应商。
# api_key 推荐写 env:环境变量名（密钥不入库）；开发期可写明文。
# models_url 留空时推导为 {base_url}/models（供应商 list 端点不同时请显式配置）。
# 快捷接入：前端对话页「＋ 接入供应商」可选内置模板（DeepSeek/智谱GLM/通义Qwen/Kimi/
# MiniMax/火山方舟/OpenAI/OpenRouter/Ollama）或自定义供应商——填官网+密钥 → 获取可用模型
# → 接入并选择；api_key 写 env:变量名 会记入 llm-接入.json，重启自动恢复；明文仅会话内有效。
selected_provider = ""
selected_model = ""
state_file = "llm-选择.json"

# 示例（取消注释即启用，可配置任意数量）：
# [[llm.providers]]
# name = "minimax"
# kind = "openai"
# base_url = "https://api.minimax.chat/v1/text/chatcompletion_v2"
# models_url = "https://api.minimax.chat/v1/models"
# api_key = "env:LLM_API_KEY"
# model = "abab6.5s-chat"
# timeout_secs = 30
# retry = 2
# enabled = true
# json_mode = false  # 是否开启 JSON 输出模式（请求体追加 response_format: json_object）
#                    # 仅 OpenAI 兼容 /chat/completions 支持；带工具「对话」路径不生效；默认 false（未开启请求体与旧版一致）
