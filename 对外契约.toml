# 对外契约 —— 运行时可编辑的「呈现参数」（后端对外暴露，前端/客户端消费面）。
#
# 生效优先级：本文件（运行时）> crate 内编译期内置默认（对外契约-阁/契约-配置-园/对外契约.toml）。
# 查找方式：从当前工作目录逐级向上查找本文件，命中即解析生效；未命中或解析失败则回退内置默认。
#
# 铁律：后端逻辑不内嵌任何前端专属信息——增删客户端只改本文件，不改后端代码。
# 空值 = 关闭对应能力：空 static_dir = 不托管静态资源（纯 API）；空 cors_origins = 不启用 CORS。
# 注：事件词表/交互协议属「契约」，由 Rust 契约 crate 单一真相源，不在此文件。
# 注：TOML 裸键仅支持 ASCII，中文表名必须加双引号，故写作 ["对外"]。

["对外"]
# 允许跨源访问的来源白名单（如 ["http://localhost:8321", "tauri://localhost"]）；空 = 不启用 CORS
cors_origins = []
# 静态资源托管目录（如 "artifacts/agent-workspace"）；空 = 不托管，纯 API
static_dir = "乾坤/观星呈现-域"
# SSE 并发连接上限（0 = 不限制）
sse_max = 10
