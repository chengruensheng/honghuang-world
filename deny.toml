# cargo-deny 配置：许可协议 + 重复依赖 + 源码检查
# 用法：cargo deny check

[advisories]
# 已知漏洞检查（cargo audit 同源数据）
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

[licenses]
# 许可协议白名单
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# 重复依赖检查
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
# 源码来源限制：只允许 crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["crates-io"]