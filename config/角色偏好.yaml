# 角色偏好表 —— 13 角色默认工具模式（数据驱动，不硬编码进角色代码）。
# 加载：daoshu_fu::角色偏好::加载(工作区根) 返回 HashMap<String, 角色偏好>
# 字段：
#   层级: 顶层 / 中层 / 底层
#   默认工具: 此角色优先使用的工具名列表（来自 daoshu_fu::工具清单::清单()）
#   默认禁写: true=不能写文件（评审/验收），false=可写文件（执行）
#   描述: 一句话角色定位
# 设计：偏好是默认值不是硬约束，LLM 看工具 manifest schema 自选（多智能体 §1.5.6）

