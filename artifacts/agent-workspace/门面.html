<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洪荒 · 界面呈现</title>
  <style>/* ═══════════════════════════════════════════════════════════
   乾坤 · 视觉背景层 —— 只有「主题令牌 + 页面底色」，零布局
   隔离约定：下游（布局层/组件）只允许引用 :root 令牌，
   不得自带色彩字面量；本层不得出现任何网格/定位属性。
   ═══════════════════════════════════════════════════════════ */
:root{
  /* ── 五行基色（唯一权威；看板/对话/图谱一律引用此套）── */
  --木: #6fbf73;
  --火: #e87a4a;
  --土: #d8b36a;
  --金: #b9c2d0;
  --水: #6fb0d3;

  /* ── 主色与状态 ── */
  --契:  #5fd0be;   /* 主强调 · 契约青 */
  --契暗: #2a6a60;  /* 主强调深色（辉光底/描边） */
  --契字: #06201c;  /* 主强调底上的深字（随 --契 配套） */
  --成:  #5ce0a0;
  --警:  #e8a64a;
  --险:  #e05252;
  --讯:  #6fb0d3;

  /* ── 面材（深 → 浅）── */
  --底:  #090c11;
  --面一: #0f131a;
  --面二: #131824;
  --面三: #1a2130;
  --面四: #232c3d;
  --面悬: #1e2634;  /* 悬停专用面 */

  /* ── 线（半透明，随底色自然融合）── */
  --线一: rgba(148, 170, 205, .08);
  --线二: rgba(148, 170, 205, .14);
  --线三: rgba(148, 170, 205, .22);

  /* ── 字 ── */
  --字一: #eef2f8;
  --字二: #c6cdd9;
  --字三: #8d97a8;
  --字四: #5c6575;

  /* ── 字体 / 圆角 / 阴影 / 过渡 ── */
  --字族: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --字码: "Cascadia Code", Consolas, monospace;
  --圆小: 6px;
  --圆中: 10px;
  --圆大: 14px;
  --影一: 0 8px 28px rgba(0, 0, 0, .35);
  --影二: 0 20px 56px rgba(0, 0, 0, .5);
  --速:   .16s ease;

  /* ── 全屏遮罩底（弹层/阅读/设置统一）── */
  --遮罩: rgba(4, 6, 10, .62);

  /* ── 布局骨架尺寸（布局层与覆盖层共同引用的唯一定义）── */
  --轨宽: 56px;   /* 左栏图标轨宽 */
  --顶高: 46px;   /* 顶栏高 */
  --底高: 26px;   /* 底栏高 */

  color-scheme: dark;
}

/* ── 页面底色：深空 + 三向微光（只属于背景层）── */
html, body{
  height: 100%;
  margin: 0;
}
body{
  font-family: var(--字族);
  font-size: 13px;
  color: var(--字二);
  background:
    radial-gradient(1100px 520px at 85% -12%, rgba(95, 208, 190, .07), transparent 60%),
    radial-gradient(900px 480px at -10% 112%, rgba(111, 176, 211, .055), transparent 55%),
    radial-gradient(700px 420px at 50% 122%, rgba(216, 179, 106, .045), transparent 60%),
    var(--底);
  -webkit-font-smoothing: antialiased;
}

/* ── 主题级外观：滚动条与选区 ── */
*{
  scrollbar-width: thin;
  scrollbar-color: var(--面四) transparent;
}
*::-webkit-scrollbar{ width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb{ background: var(--面四); border-radius: 4px; }
*::-webkit-scrollbar-thumb:hover{ background: var(--线三); }
::selection{ background: rgba(95, 208, 190, .28); }
</style>
  <style>/* ═══════════════════════════════════════════════════════════
   乾坤 · 区域布局层 —— 只有「槽位网格」，零色彩（只引用令牌）
   隔离约定：
   1. 组件代码不得改写 .界面-* 结构与样式；
   2. 组件只能经 挂载契约（分区挂载.js）进入槽位；
   3. 本层不定义组件外观，槽位自身无外观，仅承载与分区。
   ═══════════════════════════════════════════════════════════ */
.界面-布局{
  display: grid;
  /* 左栏仅承载图标轨（--轨宽 图标列），主区占满；无右栏 */
  grid-template-columns: var(--轨宽) minmax(0, 1fr);
  grid-template-rows: var(--顶高) minmax(0, 1fr) var(--底高);
  grid-template-areas:
    "顶栏 顶栏"
    "左栏 主区"
    "底栏 底栏";
  height: 100dvh;
}

/* ── 槽位：组件唯一落点，仅分区描线 ── */
.界面-槽位{
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.界面-槽位[data-槽位名="顶栏"]{ grid-area: 顶栏; border-bottom: 1px solid var(--线一); }
.界面-槽位[data-槽位名="左栏"]{ grid-area: 左栏; border-right:  1px solid var(--线一); }
.界面-槽位[data-槽位名="主区"]{ grid-area: 主区; }
.界面-槽位[data-槽位名="底栏"]{ grid-area: 底栏; border-top:    1px solid var(--线一); }

/* ── 空槽提示：证明布局先于组件独立成立 ── */
.界面-槽位:empty::after{
  content: "槽位待挂载 · " attr(data-槽位名);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  font-family: var(--字码);
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--字四);
}

/* ── 窄屏：图标轨保留（它是全部导航的唯一入口，隐藏即界面锁死），
       仅压缩主区最小宽，防止内容撑破 ── */
@media (max-width: 760px){
  .界面-布局{
    grid-template-columns: var(--轨宽) minmax(0, 1fr);
  }
}
</style>
  <style>/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 侧栏图标轨 外观
   隔离约定：
   1. 只引用背景层令牌（var(--契) 等），不写死任何色值；
   2. 不触碰 .界面-* 布局结构，本样式仅作用于 .组件-* 自身；
   3. 组件经挂载契约进入槽位，此处只定义外观。
   ═══════════════════════════════════════════════════════════ */

/* ── 图标轨：纵向排列，占满槽位高度 ── */
.组件-图标轨{
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  height: 100%;
  padding: 8px 0;
  box-sizing: border-box;
}

/* ── 图标按钮：图标 + 下方小字 ── */
.组件-图标{
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 0 6px;
  border: none;
  background: transparent;
  color: var(--字三);
  font-family: var(--字族);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.组件-图标:hover{
  color: var(--字一);
  background: var(--面二);
}
.组件-图标 svg{
  width: 22px;
  height: 22px;
}
.组件-图标 em{
  font-style: normal;
  font-size: 10px;
  letter-spacing: .05em;
  color: inherit;
}

/* ── 激活态：主题色 + 左侧指示条 ── */
.组件-图标.是{
  color: var(--契);
}
.组件-图标.是::before{
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 2px;
  border-radius: 2px;
  background: var(--契);
}

/* ── 下方按钮组：相对末位排布 ── */
.组件-图标轨 .组件-末{
  margin-top: auto;
}

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 设置面板 接入组件 外观
   隔离约定：只引用背景层令牌，不写死色值；类名一律「设置-」前缀。
   ═══════════════════════════════════════════════════════════ */

/* ── 供应商组头：标题与密钥按钮同排 ── */
.设置-供应商组 h6{
  display: flex;
  align-items: center;
  gap: 8px;
}
.设置-密钥钮{
  padding: 2px 10px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  background: var(--面二);
  color: var(--字三);
  font-family: var(--字族);
  font-size: 10px;
  cursor: pointer;
  transition: border-color var(--速), color var(--速);
}
.设置-密钥钮:hover{
  border-color: var(--契);
  color: var(--字一);
}

/* ── 密钥行（组内展开）── */
.设置-密钥行{
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  padding: 8px 10px;
  border: 1px dashed var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
}
.设置-密钥输入{
  flex: 1 1 220px;
  padding: 6px 9px;
  border: 1px solid var(--线二);
  border-radius: 6px;
  background: var(--面一);
  color: var(--字一);
  font-family: var(--字码);
  font-size: 11px;
}
.设置-密钥输入:focus{
  outline: none;
  border-color: var(--契);
}
.设置-密钥保存{
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  background: var(--契);
  color: var(--契字);
  font-family: var(--字族);
  font-size: 11px;
  cursor: pointer;
  transition: opacity var(--速);
}
.设置-密钥保存:disabled{
  opacity: .55;
  cursor: default;
}
.设置-密钥反馈{
  flex-basis: 100%;
  font-size: 11px;
  color: var(--成);
  word-break: break-all;
}
.设置-密钥反馈.坏{
  color: var(--警);
}

/* ── 接入入口 + 向导 ── */
.设置-接入钮{
  margin-top: 10px;
  padding: 6px 12px;
  border: 1px dashed var(--线二);
  border-radius: var(--圆小);
  background: transparent;
  color: var(--字三);
  font-family: var(--字族);
  font-size: 11px;
  cursor: pointer;
  transition: border-color var(--速), color var(--速);
}
.设置-接入钮:hover{
  border-color: var(--契);
  color: var(--字一);
}
.设置-向导{
  margin-top: 10px;
  padding: 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.设置-向导头{
  display: flex;
  align-items: center;
}
.设置-向导头 b{
  font-size: 12px;
  color: var(--字一);
}
.设置-向导关{
  margin-left: auto;
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--字三);
  cursor: pointer;
}
.设置-向导关:hover{
  color: var(--字一);
  background: var(--面三);
}
.设置-向导行{
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.设置-向导行 input,
.设置-向导行 select{
  flex: 1 1 150px;
  min-width: 0;
  padding: 6px 9px;
  border: 1px solid var(--线二);
  border-radius: 6px;
  background: var(--面一);
  color: var(--字一);
  font-family: var(--字族);
  font-size: 11px;
}
.设置-向导行 input:focus,
.设置-向导行 select:focus{
  outline: none;
  border-color: var(--契);
}
.设置-向导取模{
  padding: 6px 12px;
  border: 1px solid var(--线二);
  border-radius: 6px;
  background: var(--面三);
  color: var(--字二);
  font-family: var(--字族);
  font-size: 11px;
  cursor: pointer;
}
.设置-向导取模:hover{
  border-color: var(--契);
  color: var(--字一);
}
.设置-向导取模:disabled{
  opacity: .55;
  cursor: default;
}
.设置-向导接{
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  background: var(--契);
  color: var(--契字);
  font-family: var(--字族);
  font-size: 11px;
  cursor: pointer;
}
.设置-向导接:disabled{
  opacity: .55;
  cursor: default;
}
.设置-向导反馈{
  flex-basis: 100%;
  align-self: center;
  font-size: 11px;
  color: var(--成);
  word-break: break-all;
}
.设置-向导反馈.坏{
  color: var(--警);
}

/* ── 智能体绑定 ── */
.设置-绑定{
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.设置-绑定空{
  padding: 10px 12px;
  border: 1px dashed var(--线二);
  border-radius: var(--圆小);
  font-size: 11px;
  color: var(--字四);
  text-align: center;
}
.设置-绑定行{
  padding: 10px 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.设置-绑定头{
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.设置-绑定头 b{
  font-size: 12px;
  color: var(--字一);
}
.设置-绑定头 em{
  font-style: normal;
  font-size: 10px;
  color: var(--字四);
}
.设置-绑定生{
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--字四);
}
.设置-绑定生 code{
  font-family: var(--字码);
  font-size: 10px;
  color: var(--字二);
  word-break: break-all;
}
.设置-绑定选{
  display: flex;
  gap: 6px;
}
.设置-绑定选 select{
  flex: 1;
  min-width: 0;
  padding: 5px 8px;
  border: 1px solid var(--线二);
  border-radius: 6px;
  background: var(--面一);
  color: var(--字一);
  font-family: var(--字码);
  font-size: 11px;
}
.设置-绑定制{
  display: flex;
  gap: 6px;
}
.设置-绑钮{
  padding: 5px 12px;
  border: none;
  border-radius: 6px;
  background: var(--契);
  color: var(--契字);
  font-family: var(--字族);
  font-size: 11px;
  cursor: pointer;
}
.设置-绑钮:hover{
  opacity: .9;
}
.设置-解钮{
  padding: 5px 12px;
  border: 1px solid var(--线二);
  border-radius: 6px;
  background: transparent;
  color: var(--字三);
  font-family: var(--字族);
  font-size: 11px;
  cursor: pointer;
}
.设置-解钮:hover{
  border-color: var(--警);
  color: var(--警);
}
.设置-绑定错{
  font-size: 11px;
  color: var(--警);
  word-break: break-all;
}

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 设置面板 外观
   隔离约定：
   1. 只引用背景层令牌，不写死任何色值；
   2. 面板经「乾坤图标」事件驱动，挂钩主区槽位，不触碰布局结构；
   3. 托盘为覆盖层（遮罩 + 居中面板），随展开/收起切换显隐。
   ═══════════════════════════════════════════════════════════ */

/* ── 托盘遮罩 ── */
.设置-托盘{
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--遮罩);
  backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--速);
}
.设置-托盘.开{
  opacity: 1;
  pointer-events: auto;
}

/* ── 居中面板 ── */
.设置-面板{
  width: min(520px, 90vw);
  max-height: 82vh;
  overflow: auto;
  border: 1px solid var(--线二);
  border-radius: var(--圆中);
  background: var(--面一);
  box-shadow: var(--影二);
  font-family: var(--字族);
  color: var(--字二);
}

/* ── 头部 ── */
.设置-头{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--线一);
}
.设置-头 b{
  font-size: 14px;
  color: var(--字一);
}
.设置-头 .设置-副{
  font-size: 11px;
  color: var(--字四);
  letter-spacing: .04em;
}
.设置-头 .设置-关{
  margin-left: auto;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--字三);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.设置-头 .设置-关:hover{
  color: var(--字一);
  background: var(--面二);
}

/* ── 区块 ── */
.设置-区块{
  padding: 16px 18px;
  border-bottom: 1px solid var(--线一);
}
.设置-区块:last-child{
  border-bottom: none;
}
.设置-区块 h5{
  margin: 0 0 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .10em;
  color: var(--字四);
  text-transform: uppercase;
}

/* ── 当前模型行（接真实状态）── */
.设置-当前模型{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  margin-bottom: 10px;
}
.设置-当前模型 b{
  font-size: 13px;
  color: var(--字一);
}
.设置-当前模型 em{
  margin-left: auto;
  font-style: normal;
  font-size: 11px;
  color: var(--字四);
}
.设置-当前模型 .点{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--字四);
  flex: none;
}
.设置-当前模型 .点.活{ background: var(--成); }
.设置-当前模型 .点.死{ background: var(--险); }

/* ── 供应商模型清单 ── */
.设置-模型列表{
  display: flex;
  flex-direction: column;
}
.设置-供应商组{
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.设置-供应商组 h6{
  width: 100%;
  margin: 0 0 2px;
  font-size: 11px;
  font-weight: 500;
  color: var(--字三);
  font-family: var(--字码);
}
.设置-模型项{
  padding: 5px 10px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  background: var(--面二);
  color: var(--字二);
  font-family: var(--字码);
  font-size: 11px;
  cursor: pointer;
  transition: border-color var(--速), color var(--速), background var(--速);
}
.设置-模型项:hover{
  border-color: var(--契);
  color: var(--字一);
}
.设置-模型项.当前{
  border-color: var(--契);
  background: var(--面三);
  color: var(--契);
}
.设置-模型错误{
  display: block;
  font-size: 11px;
  color: var(--警);
  padding: 4px 0;
}

/* ── 智能体绑定区（样式见 接入.css）── */

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 顶栏 外观
   隔离约定：只引用令牌；经挂载契约进入顶栏槽位。
   ═══════════════════════════════════════════════════════════ */

.组件-顶栏{
  display: flex;
  align-items: center;
  gap: 14px;
  height: 100%;
  padding: 0 14px;
  box-sizing: border-box;
  font-family: var(--字族);
  color: var(--字二);
}

/* ── logo ── */
.组件-顶栏 .顶栏-标{
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 700;
  font-size: 14px;
  color: var(--字一);
  letter-spacing: .06em;
}
.组件-顶栏 .顶栏-标 svg{
  width: 18px;
  height: 18px;
  color: var(--契);
}

/* ── 右侧区 ── */
.组件-顶栏 .顶栏-右{
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ── 工作区选择器 ── */
.组件-顶栏 .顶栏-工作区{
  position: relative;
  display: flex;
  align-items: center;
}
.组件-顶栏 .顶栏-工作区-钮{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  color: var(--字二);
  font-size: 12px;
  font-family: var(--字码);
  cursor: pointer;
  max-width: 320px;
  transition: color var(--速), border-color var(--速), background var(--速);
}
.组件-顶栏 .顶栏-工作区-钮:hover{
  color: var(--字一);
  border-color: var(--字四);
  background: var(--面三);
}
.组件-顶栏 .顶栏-工作区-钮 .夹{
  width: 15px;
  height: 15px;
  color: var(--契);
  flex: none;
}
.组件-顶栏 .顶栏-工作区-钮 .路{
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 240px;
  direction: rtl;  /* 路径过长时优先显示尾部 */
  text-align: left;
}
.组件-顶栏 .顶栏-工作区-钮 .下{
  width: 12px;
  height: 12px;
  color: var(--字四);
  flex: none;
}

/* 输入面板 */
.组件-顶栏 .顶栏-工作区-面{
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 60;
  width: 360px;
  padding: 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆中);
  background: var(--面一);
  box-shadow: var(--影一);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-4px);
  transition: opacity var(--速), transform var(--速), visibility var(--速);
}
.组件-顶栏 .顶栏-工作区-面.开{
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}
.组件-顶栏 .顶栏-工作区-面 .题{
  font-size: 11px;
  color: var(--字四);
  margin-bottom: 8px;
  letter-spacing: .04em;
}
.组件-顶栏 .顶栏-工作区-面 .入{
  width: 100%;
  box-sizing: border-box;
  padding: 8px 10px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  color: var(--字一);
  font-size: 12px;
  font-family: var(--字码);
  outline: none;
}
.组件-顶栏 .顶栏-工作区-面 .入:focus{
  border-color: var(--契);
}
.组件-顶栏 .顶栏-工作区-面 .行{
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}
.组件-顶栏 .顶栏-工作区-面 .行 button{
  padding: 5px 14px;
  border-radius: var(--圆小);
  font-size: 12px;
  cursor: pointer;
  transition: background var(--速), border-color var(--速);
}
.组件-顶栏 .顶栏-工作区-面 .行 .定{
  border: 1px solid transparent;
  background: var(--契);
  color: var(--契字);
}
.组件-顶栏 .顶栏-工作区-面 .行 .定:hover{
  filter: brightness(1.1);
}
.组件-顶栏 .顶栏-工作区-面 .行 .消{
  border: 1px solid var(--线二);
  background: var(--面二);
  color: var(--字三);
}
.组件-顶栏 .顶栏-工作区-面 .行 .消:hover{
  color: var(--字一);
  background: var(--面三);
}

/* ── 模型标识 ── */
.组件-顶栏 .顶栏-模型{
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--字二);
}
.组件-顶栏 .顶栏-模型 .点{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--契);
  box-shadow: 0 0 8px var(--契);
}
.组件-顶栏 .顶栏-模型 b{
  color: var(--字一);
  font-weight: 600;
}

/* ── 状态徽标 ── */
.组件-顶栏 .顶栏-徽{
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  font-size: 11px;
  color: var(--成);
}
.组件-顶栏 .顶栏-徽 .点{
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--成);
}

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 底栏 外观
   隔离约定：只引用令牌；经挂载契约进入底栏槽位。
   ═══════════════════════════════════════════════════════════ */

.组件-底栏{
  display: flex;
  align-items: center;
  gap: 16px;
  height: 100%;
  padding: 0 12px;
  box-sizing: border-box;
  font-family: var(--字族);
  font-size: 11px;
  color: var(--字三);
  white-space: nowrap;
  overflow: hidden;
}

/* ── 状态项 ── */
.组件-底栏 .底栏-项{
  display: flex;
  align-items: center;
  gap: 6px;
}
.组件-底栏 .底栏-项 b{
  color: var(--字一);
  font-weight: 500;
}

/* ── 引擎在线标 ── */
.组件-底栏 .底栏-在线{
  color: var(--成);
}
.组件-底栏 .底栏-在线 .点{
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--成);
  animation: 底栏脉冲 1.6s ease-in-out infinite;
}
@keyframes 底栏脉冲{
  0%, 100%{ opacity: 1; }
  50%{ opacity: .35; }
}

/* ── 分隔点 ── */
.组件-底栏 .底栏-点{
  color: var(--线三);
}

/* ── 模型 ── */
.组件-底栏 .底栏-模型{
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--契);
}
.组件-底栏 .底栏-模型 .点{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--契);
}

/* ── 右区 ── */
.组件-底栏 .底栏-右{
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

/* ── 版本 ── */
.组件-底栏 .底栏-版{
  color: var(--字四);
  font-family: var(--字码);
}

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 主区对话流 外观
   隔离约定：只引用令牌；经挂载契约进入主区槽位。
   ═══════════════════════════════════════════════════════════ */

.对话外壳{
  display: flex;
  flex-direction: column;
  height: 100%;
  font-family: var(--字族);
  color: var(--字二);
}

/* ── 标题行 ── */
.对话标题{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--线一);
}
.对话标题 .标{
  font-size: 15px;
  font-weight: 600;
  color: var(--字一);
}
.对话标题 .次{
  font-size: 11px;
  color: var(--字四);
}
.对话标题 .态{
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  font-size: 12px;
  color: var(--成);
}
.对话标题 .态 .点{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--成);
  animation: 对脉冲 1.6s ease-in-out infinite;
}
@keyframes 对脉冲{
  0%, 100%{ opacity: 1; }
  50%{ opacity: .35; }
}
.对话标题 .态.停{
  color: var(--警);
}
.对话标题 .态.停 .点{
  background: var(--警);
}
/* 运转中：青蓝提示（设置态 添加 .忙） */
.对话标题 .态.忙{
  color: var(--讯);
}
.对话标题 .态.忙 .点{
  background: var(--讯);
}

/* ── 消息列表 ── */
.对话流{
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

/* ── 空态 ── */
.对话流.空{
  align-items: center;
  justify-content: center;
  color: var(--字四);
  font-size: 13px;
  text-align: center;
}
.对话流.空 .标{
  font-size: 15px;
  color: var(--字二);
  margin-bottom: 8px;
}
.对话流.空 .次{
  font-size: 11px;
  color: var(--字四);
}

/* ── 首屏欢迎面板（任务 #3） ── */
.欢迎面板{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 520px);
  margin: auto;
  padding: 28px 22px;
  text-align: center;
}
.欢迎-顶{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  background: var(--面一);
  font-size: 11px;
}
.欢迎-徽{
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--契);
  color: var(--契字);
  font-weight: 600;
}
.欢迎-名{
  color: var(--字三);
  font-weight: 600;
  letter-spacing: 1px;
}
.欢迎-标{
  font-size: 18px;
  font-weight: 600;
  color: var(--字一);
  letter-spacing: 2px;
}
.欢迎-次{
  font-size: 12px;
  color: var(--字四);
  line-height: 1.6;
  max-width: 420px;
}
.快捷面板{
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 6px;
}
.快捷-项{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  background: var(--面二);
  color: var(--字二);
  font-family: var(--字族);
  font-size: 12px;
  cursor: pointer;
  transition: border-color var(--速), background var(--速), color var(--速);
}
.快捷-项:hover{
  border-color: var(--契);
  color: var(--契);
  background: color-mix(in srgb, var(--契) 10%, transparent);
}
.快捷-名{
  font-family: var(--字码);
  font-weight: 600;
  color: var(--契);
}
.快捷-描{
  color: var(--字四);
}
.快捷-项:hover .快捷-描{ color: var(--字三); }

/* ── 事件徽标（对话流里展示看板过程事件）── */
.气泡 .徽{
  display: inline-block;
  padding: 1px 8px;
  margin-right: 6px;
  border: 1px solid var(--契);
  border-radius: 99px;
  font-size: 10px;
  color: var(--契);
  background: var(--面一);
}
.气泡 .徽.ok{
  border-color: var(--成);
  color: var(--成);
}
.气泡 .次{
  display: inline-block;
  margin-top: 4px;
  font-size: 10px;
  color: var(--字四);
  font-family: var(--字码);
}
.气泡 .思 pre{
  margin: 6px 0 0 0;
  padding: 8px 10px;
  background: var(--面二);
  border-radius: var(--圆小);
  font-family: var(--字码);
  font-size: 11px;
  color: var(--字三);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ── 系统消息 ── */
.讯{
  font-size: 12px;
  color: var(--字四);
  padding: 8px 12px;
  border: 1px solid var(--线一);
  border-radius: var(--圆小);
  background: var(--面一);
}
.讯 b{ color: var(--字二); }

/* ── 消息 ── */
.讯息{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.讯息.己{ align-items: flex-end; }
.讯息.对{ align-items: flex-start; }

.讯息 .谁{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--字三);
}
.讯息 .谁 .名{
  font-weight: 600;
  color: var(--字二);
}
.讯息 .谁 .时{ color: var(--字四); }
.讯息 .谁 .徽{
  padding: 1px 7px;
  border-radius: 99px;
  font-size: 10px;
  color: var(--契);
  border: 1px solid var(--线二);
}

/* ── 气泡 ── */
.气泡{
  max-width: min(72%, 640px);
  padding: 11px 14px;
  border-radius: var(--圆中);
  overflow-wrap: break-word;
  word-break: break-word;
  font-size: 13px;
  line-height: 1.6;
  background: var(--面二);
  border: 1px solid var(--线二);
}
.讯息.己 .气泡{
  background: var(--面三);
  border-color: var(--线三);
}
.气泡 p{ margin: 0 0 8px; }
.气泡 p:last-child{ margin-bottom: 0; }
.气泡 b{ color: var(--字一); }
.气泡 code{
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--面四);
  font-family: var(--字码);
  font-size: 12px;
}

/* ── 围栏代码块（净化输出 pre.码；解析时与 p 同居气泡内）── */
.气泡 pre.码{
  margin: 2px 0 8px;
  padding: 10px 12px;
  border: 1px solid var(--线一);
  border-radius: var(--圆小);
  background: var(--面一);
  overflow-x: auto;
  font-family: var(--字码);
  font-size: 12px;
  line-height: 1.55;
  color: var(--字二);
}
.气泡 pre.码 code{
  padding: 0;
  background: none;
  border-radius: 0;
  font-size: inherit;
}

/* ── 轻渲染标题行 ── */
.气泡 h6{
  margin: 6px 0 4px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--字一);
}

/* ── 加载占位 ── */
.气泡.载{
  color: var(--字三);
  letter-spacing: 2px;
  animation: 对闪 1s ease-in-out infinite;
}
@keyframes 对闪{ 50%{ opacity: .4; } }

/* ── 思考过程折叠块 ── */
.气泡 .思{
  margin-bottom: 8px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面一);
  padding: 6px 10px;
  font-size: 12px;
  color: var(--字三);
}
.气泡 .思 summary{
  cursor: pointer;
  color: var(--字四);
  font-size: 11px;
  user-select: none;
}
.气泡 .思 div{
  margin-top: 6px;
  white-space: pre-wrap;
  line-height: 1.5;
}

/* ── 工具卡 ── */
.工具{
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面一);
  overflow: hidden;
  font-size: 12px;
}
.工具 > header{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--线一);
  color: var(--字二);
}
.工具 > header svg{
  width: 14px;
  height: 14px;
  color: var(--契);
}
.工具 > header .名{ font-weight: 600; }
.工具 > header .状{
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--成);
}
.工具 > header .状.行{ color: var(--讯); }
.工具 > header .状.等{ color: var(--警); }
.工具 pre{
  margin: 0;
  padding: 11px 12px;
  overflow-x: auto;
  font-family: var(--字码);
  font-size: 12px;
  line-height: 1.55;
  color: var(--字二);
  background: var(--面一);
}
.工具 pre .加{ color: var(--成); }
.工具 pre .删{ color: var(--险); }

/* ── 审批区 ── */
.审批{
  margin-top: 4px;
  padding: 12px 14px;
  border: 1px solid var(--线三);
  border-radius: var(--圆中);
  background: var(--面二);
}
.审批 > header{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--字一);
}
.审批 > header .叹{
  color: var(--警);
}
.审批 .描{
  margin: 8px 0 11px;
  font-size: 12px;
  color: var(--字三);
}
.审批 .排{
  display: flex;
  gap: 8px;
}
.审批 .排 button{
  padding: 6px 14px;
  border-radius: var(--圆小);
  font-size: 12px;
  font-family: var(--字族);
  cursor: pointer;
  border: 1px solid var(--线二);
  background: var(--面三);
  color: var(--字二);
  transition: border-color var(--速), background var(--速), color var(--速);
}
.审批 .排 .准{
  border-color: var(--契);
  color: var(--契);
}
.审批 .排 .准:hover{ background: color-mix(in srgb, var(--契) 12%, transparent); }
.审批 .排 .否:hover{ border-color: var(--险); color: var(--险); }

/* ── 输入条 ── */
.对话输入{
  padding: 12px 18px;
  border-top: 1px solid var(--线一);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.对话输入 .区{
  display: flex;
  gap: 8px;
}
.对话输入 textarea{
  flex: 1;
  resize: none;
  min-height: 38px;
  max-height: 120px;
  padding: 9px 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  color: var(--字一);
  font-family: var(--字族);
  font-size: 13px;
  line-height: 1.5;
  outline: none;
  transition: border-color var(--速);
}
.对话输入 textarea:focus{ border-color: var(--契); }
.对话输入 textarea::placeholder{ color: var(--字四); }
.对话输入 .发{
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  border: none;
  border-radius: var(--圆小);
  background: var(--契);
  color: var(--契字);
  font-family: var(--字族);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity var(--速);
}
.对话输入 .发:hover{ opacity: .85; }
.对话输入 .发 svg{ width: 14px; height: 14px; }
.对话输入 .足{
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  color: var(--字四);
}

/* ═══ 以下为与参考设计对齐的补充样式 ═══ */

/* ── 标题区 tag + 图标按钮 ── */
.对话标题 .火标{
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 600;
  color: var(--火);
  border: 1px solid color-mix(in srgb, var(--火) 40%, transparent);
  background: color-mix(in srgb, var(--火) 10%, transparent);
}
.对话标题 .钮{
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--字三);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.对话标题 .钮:hover{ color: var(--字一); background: var(--面二); }
.对话标题 .钮 svg{ width: 14px; height: 14px; }

/* ── 头像 ── */
.讯息 .谁 .像{
  width: 22px;
  height: 22px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: var(--面三);
  color: var(--字二);
  font-size: 11px;
  font-weight: 600;
}
.讯息 .谁 .像 svg{ width: 14px; height: 14px; }
.讯息.对 .谁 .像{ background: color-mix(in srgb, var(--契) 15%, transparent); color: var(--契); }

/* ── 工具卡：耗时 ms ── */
.工具 > header .ms{
  margin-left: 8px;
  font-size: 10px;
  color: var(--字四);
  font-family: var(--字码);
}
.工具 > header .状.ms末{ margin-left: auto; }

/* ── 运行中旋转 ── */
.工具 > header .状.行 .轮{
  width: 10px;
  height: 10px;
  border: 1.5px solid var(--线三);
  border-top-color: var(--讯);
  border-radius: 50%;
  animation: 对转 .8s linear infinite;
}
@keyframes 对转{ to{ transform: rotate(360deg); } }

/* ── 运行测试卡：tests 列表 ── */
.工具 ul.测{
  margin: 0;
  padding: 10px 12px;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-family: var(--字码);
  font-size: 12px;
}
.工具 ul.测 li{
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--字二);
}
.工具 ul.测 li i{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--字四);
}
.工具 ul.测 li em{
  margin-left: auto;
  font-style: normal;
  color: var(--字四);
}

/* ── 输入条工具行 ── */
.对话输入 .行{
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.对话输入 .行 .ico{
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--字三);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.对话输入 .行 .ico:hover{ color: var(--字一); background: var(--面二); }
.对话输入 .行 .ico svg{ width: 15px; height: 15px; }
.对话输入 .行 .ctx{
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--字三);
}
.对话输入 .行 .ctx .点{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--火);
}
.对话输入 .行 .迷你{
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px solid var(--线二);
  background: var(--面二);
  color: var(--字三);
  font-family: var(--字族);
  font-size: 11px;
  cursor: pointer;
  transition: border-color var(--速), color var(--速);
}
.对话输入 .行 .迷你.选{
  border-color: var(--契);
  color: var(--契);
}

/* ── 五行任务进度卡 ── */
.任务卡{
  max-width: min(72%, 640px);
  padding: 12px 14px;
  border-radius: var(--圆中);
  background: var(--面二);
  border: 1px solid var(--线二);
  font-size: 12px;
}
.任务卡 .头{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.任务卡 .头 b{ color: var(--字一); font-size: 13px; }
.任务卡 .头 .状{ color: var(--字三); font-size: 11px; }
.任务卡 .流{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.任务卡 .阶段{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 6px;
  background: var(--面一);
  color: var(--字四);
  transition: background .3s, color .3s;
}
.任务卡 .阶段 .点{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
  opacity: .35;
}
.任务卡 .阶段 .名{ font-weight: 600; color: var(--字三); }
.任务卡 .阶段 .态{ margin-left: auto; font-size: 11px; }
.任务卡 .阶段.done{
  opacity: .65;
}
.任务卡 .阶段.done .点{ opacity: 1; }
.任务卡 .阶段.done .名{ color: var(--字二); }
.任务卡 .阶段.done .态{ color: var(--成); }
.任务卡 .阶段.active{
  background: var(--面三);
  color: var(--字一);
}
.任务卡 .阶段.active .点{
  opacity: 1;
  animation: 对脉冲 1.5s ease-in-out infinite;
}
.任务卡 .阶段.active .名{ color: var(--字一); }
.任务卡 .阶段.active .态{ color: var(--讯); font-weight: 600; }

/* ── 任务卡：执行过程流 ── */
.任务卡 .过程{
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--线一);
  max-height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.任务卡 .过程:empty{ display: none; }
.任务卡 .过程行{
  display: flex;
  gap: 8px;
  font-size: 11px;
  line-height: 1.5;
  padding: 3px 6px;
  border-radius: 4px;
}
.任务卡 .过程行:hover{ background: var(--面一); }
.任务卡 .过程行 .标{
  flex: none;
  min-width: 80px;
  color: var(--字三);
  font-weight: 600;
}
.任务卡 .过程行 .内{
  color: var(--字二);
  word-break: break-all;
}
.任务卡 .过程行.思考 .标{ color: var(--水); }
.任务卡 .过程行.工具调用 .标{ color: var(--土); }
.任务卡 .过程行.工具结果 .标{ color: var(--金); }
.任务卡 .过程行.任务答复 .标{ color: var(--火); }

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 主区任务看板 外观
   隔离约定：只引用令牌层 :root 变量；经挂载契约进入主区槽位；
   五行语义色直接引用基调配置的 --木/--火/--土/--金/--水。
   ═══════════════════════════════════════════════════════════ */

.看板外壳{
  display: flex;
  flex-direction: column;
  height: 100%;
  font-family: var(--字族);
  color: var(--字二);
}

/* ── 看板头 ── */
.看板头{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--线一);
  flex: none;
}
.看板头 .标{
  font-size: 15px;
  font-weight: 600;
  color: var(--字一);
  letter-spacing: .02em;
}
.看板头 .次{
  font-size: 11px;
  color: var(--字四);
}
.看板头 .钮{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  color: var(--字三);
  font-size: 12px;
  font-family: var(--字族);
  cursor: pointer;
  transition: color var(--速), border-color var(--速), background var(--速), opacity var(--速);
}
/* 第一个按钮推到右侧，其余紧随（修复原先各钮均 auto 导致的分散布局） */
.看板头 .钮:first-of-type{
  margin-left: auto;
}
.看板头 .钮:hover:not(:disabled){
  color: var(--字一);
  border-color: var(--线三);
  background: var(--面悬);
}
.看板头 .钮:disabled{
  opacity: .55;
  cursor: default;
}
.看板头 .钮 svg{
  width: 14px;
  height: 14px;
}
/* 驱动按钮：主操作，契色高亮 */
.看板头 .钮.主{
  color: var(--契);
  border-color: color-mix(in srgb, var(--契) 45%, transparent);
}
.看板头 .钮.主:hover:not(:disabled){
  color: var(--契字);
  background: var(--契);
  border-color: var(--契);
}
/* 加载态：图标旋转 */
.看板头 .钮.载 svg{
  animation: 看板旋转 1s linear infinite;
}
@keyframes 看板旋转{
  to{ transform: rotate(360deg); }
}

/* ── 驱动状态条 ── */
.驱动条{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 18px;
  font-size: 11px;
  color: var(--字三);
  border-bottom: 1px solid var(--线一);
  background: var(--面一);
  flex: none;
}
.驱动条 .灯{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--字四);
  flex: none;
  transition: background var(--速);
}
.驱动条 .文{
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.驱动条.态-闲 .灯{ background: var(--字四); }
.驱动条.态-行 .灯{ background: var(--契); animation: 看板呼吸 1.2s ease-in-out infinite; }
.驱动条.态-讯 .灯{ background: var(--讯); }
.驱动条.态-成 .灯{ background: var(--成); }
.驱动条.态-险 .灯{ background: var(--险); }
.驱动条.态-险 .文{ color: var(--险); }
@keyframes 看板呼吸{
  0%, 100%{ opacity: 1; }
  50%{ opacity: .35; }
}

/* ── 列组：横向五行分列 ── */
.看板列组{
  flex: 1;
  display: flex;
  gap: 10px;
  padding: 12px 18px 16px;
  overflow-x: auto;
  overflow-y: hidden;
  align-items: stretch;
}
.看板列{
  flex: 1 1 0;
  min-width: 220px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--线一);
  border-radius: var(--圆中);
  background: var(--面一);
  overflow: hidden;
  transition: border-color var(--速);
}
.看板列:hover{
  border-color: var(--线二);
}

/* 列头（五行标识） */
.看板列头{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--线一);
  background: var(--面二);
}
.看板列头 .点{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--列色);
  box-shadow: 0 0 6px color-mix(in srgb, var(--列色) 45%, transparent);
}
.看板列头 .名{
  font-size: 12.5px;
  font-weight: 600;
  color: var(--字一);
}
.看板列头 .角{
  font-size: 10px;
  color: var(--字四);
}
.看板列头 .计{
  margin-left: auto;
  min-width: 20px;
  height: 18px;
  padding: 0 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 99px;
  background: var(--面三);
  font-size: 11px;
  color: var(--字三);
}

/* 列体（可滚动卡片堆） */
.看板列体{
  flex: 1;
  overflow-y: auto;
  padding: 9px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

/* ── 任务卡片：左缘五行色线 ── */
.看板卡{
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 9px 11px 9px 13px;
  border: 1px solid var(--线一);
  border-left: 2px solid color-mix(in srgb, var(--列色) 55%, transparent);
  border-radius: var(--圆小);
  background: var(--面二);
  font-family: var(--字族);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--速), background var(--速), transform var(--速);
}
.看板卡:hover{
  border-color: var(--线三);
  border-left-color: var(--列色);
  background: var(--面悬);
  transform: translateY(-1px);
}
.看板卡 .题{
  font-size: 12.5px;
  font-weight: 500;
  color: var(--字一);
  line-height: 1.45;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.看板卡 .元{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.看板卡 .状{
  padding: 1px 8px;
  border-radius: 99px;
  font-size: 10px;
  color: var(--字三);
  background: var(--面一);
  border: 1px solid var(--线二);
}
.看板卡 .状.行{
  border-color: color-mix(in srgb, var(--列色) 55%, transparent);
  color: var(--列色);
}
.看板卡 .优{
  font-size: 10px;
  color: var(--字四);
}
.看板卡 .承{
  margin-left: auto;
  font-size: 10px;
  color: var(--字三);
}

/* 空态 */
.看板空{
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 12px;
  font-size: 11px;
  color: var(--字四);
  text-align: center;
}

/* ═══════════ 卡片详情弹层 ═══════════ */
.看板弹罩{
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  background: var(--遮罩);
  backdrop-filter: blur(3px);
  animation: 看板淡入 var(--速) ease;
}
@keyframes 看板淡入{
  from{ opacity: 0; }
}
.看板弹层{
  width: min(640px, 100%);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--线二);
  border-radius: var(--圆大);
  background: var(--面二);
  box-shadow: var(--影二);
  animation: 看板浮起 var(--速) ease;
  overflow: hidden;
}
@keyframes 看板浮起{
  from{ opacity: 0; transform: translateY(10px); }
}

/* 弹层头 */
.看板弹层 .弹头{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--线一);
  background: var(--面三);
  flex: none;
}
.看板弹层 .弹标{
  font-size: 13px;
  font-weight: 600;
  color: var(--字三);
}
.看板弹层 .弹状{
  padding: 1px 10px;
  border-radius: 99px;
  border: 1px solid var(--线三);
  font-size: 11px;
}
.看板弹层 .弹关{
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  padding: 0;
  border: none;
  border-radius: var(--圆小);
  background: transparent;
  color: var(--字三);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.看板弹层 .弹关:hover{
  color: var(--字一);
  background: var(--面四);
}
.看板弹层 .弹关 svg{ width: 14px; height: 14px; }

/* 弹层体 */
.看板弹层 .弹体{
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.看板弹层 .弹题{
  font-size: 15px;
  font-weight: 600;
  color: var(--字一);
  line-height: 1.5;
}
.看板弹层 .弹描{
  font-size: 12.5px;
  color: var(--字二);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  padding: 10px 12px;
  border: 1px solid var(--线一);
  border-radius: var(--圆中);
  background: var(--面一);
}
.看板弹层 .弱{ color: var(--字四); }
.看板弹层 .弹空{
  padding: 32px 16px;
  text-align: center;
  font-size: 12px;
  color: var(--字四);
}
.看板弹层 .弹载{
  font-size: 11px;
  color: var(--字四);
}

/* 元信息表 */
.看板弹层 .弹表{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
}
.看板弹层 .元项{
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 10px;
  border: 1px solid var(--线一);
  border-radius: var(--圆小);
  background: var(--面一);
}
.看板弹层 .元名{
  font-size: 10px;
  color: var(--字四);
}
.看板弹层 .元值{
  font-size: 12px;
  color: var(--字一);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 分块（回退/澄清/核验/承接/状态史） */
.看板弹层 .弹块{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.看板弹层 .块题{
  font-size: 11px;
  font-weight: 600;
  color: var(--字三);
  letter-spacing: .04em;
}
.看板弹层 .史注{
  font-size: 12px;
  color: var(--字二);
  line-height: 1.6;
  word-break: break-word;
}
.看板弹层 .回退行{
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  font-size: 12px;
}
.看板弹层 .史迁{
  color: var(--警);
}
.看板弹层 .史者{ color: var(--字三); }
.看板弹层 .史时{ color: var(--字四); font-size: 11px; }
.看板弹层 .弹史{
  display: flex;
  flex-direction: column;
  gap: 0;
  border-left: 1px solid var(--线二);
  margin-left: 4px;
  padding-left: 12px;
}
.看板弹层 .史行{
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  align-items: baseline;
  padding: 5px 0;
  font-size: 12px;
}
.看板弹层 .史行::before{
  content: "";
  position: absolute;
  left: -16px;
  top: 12px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--字四);
  transform: translateX(-2px);
}

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 左栏视图 外观
   隔离约定：
   1. 只引用背景层令牌，不写死任何色值；
   2. 抽屉为覆盖层：贴左栏图标轨（56px）右侧，避让顶栏（46px）与底栏（26px）；
   3. 经「乾坤图标」事件驱动，不触碰布局结构。
   ═══════════════════════════════════════════════════════════ */

/* ── 抽屉容器 ── */
.视图-抽屉{
  position: fixed;
  left: var(--轨宽);
  top: var(--顶高);
  bottom: var(--底高);
  width: min(340px, calc(100vw - 120px));
  z-index: 40;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--线二);
  background: var(--面一);
  box-shadow: 18px 0 40px rgba(0, 0, 0, .35);
  transform: translateX(-104%);
  transition: transform var(--速);
  font-family: var(--字族);
  /* 收起时移出屏幕仍有边缘压在图标轨上：禁用命中，避免拦截点击 */
  pointer-events: none;
  visibility: hidden;
}
.视图-抽屉.开{
  transform: translateX(0);
  pointer-events: auto;
  visibility: visible;
}

/* ── 头部 ── */
.视图-头{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--线一);
  flex: none;
}
.视图-头 .视图-题{
  font-size: 13px;
  color: var(--字一);
}
.视图-头 .视图-数{
  margin-left: auto;
  font-size: 11px;
  color: var(--字四);
}
.视图-头 .视图-关{
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: var(--字三);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.视图-头 .视图-关:hover{
  color: var(--字一);
  background: var(--面二);
}

/* ── 主体 ── */
.视图-体{
  flex: 1;
  overflow: auto;
  padding: 10px 12px 16px;
}
.视图-载, .视图-空{
  padding: 18px 4px;
  font-size: 12px;
  color: var(--字四);
  text-align: center;
}
.视图-错{
  padding: 18px 4px;
  font-size: 12px;
  color: var(--险);
  text-align: center;
}

/* ── 记忆条目 ── */
.视图-记忆{
  padding: 10px 12px;
  margin-bottom: 8px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
}
.视图-记忆.归档{
  opacity: .6;
}
.视图-记忆-内{
  margin: 0 0 6px;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--字二);
  word-break: break-all;
}
.视图-记忆-元{
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-size: 11px;
  color: var(--字四);
}
.视图-记忆-元 em{
  margin-left: auto;
  font-style: normal;
  font-family: var(--字码);
}
.视图-签{
  padding: 1px 8px;
  border-radius: 99px;
  background: var(--面四);
  color: var(--字三);
}
.视图-徽{
  padding: 1px 8px;
  border-radius: 99px;
  font-size: 10px;
}
.视图-徽.警{
  background: var(--面四);
  color: var(--警);
}

/* ── 图谱：模块分组 ── */
.视图-模块{
  margin-bottom: 6px;
  border: 1px solid var(--线一);
  border-radius: var(--圆小);
  background: var(--面二);
}
.视图-模块 summary{
  padding: 8px 12px;
  font-size: 12px;
  font-family: var(--字码);
  color: var(--字二);
  cursor: pointer;
  user-select: none;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.视图-模块 summary::-webkit-details-marker{ display: none; }
.视图-模块 summary::before{
  content: "▸";
  color: var(--字四);
  transition: transform var(--速);
}
.视图-模块[open] summary::before{ transform: rotate(90deg); }
.视图-模块 summary em{
  margin-left: auto;
  font-style: normal;
  font-size: 10px;
  color: var(--字四);
}
.视图-节点{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px 4px 26px;
  font-size: 12px;
}
.视图-节点 b{
  font-weight: 500;
  color: var(--字一);
  font-family: var(--字码);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.视图-种{
  flex: none;
  font-size: 10px;
  padding: 0 6px;
  border-radius: 3px;
  background: var(--面四);
  color: var(--水);
}
.视图-种.函数{ color: var(--火); }
.视图-种.类型{ color: var(--木); }
.视图-种.常量{ color: var(--土); }
.视图-截{
  padding: 4px 12px 8px 26px;
  font-size: 11px;
  color: var(--字四);
}

/* ── 技术栈 ── */
.视图-栈{
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--线一);
}
.视图-栈 h6{
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .10em;
  color: var(--字四);
  text-transform: uppercase;
}
.视图-栈 span{
  display: inline-block;
  margin: 0 6px 6px 0;
  padding: 2px 9px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  font-size: 11px;
  font-family: var(--字码);
  color: var(--字三);
  background: var(--面二);
}

/* ── 文件分组 ── */
.视图-文件组{
  margin-bottom: 6px;
  border: 1px solid var(--线一);
  border-radius: var(--圆小);
  background: var(--面二);
}
.视图-文件组 summary{
  padding: 8px 12px;
  font-size: 12px;
  font-family: var(--字码);
  color: var(--字二);
  cursor: pointer;
  user-select: none;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.视图-文件组 summary::-webkit-details-marker{ display: none; }
.视图-文件组 summary::before{
  content: "▸";
  color: var(--字四);
  transition: transform var(--速);
}
.视图-文件组[open] summary::before{ transform: rotate(90deg); }
.视图-文件组 summary em{
  margin-left: auto;
  font-style: normal;
  font-size: 10px;
  color: var(--字四);
}
.视图-文件{
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 6px 12px 6px 26px;
  border: none;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background var(--速);
}
.视图-文件:hover{
  background: var(--面三);
}
.视图-文件 b{
  font-weight: 500;
  font-size: 12px;
  color: var(--字一);
  font-family: var(--字码);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.视图-文件 em{
  font-style: normal;
  font-size: 10px;
  color: var(--字四);
  font-family: var(--字码);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}

/* ── 阅读覆盖层 ── */
.视图-阅读{
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--遮罩);
  backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
  transition: opacity var(--速);
}
.视图-阅读.开{
  opacity: 1;
  pointer-events: auto;
  visibility: visible;
}
.视图-阅读-面{
  width: min(760px, 92vw);
  max-height: 84vh;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--线二);
  border-radius: var(--圆中);
  background: var(--面一);
  box-shadow: var(--影二);
}
.视图-阅读-头{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--线一);
  flex: none;
}
.视图-阅读-头 .视图-阅读-题{
  font-size: 12px;
  font-family: var(--字码);
  color: var(--字二);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.视图-阅读-头 .视图-阅读-关{
  margin-left: auto;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--字三);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.视图-阅读-头 .视图-阅读-关:hover{
  color: var(--字一);
  background: var(--面二);
}
.视图-阅读-体{
  margin: 0;
  flex: 1;
  overflow: auto;
  padding: 16px 18px;
  font-size: 12px;
  line-height: 1.6;
  font-family: var(--字码);
  color: var(--字二);
  white-space: pre-wrap;
  word-break: break-all;
}
</style>

  <!-- 布局只声明槽位；组件由 乾坤界面.挂载 进入，二者互不知晓对方内部 -->
  <div class="界面-布局">
    <header class="界面-槽位" data-槽位名="顶栏"></header>
    <aside class="界面-槽位" data-槽位名="左栏"></aside>
    <main class="界面-槽位" data-槽位名="主区"></main>
    <footer class="界面-槽位" data-槽位名="底栏"></footer>
  </div>
  <!-- 环境配置：同源托管（8321）走相对路径；预览端口或 file 打开时显式指向数据服务 -->
  <script>
    window.乾坤配置 = {
      道祖: (location.protocol === "http:" && location.port === "8321") ? "" : "http://127.0.0.1:8321"
    };
  </script>
  <!-- 挂载契约必须先于组件脚本加载 -->
  <script>/* ═══════════════════════════════════════════════════════════
   乾坤 · 槽位挂载契约 —— 布局与组件之间的唯一接口
   组件只允许经 乾坤界面.挂载(槽位名, 节点) 进入布局；
   禁止组件直接改写 .界面-* 结构，以此保证布局与组件隔离。
   ═══════════════════════════════════════════════════════════ */
window.乾坤界面 = (function(){
  var 槽位表 = {};
  document.querySelectorAll("[data-槽位名]").forEach(function(槽){
    槽位表[槽.dataset.槽位名] = 槽;
  });

  return {
    /** 只读槽位表（调试用） */
    槽位表: 槽位表,

    /**
     * 挂载组件到槽位
     * @param {string} 名 - 槽位名（顶栏/左栏/主区/底栏）
     * @param {Node|Function} 节点 - DOM 节点，或返回节点的工厂函数
     * @returns {Node|null} 实际挂载的节点；未知槽位返回 null
     */
    挂载: function(名, 节点){
      var 槽 = 槽位表[名];
      if (!槽){ console.warn("[乾坤界面] 未知槽位：" + 名); return null; }
      var 节 = typeof 节点 === "function" ? 节点() : 节点;
      if (!节){ return null; }
      槽.appendChild(节);
      return 节;
    }
  };
})();
</script>
  <script>/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 侧栏图标轨 实现
   职责：
   1. 数据驱动地构建「图标 + 小字」按钮；
   2. 只经 乾坤界面.挂载("左栏", 节点) 入园，绝不改写布局；
   3. 点击派发「乾坤图标」事件（组件间经事件解耦）；
   4. 监听「乾坤图标复位」事件：设置面板关闭/抽屉收起时清除对应高亮。
   ═══════════════════════════════════════════════════════════ */
window.乾坤组件 = (function(){
  // ── 图标 SVG 内联（沿用参考设计语义）──
  var S = {
    对话:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
    看板:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/></svg>',
    记忆:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="2.5"/><path d="M4 5v6c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5V5"/><path d="M4 11v6c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-6"/></svg>',
