<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洪荒 · 界面呈现</title>
  <style>/* ═══════════════════════════════════════════════════════════
   乾坤 · 视觉背景层 —— 只有「主题令牌 + 页面底色」，零布局
   隔离约定：下游（布局层/组件）只允许引用 :root 令牌，
   不得自带色彩字面量；本层不得出现任何网格/定位属性。
   ═══════════════════════════════════════════════════════════ */
:root{
  /* ── 五行基色 ── */
  --木: #6fbf73;
  --火: #e87a4a;
  --土: #d8b36a;
  --金: #c8c8d4;
  --水: #6fb0d3;

  /* ── 主色与状态 ── */
  --契:  #6fd3c2;   /* 主强调 · 契约青 */
  --成:  #5ce0a0;
  --警:  #e8a64a;
  --险:  #e05252;
  --讯:  #6fb0d3;

  /* ── 面材（深 → 浅）── */
  --底:  #0a0d12;
  --面一: #10141b;
  --面二: #141924;
  --面三: #1a212d;
  --面四: #222a38;

  /* ── 线 ── */
  --线一: #1c2330;
  --线二: #262f40;
  --线三: #333e54;

  /* ── 字 ── */
  --字一: #f0f3f8;
  --字二: #c3cad6;
  --字三: #8b94a5;
  --字四: #5b6474;

  /* ── 字体 / 圆角 / 过渡 ── */
  --字族: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --字码: "Cascadia Code", Consolas, monospace;
  --圆小: 6px;
  --圆中: 10px;
  --速:   .16s ease;

  color-scheme: dark;
}

/* ── 页面底色：深空 + 三向微光（只属于背景层）── */
html, body{
  height: 100%;
  margin: 0;
}
body{
  font-family: var(--字族);
  font-size: 13px;
  color: var(--字二);
  background:
    radial-gradient(1100px 500px at 85% -10%, rgba(111, 211, 194, .06), transparent 60%),
    radial-gradient(900px 480px at -10% 110%, rgba(111, 176, 211, .05), transparent 55%),
    radial-gradient(700px 420px at 50% 120%, rgba(216, 179, 106, .04), transparent 60%),
    var(--底);
  -webkit-font-smoothing: antialiased;
}

/* ── 主题级外观：滚动条与选区 ── */
*{
  scrollbar-width: thin;
  scrollbar-color: var(--面四) transparent;
}
*::-webkit-scrollbar{ width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb{ background: var(--面四); border-radius: 4px; }
::selection{ background: rgba(111, 211, 194, .25); }
</style>
  <style>/* ═══════════════════════════════════════════════════════════
   乾坤 · 区域布局层 —— 只有「槽位网格」，零色彩（只引用令牌）
   隔离约定：
   1. 组件代码不得改写 .界面-* 结构与样式；
   2. 组件只能经 挂载契约（分区挂载.js）进入槽位；
   3. 本层不定义组件外观，槽位自身无外观，仅承载与分区。
   ═══════════════════════════════════════════════════════════ */
.界面-布局{
  display: grid;
  /* 左右栏仅承载图标轨（56px 图标列），主区占满 */
  grid-template-columns: 56px minmax(0, 1fr) 56px;
  grid-template-rows: 46px minmax(0, 1fr) 26px;
  grid-template-areas:
    "顶栏 顶栏 顶栏"
    "左栏 主区 右栏"
    "底栏 底栏 底栏";
  height: 100dvh;
}

/* ── 槽位：组件唯一落点，仅分区描线 ── */
.界面-槽位{
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.界面-槽位[data-槽位名="顶栏"]{ grid-area: 顶栏; border-bottom: 1px solid var(--线一); }
.界面-槽位[data-槽位名="左栏"]{ grid-area: 左栏; border-right:  1px solid var(--线一); }
.界面-槽位[data-槽位名="主区"]{ grid-area: 主区; }
.界面-槽位[data-槽位名="右栏"]{ grid-area: 右栏; border-left:   1px solid var(--线一); }
.界面-槽位[data-槽位名="底栏"]{ grid-area: 底栏; border-top:    1px solid var(--线一); }

/* ── 空槽提示：证明布局先于组件独立成立 ── */
.界面-槽位:empty::after{
  content: "槽位待挂载 · " attr(data-槽位名);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  font-family: var(--字码);
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--字四);
}

/* ── 窄屏：侧栏收起，主区独占 ── */
@media (max-width: 760px){
  .界面-布局{
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
      "顶栏"
      "主区"
      "底栏";
  }
  .界面-槽位[data-槽位名="左栏"],
  .界面-槽位[data-槽位名="右栏"]{ display: none; }
}
</style>
  <style>/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 侧栏图标轨 外观
   隔离约定：
   1. 只引用背景层令牌（var(--契) 等），不写死任何色值；
   2. 不触碰 .界面-* 布局结构，本样式仅作用于 .组件-* 自身；
   3. 组件经挂载契约进入槽位，此处只定义外观。
   ═══════════════════════════════════════════════════════════ */

/* ── 图标轨：纵向排列，占满槽位高度 ── */
.组件-图标轨{
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  height: 100%;
  padding: 8px 0;
  box-sizing: border-box;
}

/* ── 图标按钮：图标 + 下方小字 ── */
.组件-图标{
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 0 6px;
  border: none;
  background: transparent;
  color: var(--字三);
  font-family: var(--字族);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.组件-图标:hover{
  color: var(--字一);
  background: var(--面二);
}
.组件-图标 svg{
  width: 22px;
  height: 22px;
}
.组件-图标 em{
  font-style: normal;
  font-size: 10px;
  letter-spacing: .05em;
  color: inherit;
}

/* ── 激活态：主题色 + 左侧指示条 ── */
.组件-图标.是{
  color: var(--契);
}
.组件-图标.是::before{
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 2px;
  border-radius: 2px;
  background: var(--契);
}

/* ── 下方按钮组：相对末位排布 ── */
.组件-图标轨 .组件-末{
  margin-top: auto;
}

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 设置面板 外观
   隔离约定：
   1. 只引用背景层令牌，不写死任何色值；
   2. 面板经「乾坤图标」事件驱动，挂钩主区槽位，不触碰布局结构；
   3. 托盘为覆盖层（遮罩 + 居中面板），随展开/收起切换显隐。
   ═══════════════════════════════════════════════════════════ */

/* ── 托盘遮罩 ── */
.设置-托盘{
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(6, 8, 12, .62);
  backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--速);
}
.设置-托盘.开{
  opacity: 1;
  pointer-events: auto;
}

/* ── 居中面板 ── */
.设置-面板{
  width: min(520px, 90vw);
  max-height: 82vh;
  overflow: auto;
  border: 1px solid var(--线二);
  border-radius: var(--圆中);
  background: var(--面一);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  font-family: var(--字族);
  color: var(--字二);
}

/* ── 头部 ── */
.设置-头{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--线一);
}
.设置-头 b{
  font-size: 14px;
  color: var(--字一);
}
.设置-头 .设置-副{
  font-size: 11px;
  color: var(--字四);
  letter-spacing: .04em;
}
.设置-头 .设置-关{
  margin-left: auto;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--字三);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.设置-头 .设置-关:hover{
  color: var(--字一);
  background: var(--面二);
}

/* ── 区块 ── */
.设置-区块{
  padding: 16px 18px;
  border-bottom: 1px solid var(--线一);
}
.设置-区块:last-child{
  border-bottom: none;
}
.设置-区块 h5{
  margin: 0 0 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .10em;
  color: var(--字四);
  text-transform: uppercase;
}

/* ── 当前模型行（接真实状态）── */
.设置-当前模型{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  margin-bottom: 10px;
}
.设置-当前模型 b{
  font-size: 13px;
  color: var(--字一);
}
.设置-当前模型 em{
  margin-left: auto;
  font-style: normal;
  font-size: 11px;
  color: var(--字四);
}
.设置-当前模型 .点{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--字四);
  flex: none;
}
.设置-当前模型 .点.活{ background: var(--成); }
.设置-当前模型 .点.死{ background: var(--险); }

/* ── 供应商模型清单 ── */
.设置-模型列表{
  display: flex;
  flex-direction: column;
}
.设置-供应商组{
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.设置-供应商组 h6{
  width: 100%;
  margin: 0 0 2px;
  font-size: 11px;
  font-weight: 500;
  color: var(--字三);
  font-family: var(--字码);
}
.设置-模型项{
  padding: 5px 10px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  background: var(--面二);
  color: var(--字二);
  font-family: var(--字码);
  font-size: 11px;
  cursor: pointer;
  transition: border-color var(--速), color var(--速), background var(--速);
}
.设置-模型项:hover{
  border-color: var(--契);
  color: var(--字一);
}
.设置-模型项.当前{
  border-color: var(--契);
  background: var(--面三);
  color: var(--契);
}
.设置-模型错误{
  display: block;
  font-size: 11px;
  color: var(--警);
  padding: 4px 0;
}

/* ── 智能体入口（挪入设置）── */
.设置-智能体{
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  color: var(--字二);
  font-family: var(--字族);
  font-size: 13px;
  cursor: pointer;
  transition: border-color var(--速), background var(--速);
}
.设置-智能体:hover{
  border-color: var(--契);
  background: var(--面三);
}
.设置-智能体 svg{
  width: 18px;
  height: 18px;
  color: var(--契);
}
.设置-智能体 .设置-智能体-右{
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.设置-智能体 .设置-智能体-右 em{
  font-style: normal;
  font-size: 11px;
  color: var(--字四);
}

/* ── 开关行 ── */
.设置-开关行{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  font-size: 13px;
}
.设置-开关行 .设置-开关{
  margin-left: auto;
}
.设置-开关{
  position: relative;
  width: 34px;
  height: 18px;
  border-radius: 99px;
  background: var(--面四);
  border: none;
  cursor: pointer;
  transition: background var(--速);
}
.设置-开关::after{
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--字三);
  transition: transform var(--速), background var(--速);
}
.设置-开关.开{
  background: var(--契);
}
.设置-开关.开::after{
  transform: translateX(16px);
  background: #fff;
}

/* ── 滑动条行 ── */
.设置-滑行{
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--字三);
}
.设置-滑行 input{
  flex: 1;
  accent-color: var(--契);
}

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 顶栏 外观
   隔离约定：只引用令牌；经挂载契约进入顶栏槽位。
   ═══════════════════════════════════════════════════════════ */

.组件-顶栏{
  display: flex;
  align-items: center;
  gap: 14px;
  height: 100%;
  padding: 0 14px;
  box-sizing: border-box;
  font-family: var(--字族);
  color: var(--字二);
}

/* ── logo ── */
.组件-顶栏 .顶栏-标{
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 700;
  font-size: 14px;
  color: var(--字一);
  letter-spacing: .06em;
}
.组件-顶栏 .顶栏-标 svg{
  width: 18px;
  height: 18px;
  color: var(--契);
}

/* ── 右侧区 ── */
.组件-顶栏 .顶栏-右{
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ── 工作区选择器 ── */
.组件-顶栏 .顶栏-工作区{
  position: relative;
  display: flex;
  align-items: center;
}
.组件-顶栏 .顶栏-工作区-钮{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  color: var(--字二);
  font-size: 12px;
  font-family: var(--字码);
  cursor: pointer;
  max-width: 320px;
  transition: color var(--速), border-color var(--速), background var(--速);
}
.组件-顶栏 .顶栏-工作区-钮:hover{
  color: var(--字一);
  border-color: var(--字四);
  background: var(--面三);
}
.组件-顶栏 .顶栏-工作区-钮 .夹{
  width: 15px;
  height: 15px;
  color: var(--契);
  flex: none;
}
.组件-顶栏 .顶栏-工作区-钮 .路{
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 240px;
  direction: rtl;  /* 路径过长时优先显示尾部 */
  text-align: left;
}
.组件-顶栏 .顶栏-工作区-钮 .下{
  width: 12px;
  height: 12px;
  color: var(--字四);
  flex: none;
}

/* 输入面板 */
.组件-顶栏 .顶栏-工作区-面{
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 60;
  width: 360px;
  padding: 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆中);
  background: var(--面一);
  box-shadow: 0 16px 40px rgba(0, 0, 0, .35);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-4px);
  transition: opacity var(--速), transform var(--速), visibility var(--速);
}
.组件-顶栏 .顶栏-工作区-面.开{
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}
.组件-顶栏 .顶栏-工作区-面 .题{
  font-size: 11px;
  color: var(--字四);
  margin-bottom: 8px;
  letter-spacing: .04em;
}
.组件-顶栏 .顶栏-工作区-面 .入{
  width: 100%;
  box-sizing: border-box;
  padding: 8px 10px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  color: var(--字一);
  font-size: 12px;
  font-family: var(--字码);
  outline: none;
}
.组件-顶栏 .顶栏-工作区-面 .入:focus{
  border-color: var(--契);
}
.组件-顶栏 .顶栏-工作区-面 .行{
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}
.组件-顶栏 .顶栏-工作区-面 .行 button{
  padding: 5px 14px;
  border-radius: var(--圆小);
  font-size: 12px;
  cursor: pointer;
  transition: background var(--速), border-color var(--速);
}
.组件-顶栏 .顶栏-工作区-面 .行 .定{
  border: 1px solid transparent;
  background: var(--契);
  color: #fff;
}
.组件-顶栏 .顶栏-工作区-面 .行 .定:hover{
  filter: brightness(1.1);
}
.组件-顶栏 .顶栏-工作区-面 .行 .消{
  border: 1px solid var(--线二);
  background: var(--面二);
  color: var(--字三);
}
.组件-顶栏 .顶栏-工作区-面 .行 .消:hover{
  color: var(--字一);
  background: var(--面三);
}

/* ── 模型标识 ── */
.组件-顶栏 .顶栏-模型{
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--字二);
}
.组件-顶栏 .顶栏-模型 .点{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--契);
  box-shadow: 0 0 8px var(--契);
}
.组件-顶栏 .顶栏-模型 b{
  color: var(--字一);
  font-weight: 600;
}

/* ── 状态徽标 ── */
.组件-顶栏 .顶栏-徽{
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  font-size: 11px;
  color: var(--成);
}
.组件-顶栏 .顶栏-徽 .点{
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--成);
}

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 底栏 外观
   隔离约定：只引用令牌；经挂载契约进入底栏槽位。
   ═══════════════════════════════════════════════════════════ */

.组件-底栏{
  display: flex;
  align-items: center;
  gap: 16px;
  height: 100%;
  padding: 0 12px;
  box-sizing: border-box;
  font-family: var(--字族);
  font-size: 11px;
  color: var(--字三);
  white-space: nowrap;
  overflow: hidden;
}

/* ── 状态项 ── */
.组件-底栏 .底栏-项{
  display: flex;
  align-items: center;
  gap: 6px;
}
.组件-底栏 .底栏-项 b{
  color: var(--字一);
  font-weight: 500;
}

/* ── 引擎在线标 ── */
.组件-底栏 .底栏-在线{
  color: var(--成);
}
.组件-底栏 .底栏-在线 .点{
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--成);
  animation: 底栏脉冲 1.6s ease-in-out infinite;
}
@keyframes 底栏脉冲{
  0%, 100%{ opacity: 1; }
  50%{ opacity: .35; }
}

/* ── 分隔点 ── */
.组件-底栏 .底栏-点{
  color: var(--线三);
}

/* ── 模型 ── */
.组件-底栏 .底栏-模型{
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--契);
}
.组件-底栏 .底栏-模型 .点{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--契);
}

/* ── 右区 ── */
.组件-底栏 .底栏-右{
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

/* ── 版本 ── */
.组件-底栏 .底栏-版{
  color: var(--字四);
  font-family: var(--字码);
}

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 主区对话流 外观
   隔离约定：只引用令牌；经挂载契约进入主区槽位。
   ═══════════════════════════════════════════════════════════ */

.对话外壳{
  display: flex;
  flex-direction: column;
  height: 100%;
  font-family: var(--字族);
  color: var(--字二);
}

/* ── 标题行 ── */
.对话标题{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--线一);
}
.对话标题 .标{
  font-size: 15px;
  font-weight: 600;
  color: var(--字一);
}
.对话标题 .次{
  font-size: 11px;
  color: var(--字四);
}
.对话标题 .态{
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  font-size: 12px;
  color: var(--成);
}
.对话标题 .态 .点{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--成);
  animation: 对脉冲 1.6s ease-in-out infinite;
}
@keyframes 对脉冲{
  0%, 100%{ opacity: 1; }
  50%{ opacity: .35; }
}
.对话标题 .态.停{
  color: var(--警);
}
.对话标题 .态.停 .点{
  background: var(--警);
}

/* ── 消息列表 ── */
.对话流{
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

/* ── 空态 ── */
.对话流.空{
  align-items: center;
  justify-content: center;
  color: var(--字四);
  font-size: 13px;
  text-align: center;
}
.对话流.空 .标{
  font-size: 15px;
  color: var(--字二);
  margin-bottom: 8px;
}
.对话流.空 .次{
  font-size: 11px;
  color: var(--字四);
}

/* ── 首屏欢迎面板（任务 #3） ── */
.欢迎面板{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 520px);
  margin: auto;
  padding: 28px 22px;
  text-align: center;
}
.欢迎-顶{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  background: var(--面一);
  font-size: 11px;
}
.欢迎-徽{
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--契);
  color: #06201c;
  font-weight: 600;
}
.欢迎-名{
  color: var(--字三);
  font-weight: 600;
  letter-spacing: 1px;
}
.欢迎-标{
  font-size: 18px;
  font-weight: 600;
  color: var(--字一);
  letter-spacing: 2px;
}
.欢迎-次{
  font-size: 12px;
  color: var(--字四);
  line-height: 1.6;
  max-width: 420px;
}
.快捷面板{
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 6px;
}
.快捷-项{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--线二);
  border-radius: 99px;
  background: var(--面二);
  color: var(--字二);
  font-family: var(--字族);
  font-size: 12px;
  cursor: pointer;
  transition: border-color var(--速), background var(--速), color var(--速);
}
.快捷-项:hover{
  border-color: var(--契);
  color: var(--契);
  background: rgba(111, 211, 194, .08);
}
.快捷-名{
  font-family: var(--字码);
  font-weight: 600;
  color: var(--契);
}
.快捷-描{
  color: var(--字四);
}
.快捷-项:hover .快捷-描{ color: var(--字三); }

/* ── 事件徽标（对话流里展示看板过程事件）── */
.气泡 .徽{
  display: inline-block;
  padding: 1px 8px;
  margin-right: 6px;
  border: 1px solid var(--契);
  border-radius: 99px;
  font-size: 10px;
  color: var(--契);
  background: var(--面一);
}
.气泡 .徽.ok{
  border-color: #4ade80;
  color: #4ade80;
}
.气泡 .次{
  display: inline-block;
  margin-top: 4px;
  font-size: 10px;
  color: var(--字四);
  font-family: var(--字码);
}
.气泡 .思 pre{
  margin: 6px 0 0 0;
  padding: 8px 10px;
  background: var(--面二);
  border-radius: var(--圆小);
  font-family: var(--字码);
  font-size: 11px;
  color: var(--字三);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ── 系统消息 ── */
.讯{
  font-size: 12px;
  color: var(--字四);
  padding: 8px 12px;
  border: 1px solid var(--线一);
  border-radius: var(--圆小);
  background: var(--面一);
}
.讯 b{ color: var(--字二); }

/* ── 消息 ── */
.讯息{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.讯息.己{ align-items: flex-end; }
.讯息.对{ align-items: flex-start; }

.讯息 .谁{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--字三);
}
.讯息 .谁 .名{
  font-weight: 600;
  color: var(--字二);
}
.讯息 .谁 .时{ color: var(--字四); }
.讯息 .谁 .徽{
  padding: 1px 7px;
  border-radius: 99px;
  font-size: 10px;
  color: var(--契);
  border: 1px solid var(--线二);
}

/* ── 气泡 ── */
.气泡{
  max-width: min(72%, 640px);
  padding: 11px 14px;
  border-radius: var(--圆中);
  font-size: 13px;
  line-height: 1.6;
  background: var(--面二);
  border: 1px solid var(--线二);
}
.讯息.己 .气泡{
  background: var(--面三);
  border-color: var(--线三);
}
.气泡 p{ margin: 0 0 8px; }
.气泡 p:last-child{ margin-bottom: 0; }
.气泡 b{ color: var(--字一); }
.气泡 code{
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--面四);
  font-family: var(--字码);
  font-size: 12px;
}

/* ── 加载占位 ── */
.气泡.载{
  color: var(--字三);
  letter-spacing: 2px;
  animation: 对闪 1s ease-in-out infinite;
}
@keyframes 对闪{ 50%{ opacity: .4; } }

/* ── 思考过程折叠块 ── */
.气泡 .思{
  margin-bottom: 8px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面一);
  padding: 6px 10px;
  font-size: 12px;
  color: var(--字三);
}
.气泡 .思 summary{
  cursor: pointer;
  color: var(--字四);
  font-size: 11px;
  user-select: none;
}
.气泡 .思 div{
  margin-top: 6px;
  white-space: pre-wrap;
  line-height: 1.5;
}

/* ── 工具卡 ── */
.工具{
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面一);
  overflow: hidden;
  font-size: 12px;
}
.工具 > header{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--线一);
  color: var(--字二);
}
.工具 > header svg{
  width: 14px;
  height: 14px;
  color: var(--契);
}
.工具 > header .名{ font-weight: 600; }
.工具 > header .状{
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--成);
}
.工具 > header .状.行{ color: var(--讯); }
.工具 > header .状.等{ color: var(--警); }
.工具 pre{
  margin: 0;
  padding: 11px 12px;
  overflow-x: auto;
  font-family: var(--字码);
  font-size: 12px;
  line-height: 1.55;
  color: var(--字二);
  background: var(--面一);
}
.工具 pre .加{ color: var(--成); }
.工具 pre .删{ color: var(--险); }

/* ── 审批区 ── */
.审批{
  margin-top: 4px;
  padding: 12px 14px;
  border: 1px solid var(--线三);
  border-radius: var(--圆中);
  background: var(--面二);
}
.审批 > header{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--字一);
}
.审批 > header .叹{
  color: var(--警);
}
.审批 .描{
  margin: 8px 0 11px;
  font-size: 12px;
  color: var(--字三);
}
.审批 .排{
  display: flex;
  gap: 8px;
}
.审批 .排 button{
  padding: 6px 14px;
  border-radius: var(--圆小);
  font-size: 12px;
  font-family: var(--字族);
  cursor: pointer;
  border: 1px solid var(--线二);
  background: var(--面三);
  color: var(--字二);
  transition: border-color var(--速), background var(--速), color var(--速);
}
.审批 .排 .准{
  border-color: var(--契);
  color: var(--契);
}
.审批 .排 .准:hover{ background: rgba(111, 211, 194, .12); }
.审批 .排 .否:hover{ border-color: var(--险); color: var(--险); }

/* ── 输入条 ── */
.对话输入{
  padding: 12px 18px;
  border-top: 1px solid var(--线一);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.对话输入 .区{
  display: flex;
  gap: 8px;
}
.对话输入 textarea{
  flex: 1;
  resize: none;
  min-height: 38px;
  max-height: 120px;
  padding: 9px 12px;
  border: 1px solid var(--线二);
  border-radius: var(--圆小);
  background: var(--面二);
  color: var(--字一);
  font-family: var(--字族);
  font-size: 13px;
  line-height: 1.5;
  outline: none;
  transition: border-color var(--速);
}
.对话输入 textarea:focus{ border-color: var(--契); }
.对话输入 textarea::placeholder{ color: var(--字四); }
.对话输入 .发{
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  border: none;
  border-radius: var(--圆小);
  background: var(--契);
  color: #06201c;
  font-family: var(--字族);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity var(--速);
}
.对话输入 .发:hover{ opacity: .85; }
.对话输入 .发 svg{ width: 14px; height: 14px; }
.对话输入 .足{
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  color: var(--字四);
}

/* ═══ 以下为与参考设计对齐的补充样式 ═══ */

/* ── 标题区 tag + 图标按钮 ── */
.对话标题 .火标{
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 600;
  color: var(--火);
  border: 1px solid rgba(232, 122, 74, .4);
  background: rgba(232, 122, 74, .1);
}
.对话标题 .钮{
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--字三);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.对话标题 .钮:hover{ color: var(--字一); background: var(--面二); }
.对话标题 .钮 svg{ width: 14px; height: 14px; }

/* ── 头像 ── */
.讯息 .谁 .像{
  width: 22px;
  height: 22px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: var(--面三);
  color: var(--字二);
  font-size: 11px;
  font-weight: 600;
}
.讯息 .谁 .像 svg{ width: 14px; height: 14px; }
.讯息.对 .谁 .像{ background: rgba(111, 211, 194, .15); color: var(--契); }

/* ── 工具卡：耗时 ms ── */
.工具 > header .ms{
  margin-left: 8px;
  font-size: 10px;
  color: var(--字四);
  font-family: var(--字码);
}
.工具 > header .状.ms末{ margin-left: auto; }

/* ── 运行中旋转 ── */
.工具 > header .状.行 .轮{
  width: 10px;
  height: 10px;
  border: 1.5px solid var(--线三);
  border-top-color: var(--讯);
  border-radius: 50%;
  animation: 对转 .8s linear infinite;
}
@keyframes 对转{ to{ transform: rotate(360deg); } }

/* ── 运行测试卡：tests 列表 ── */
.工具 ul.测{
  margin: 0;
  padding: 10px 12px;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-family: var(--字码);
  font-size: 12px;
}
.工具 ul.测 li{
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--字二);
}
.工具 ul.测 li i{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--字四);
}
.工具 ul.测 li em{
  margin-left: auto;
  font-style: normal;
  color: var(--字四);
}

/* ── 输入条工具行 ── */
.对话输入 .行{
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.对话输入 .行 .ico{
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--字三);
  cursor: pointer;
  transition: color var(--速), background var(--速);
}
.对话输入 .行 .ico:hover{ color: var(--字一); background: var(--面二); }
.对话输入 .行 .ico svg{ width: 15px; height: 15px; }
.对话输入 .行 .ctx{
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--字三);
}
.对话输入 .行 .ctx .点{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--火);
}
.对话输入 .行 .迷你{
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px solid var(--线二);
  background: var(--面二);
  color: var(--字三);
  font-family: var(--字族);
  font-size: 11px;
  cursor: pointer;
  transition: border-color var(--速), color var(--速);
}
.对话输入 .行 .迷你.选{
  border-color: var(--契);
  color: var(--契);
}

/* ── 五行任务进度卡 ── */
.任务卡{
  max-width: min(72%, 640px);
  padding: 12px 14px;
  border-radius: var(--圆中);
  background: var(--面二);
  border: 1px solid var(--线二);
  font-size: 12px;
}
.任务卡 .头{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.任务卡 .头 b{ color: var(--字一); font-size: 13px; }
.任务卡 .头 .状{ color: var(--字三); font-size: 11px; }
.任务卡 .流{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.任务卡 .阶段{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 6px;
  background: var(--面一);
  color: var(--字四);
  transition: background .3s, color .3s;
}
.任务卡 .阶段 .点{
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
  opacity: .35;
}
.任务卡 .阶段 .名{ font-weight: 600; color: var(--字三); }
.任务卡 .阶段 .态{ margin-left: auto; font-size: 11px; }
.任务卡 .阶段.done{
  opacity: .65;
}
.任务卡 .阶段.done .点{ opacity: 1; }
.任务卡 .阶段.done .名{ color: var(--字二); }
.任务卡 .阶段.done .态{ color: var(--成); }
.任务卡 .阶段.active{
  background: var(--面三);
  color: var(--字一);
}
.任务卡 .阶段.active .点{
  opacity: 1;
  animation: 对脉冲 1.5s ease-in-out infinite;
}
.任务卡 .阶段.active .名{ color: var(--字一); }
.任务卡 .阶段.active .态{ color: var(--讯); font-weight: 600; }

/* ── 任务卡：执行过程流 ── */
.任务卡 .过程{
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--线一);
  max-height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.任务卡 .过程:empty{ display: none; }
.任务卡 .过程行{
  display: flex;
  gap: 8px;
  font-size: 11px;
  line-height: 1.5;
  padding: 3px 6px;
  border-radius: 4px;
}
.任务卡 .过程行:hover{ background: var(--面一); }
.任务卡 .过程行 .标{
  flex: none;
  min-width: 80px;
  color: var(--字三);
  font-weight: 600;
}
.任务卡 .过程行 .内{
  color: var(--字二);
  word-break: break-all;
}
.任务卡 .过程行.思考 .标{ color: var(--水); }
.任务卡 .过程行.工具调用 .标{ color: var(--土); }
.任务卡 .过程行.工具结果 .标{ color: var(--金); }
.任务卡 .过程行.任务答复 .标{ color: var(--火); }

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 主区任务看板 外观
   隔离约定：只引用令牌；经挂载契约进入主区槽位；五行色为看板语义色。
   ═══════════════════════════════════════════════════════════ */

/* 五行语义色（看板组件私有，不污染背景令牌） */
.看板外壳{
  --木色: #4ade80;
  --火色: #f87171;
  --土色: #fbbf24;
  --金色: #eab308;
  --水色: #60a5fa;
}

.看板外壳{
  display: flex;
  flex-direction: column;
  height: 100%;
  font-family: var(--字族);
  color: var(--字二);
}

/* ── 看板头 ── */
.看板头{
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--线一);
  flex: none;
}
.看板头 .标{
  font-size: 15px;
  font-weight: 600;
  color: var(--字一);
}
.看板头 .次{
  font-size: 11px;
  color: var(--字四);
}
.看板头 .钮{
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border: 1px solid var(--线二);

   乾坤 · 槽位挂载契约 —— 布局与组件之间的唯一接口

   ═══════════════════════════════════════════════════════════ */
window.乾坤界面 = (function(){
  var 槽位表 = {};
  document.querySelectorAll("[data-槽位名]").forEach(function(槽){

  });

  return {
    /** 只读槽位表（调试用） */
    槽位表: 槽位表,

    /**
     * 挂载组件到槽位
     * @param {string} 名 - 槽位名（顶栏/左栏/主区/右栏/底栏）
     * @param {Node|Function} 节点 - DOM 节点，或返回节点的工厂函数
     * @returns {Node|null} 实际挂载的节点；未知槽位返回 null
     */
    挂载: function(名, 节点){
      var 槽 = 槽位表[名];
      if (!槽){ console.warn("[乾坤界面] 未知槽位：" + 名); return null; }
      var 节 = typeof 节点 === "function" ? 节点() : 节点;
      if (!节){ return null; }
      槽.appendChild(节);
      return 节;
    }
  };
})();

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 设置面板 实现
   职责：
   1. 监听「乾坤图标」事件（键=设置）→ 展开/收起；
   2. 构建居中设置面板，内含 模型 + 智能体（独立模型配置）+ 权限 + 温度；
   3. 只读写自身 DOM，不触碰布局结构；经事件与图标轨解耦。
   ═══════════════════════════════════════════════════════════ */
window.乾坤设置 = (function(){
  // ── 后端地址：由页面模板注入 window.乾坤配置；缺省同源 ──
  function 后端(){
    return (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
  }
  // ── 文本转义：接口数据进 DOM 前一律过一遍 ──
  function 名(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ── 构建面板 DOM ──
  function 构建(){
    var 托盘 = document.createElement("div");
    托盘.className = "设置-托盘";

    var 面板 = document.createElement("div");
    面板.className = "设置-面板";

    // 头部
    var 头 = document.createElement("div");
    头.className = "设置-头";
    头.innerHTML = "<b>设置</b><span class=\"设置-副\">道基 · 模型与守卫</span>";
    var 关 = document.createElement("button");
    关.className = "设置-关";
    关.setAttribute("aria-label", "关闭设置");
    关.innerHTML = "<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg>";
    头.appendChild(关);
    面板.appendChild(头);

    // ── 模型区块（接真实 /api/llm/status · /models · /select）──
    var 模型 = 模型区块();
    面板.appendChild(模型.块);

    // ── 智能体区块（挪入设置）──
    var 智块 = 区块("智能体");
    智块.appendChild(智能体行());
    面板.appendChild(智块);

    // ── 权限区块 ──
    var 权块 = 区块("工具权限");
    [["代码库读写", true], ["终端执行", true], ["运行测试", true]].forEach(function(项){
      权块.appendChild(开关行(项[0], 项[1]));
    });
    面板.appendChild(权块);

    // ── 温度区块 ──
    var 温块 = 区块("温度");
    温块.appendChild(滑动行());
    面板.appendChild(温块);

    托盘.appendChild(面板);

    // ── 交互：关闭 ──
    关.addEventListener("click", function(){ 托盘.classList.remove("开"); });
    托盘.addEventListener("click", function(e){ if (e.target === 托盘){ 托盘.classList.remove("开"); } });
    document.addEventListener("keydown", function(e){ if (e.key === "Escape"){ 托盘.classList.remove("开"); } });

    return { 托盘: 托盘, 刷新模型: 模型.刷新 };
  }

  // ── 模型区块：当前选择 + 供应商模型清单 + 点击切换 ──
  function 模型区块(){
    var 块 = 区块("模型");
    var 当前 = document.createElement("div");
    当前.className = "设置-当前模型";
    当前.innerHTML = "<span class=\"点\"></span><b>未加载</b>";
    var 列表 = document.createElement("div");
    列表.className = "设置-模型列表";
    块.appendChild(当前);
    块.appendChild(列表);

    var 现选 = { 供应商: "", 模型: "" };

    function 画当前(d){
      if (d && d.配置 && d.当前选择){
        现选.供应商 = d.当前选择.供应商 || "";
        现选.模型 = d.当前选择.模型 || "";
        当前.innerHTML = "<span class=\"点 活\"></span><b>" + 名(现选.模型) + "</b><em>" + 名(现选.供应商) + " · 已接入</em>";
      } else {
        当前.innerHTML = "<span class=\"点 死\"></span><b>LLM 池未装配</b><em>请配置供应商密钥</em>";
      }
    }
    function 画列表(结果){
      列表.innerHTML = "";
      (结果 || []).forEach(function(项){
        var 组 = document.createElement("div");
        组.className = "设置-供应商组";
        var 题 = document.createElement("h6");
        题.textContent = 项.供应商;
        组.appendChild(题);
        if (项.模型 && 项.模型.length){
          项.模型.forEach(function(m){
            var b = document.createElement("button");
            b.className = "设置-模型项" + (项.供应商 === 现选.供应商 && m.id === 现选.模型 ? " 当前" : "");
            b.textContent = m.id;
            b.addEventListener("click", function(){ 选择(项.供应商, m.id); });
            组.appendChild(b);
          });
        } else {
          var 错 = document.createElement("span");
          错.className = "设置-模型错误";
          错.textContent = 项.错误 || "无可用模型";
          组.appendChild(错);
        }
        列表.appendChild(组);
      });
    }
    function 选择(供应商, 模型){
      fetch(后端() + "/api/llm/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 供应商: 供应商, 模型: 模型 })
      })
      .then(function(r){
        if (!r.ok){ throw new Error("HTTP " + r.status); }
        return r.json();
      })
      .then(function(){ 现选 = { 供应商: 供应商, 模型: 模型 }; 刷新(); })
      .catch(function(){
        当前.innerHTML = "<span class=\"点 死\"></span><b>切换失败</b><em>" + 名(供应商) + " · " + 名(模型) + "</em>";
      });
    }
    function 刷新(){
      fetch(后端() + "/api/llm/status")
        .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
        .then(function(d){ 画当前(d); })
        .catch(function(){
          当前.innerHTML = "<span class=\"点 死\"></span><b>数据服务未在线</b><em>需启动后端 127.0.0.1:8321</em>";
        });
      fetch(后端() + "/api/llm/models")
        .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
        .then(function(d){ 画列表(d.结果); })
        .catch(function(){
          列表.innerHTML = "<span class=\"设置-模型错误\">模型清单拉取失败（供应商端点不可达）</span>";
        });
    }

    return { 块: 块, 刷新: 刷新 };
  }

  // ── 新区块 ──
  function 区块(名){
    var 块 = document.createElement("section");
    块.className = "设置-区块";
    var h = document.createElement("h5");
    h.textContent = 名;
    块.appendChild(h);
    return 块;
  }

  // ── 智能体行（独立模型配置入口）──
  function 智能体行(){
    var 行 = document.createElement("button");
    行.className = "设置-智能体";
    var svg = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"7\" width=\"16\" height=\"12\" rx=\"2\"/><path d=\"M12 7V4M8 4h8\"/><circle cx=\"9\" cy=\"13\" r=\"1\"/><circle cx=\"15\" cy=\"13\" r=\"1\"/><path d=\"M9 16.5h6\"/></svg>";
    var 右 = document.createElement("span");
    右.className = "设置-智能体-右";
    右.innerHTML = "<b>独立模型配置</b><em>各智能体可独立接入不同模型 · 平时低频率使用</em>";
    行.innerHTML = svg;
    行.appendChild(右);
    行.setAttribute("title", "智能体 · 独立模型配置");
    return 行;
  }

  // ── 开关行 ──
  function 开关行(名, 开){
    var 行 = document.createElement("label");
    行.className = "设置-开关行";
    行.innerHTML = "<span>" + 名 + "</span>";
    var 开关 = document.createElement("button");
    开关.className = "设置-开关" + (开 ? " 开" : "");
    开关.setAttribute("aria-label", 名);
    开关.addEventListener("click", function(e){
      e.preventDefault();
      开关.classList.toggle("开");
    });
    行.appendChild(开关);
    return 行;
  }

  // ── 滑动行 ──
  function 滑动行(){
    var 行 = document.createElement("div");
    行.className = "设置-滑行";
    行.innerHTML = "<span>严谨</span><input type=\"range\" min=\"0\" max=\"1\" step=\"0.1\" value=\"0.7\"><span>发散</span>";
    return 行;
  }

  // 托盘实例化后挂到 body（覆盖层），初始收起
  var 实例 = 构建();
  var 托盘 = 实例.托盘;
  document.body.appendChild(托盘);

  // ── 监听图标事件：键=设置 → 展开/收起；展开时拉取真实模型状态 ──
  document.addEventListener("乾坤图标", function(e){
    if (e.detail && e.detail.键 === "设置"){
      var 开 = 托盘.classList.toggle("开");
      if (开){ 实例.刷新模型(); }
    }
  });

  return { 托盘: 托盘 };
})();

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 顶栏 实现
   职责：构建顶栏节点（logo · 工作区选择器 · 模型标识 · 状态徽标），

window.乾坤顶栏 = (function(){
  function 后端(){

  }

  function 建(){
    var 顶 = document.createElement("header");

    var 标 = document.createElement("span");
    标.className = "顶栏-标";
    标.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l3 5 5 1-4 4 1 6-5-3-5 3 1-6-4-4 5-1z"/></svg>洪荒';
    顶.appendChild(标);

    // ── 工作区选择器：定义项目工作区根（文件面板/智能体产出都基于它）──
    顶.appendChild(工作区选择器());

    // 右侧区
    var 右 = document.createElement("div");
    右.className = "顶栏-右";

    // 模型标识（真实 LLM）
    var 模型 = document.createElement("span");
    模型.className = "顶栏-模型";
    模型.innerHTML = '<i class="点"></i><b>…</b>';
    右.appendChild(模型);
    fetch(后端() + "/api/llm/status")
      .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
      .then(function(d){ 模型.querySelector("b").textContent = (d && d.当前选择 && d.当前选择.模型) || "未接入"; })
      .catch(function(){ 模型.querySelector("b").textContent = "未接入"; });

    // 状态徽标
    var 徽 = document.createElement("span");
    徽.className = "顶栏-徽";
    徽.innerHTML = '<i class="点"></i>先审后写';
    右.appendChild(徽);

    顶.appendChild(右);
    return 顶;

  // ── 工作区选择器：按钮 + 内联输入面板 ──
  function 工作区选择器(){

    外.className = "顶栏-工作区";

    var 钮 = document.createElement("button");
    钮.className = "顶栏-工作区-钮";
    钮.type = "button";
    钮.innerHTML =
      '<svg class="夹" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>' +
      '<span class="路">…</span>' +
      '<svg class="下" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';

    // 输入面板（默认隐藏）
    var 面 = document.createElement("div");
    面.className = "顶栏-工作区-面";
    面.innerHTML =
      '<div class="题">项目工作区根目录</div>' +
      '<input class="入" placeholder="例如 F:\\洪荒 - 世界 或 ./项目" />' +
      '<div class="行">' +
        '<button class="定" type="button">确定</button>' +
        '<button class="消" type="button">取消</button>' +
      '</div>';
    外.appendChild(钮);
    外.appendChild(面);

    var 入 = 面.querySelector(".入");
    var 路 = 钮.querySelector(".路");

    // 打开面板：预填当前值
    function 开(){
      fetch(后端() + "/api/workspace")
        .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
        .then(function(d){ 入.value = d.工作区 || ""; })
        .catch(function(){ 入.value = ""; });
      面.classList.add("开");
      入.focus();
    }
    function 关(){ 面.classList.remove("开"); }

    钮.addEventListener("click", function(){ 面.classList.contains("开") ? 关() : 开(); });
    面.querySelector(".消").addEventListener("click", 关);
    document.addEventListener("keydown", function(e){ if (e.key === "Escape"){ 关(); } });
    document.addEventListener("click", function(e){
      if (!外.contains(e.target)){ 关(); }
    });

    // 确定：POST 设置工作区
    面.querySelector(".定").addEventListener("click", function(){
      var 路径 = 入.value.trim();
      if (!路径){ 入.focus(); return; }
      fetch(后端() + "/api/workspace", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 工作区: 路径 })
      })
      .then(function(r){ if (!r.ok){ return r.text().then(function(t){ throw new Error(t); }); } return r.json(); })
      .then(function(d){
        路.textContent = d.工作区 || 路径;
        路.title = d.工作区 || 路径;
        关();
      })
      .catch(function(e){
        路.textContent = "目录无效";
        setTimeout(function(){ 载入当前(); }, 1200);
      });
    });

    // 初始载入当前工作区
    载入当前();
    function 载入当前(){
      fetch(后端() + "/api/workspace")
        .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
        .then(function(d){ 路.textContent = d.工作区 || "./"; 路.title = d.工作区 || "./"; })
        .catch(function(){ 路.textContent = "./"; });
    }

    return 外;
  }

  return { 建: 建 };
})();

window.乾坤对话 = (function(){

  var 数据 = [];

  // ── 快捷指令注册表（可扩展）：内置 /清空、/刷新 两条；外部可继续 register_command ──
  var 指令表 = {
    "清空": function(ctx){ return Promise.resolve(cmd_clear(ctx)); },

  };

  // 注册自定义快捷指令（用于扩展更多 / 指令）
  function register_command(名, 处理器){
    if (!名 || typeof 处理器 !== "function"){ return; }
    指令表[String(名).replace(/^\//, "")] = 处理器;
  }

  // 解析快捷指令：/开头文本拆为 { name, args }；不匹配返回 null
  function parse_command(输入){
    var 文 = String(输入 == null ? "" : 输入).trim();
    if (!文 || 文.charAt(0) !== "/"){ return null; }
    var 段 = 文.replace(/^\/+/, "").split(/\s+/);

    if (!名){ return null; }

  }

  // /清空：清空当前会话的消息列表渲染与数据；保留会话标识与会话元数据
  function cmd_clear(ctx){
    ctx = ctx || {};
    // 会话标识：当前会话ID（来自外部依赖或顶部状态），存在则保留以便恢复上下文
    var 会话id = (ctx.会话id != null ? ctx.会话id : (window.乾坤对话.会话id || ""));

    window.乾坤对话.会话id = 会话id;
    window.乾坤对话.会话元数据 = 会话元数据;
  }

  // /刷新：触发当前会话消息的重新拉取；保持渲染与原发送链路一致
  function cmd_refresh(ctx){
    ctx = ctx || {};
    var 后端 = (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
    var 会话id = (ctx.会话id != null ? ctx.会话id : (window.乾坤对话.会话id || ""));
    // 取最近一次驱动会话ID（看板驱动台保留的当前会话）作为真实拉取目标
    var 真实会话id = 会话id || (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.当前会话id) || "";
    // 不引入新依赖：复用道祖已有 /api/dev/chat 回放历史会话（看板驱动台记录）
    var 端点 = 后端 + "/api/dev/sessions/" + encodeURIComponent(真实会话id || "current");

      .then(function(r){ return r.ok ? r.json() : { 事件: [] }; })

            数据.push({ 类:"讯息", 方:"对", 名:ev.角色 || "系统", 时:"刚刚", 文:ev.内容.replace(/</g,"&lt;") });
          }
        });
        var 流 = ctx.流 || document.querySelector(".对话外壳 .对话流");
        if (流){
          流.innerHTML = "";
          if (数据.length){
            流.classList.remove("空");
            流.classList.add("有内容");

      });
  }

  // 未知指令：在对话区给出友好提示，不抛错、不影响后续输入
  function on_unknown_command(名, 流){
    if (流){
      流.classList.remove("空");
      流.classList.add("有内容");
      var 泡 = document.createElement("div");
      泡.className = "讯";
      // 净化指令名后再拼接，避免 XSS（用户输入的命令名不可信）
      var 转义 = 净化(String(名 || ""));
      var 时间 = document.createElement("span");
      时间.textContent = "系统 · 刚刚";
      泡.appendChild(时间);
      泡.appendChild(document.createTextNode("未知指令 /"));
      var 加粗 = document.createElement("b");
      加粗.textContent = 转义;
      泡.appendChild(加粗);
      泡.appendChild(document.createTextNode("，已忽略。可用：/清空、/刷新"));
      流.appendChild(泡);
      流.scrollTop = 流.scrollHeight;
    }
  }

  // 指令分发：解析 → 路由到内置或注册处理器；统一异常捕获与提示反馈
  function dispatch_command(parsed, ctx){
    ctx = ctx || {};
    if (!parsed || !parsed.name){
      on_unknown_command("", ctx.流);
      return Promise.resolve();
    }
    var 处理器 = 指令表[parsed.name];
    if (!处理器){
      on_unknown_command(parsed.name, ctx.流);
      return Promise.resolve();
    }
    try {
      return Promise.resolve(处理器(ctx)).catch(function(){
        on_unknown_command(parsed.name, ctx.流);
      });
    } catch (e){
      on_unknown_command(parsed.name, ctx.流);
      return Promise.resolve();
    }
  }

  // 首屏欢迎语：消息列表为空时调用；展示引导文案与快捷指令按钮
  function render_welcome_panel(容器){
    if (!容器){ return; }
    容器.innerHTML = "";
    容器.classList.add("空");
    容器.classList.remove("有内容");
    var 欢迎 = document.createElement("div");

    欢迎.innerHTML =
      '<div class="欢迎-顶">' +
        '<span class="欢迎-徽">紫霄宫</span>' +

      '</div>' +

        '<button class="快捷-项" data-cmd="刷新"><span class="快捷-名">/刷新</span><span class="快捷-描">重新拉取最新消息</span></button>' +
      '</div>';
    容器.appendChild(欢迎);
    // 绑定点击 → 写入输入框并触发分发
    // 注意：textarea 引用需在挂载到主区后才能稳定查询；首次空态渲染时输入框可能未挂载，按需重查
    var 框 = ctx_取输入框();
    var 流 = 容器;
    function ctx_取输入框(){

    }
    Array.prototype.forEach.call(欢迎.querySelectorAll(".快捷-项"), function(btn){
      btn.addEventListener("click", function(){

        var 框2 = ctx_取输入框();
        if (框2){ 框2.value = "/" + 名; 框2.focus(); }
        dispatch_command({ name: 名, args: [] }, { 流: 流 });
      });
    });
  }

  // ── 渲染入口：挂到主区 ──
  function 建(){
    var 外 = document.createElement("div");
    外.className = "对话外壳 主区视图";
    外.setAttribute("data-视图", "对话");

    // 标题行（无当前任务时显示空态提示）
    var 标题 = document.createElement("div");
    标题.className = "对话标题";
    标题.innerHTML = '<span class="标">紫霄宫对话</span><span class="次">与道祖对话，发布任务或自由提问</span>';

    态.className = "态";
    态.innerHTML = '<i class="点"></i>空闲';
    标题.appendChild(态);
    外.appendChild(标题);

    // 消息流
    var 流 = document.createElement("div");

      流.classList.remove("空");
      数据.forEach(function(m){ 流.appendChild(渲染(m)); });

    输.innerHTML =
      '<div class="行">' +
        '<button class="ico" title="附件">' + I.附 + '</button>' +

      '<div class="足"><span>⌘↵ 发送 · Esc 取消</span></div>';
    外.appendChild(输);

    // 发送逻辑：真实调用后端 道祖对话 /api/dev/chat
    var 框 = 输.querySelector("textarea");
    var 发 = 输.querySelector(".发");
    function 发送(){
      var 文 = 框.value.trim();
      if (!文){ return; }

      // 识别 / 指令：分发到内置或注册指令处理器
      var 解析 = parse_command(文);
      if (解析){
        dispatch_command(解析, { 流: 流 });
        框.value = "";
        流.scrollTop = 流.scrollHeight;
        return;
      }

      流.appendChild(渲染({ 类:"讯息", 方:"己", 名:"道祖", 字:"九", 时:"刚刚", 文:文.replace(/</g,"&lt;") }));

      流.scrollTop = 流.scrollHeight;

      // 加载占位
      var 载 = 流.appendChild(加载中());
      流.scrollTop = 流.scrollHeight;

      var 后端 = (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
      流式对话(后端, 文, 流, 载);
    }
    发.addEventListener("click", 发送);

  // ── 流式对话：POST /api/dev/chat/stream，按帧解析 SSE，打字机式追加 ──
  function 流式对话(后端, 文, 流, 载){
    fetch(后端 + "/api/dev/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 消息: 文 })
    })
    .then(function(r){
      if (!r.ok || !r.body){ throw new Error("HTTP " + r.status); }
      var 读 = r.body.getReader();
      var 解码 = new TextDecoder("utf-8");
      var 缓冲 = "";
      var 泡 = null;       // 回复气泡 DOM（首 delta 到达时建立）
      var p = null;        // 气泡内 <p> 文本容器
      var 回复文本 = "";
      var 任务id = null;
      var 阶段 = "接待中";   // RUN_FINISHED 携带的会话阶段：接待中 / 待确认

      function 建泡(){
        if (泡) return;
        泡 = 渲染({ 类:"讯息", 方:"对", 名:"道祖", 时:"刚刚", 文:"" });
        流.appendChild(泡);
        p = 泡.querySelector(".气泡 p");
      }
      function 追加(delta){
        建泡();
        回复文本 += delta;
        if (p){ p.innerHTML = 净化(回复文本); }
        流.scrollTop = 流.scrollHeight;
      }
      function 收尾(){
        if (载 && 载.parentNode){ 载.remove(); }
        if (!泡 && !任务id){
          流.appendChild(渲染({ 类:"讯息", 方:"对", 名:"道祖", 时:"刚刚", 文:"（无回复）" }));
        }
        if (任务id){
          var 卡 = 建任务卡(任务id);
          流.appendChild(卡);
          流.scrollTop = 流.scrollHeight;
          轮询任务卡(卡, 任务id);
        } else if (阶段 === "待确认"){
          // 道祖已对齐需求，处于待确认：建确认卡，5 秒无人确认则自动确认发布建任务卡
          var 确认卡 = 建待确认卡(后端, 流);
          流.appendChild(确认卡);
          流.scrollTop = 流.scrollHeight;
        }
      }
      function 泵(){
        return 读.read().then(function(结果){
          if (结果.done){ 收尾(); return; }
          缓冲 += 解码.decode(结果.value, { stream: true });
          var 帧们 = 缓冲.split("\n\n");
          缓冲 = 帧们.pop() || "";
          帧们.forEach(function(帧){
            var 数据 = "";
            帧.split("\n").forEach(function(行){
              if (行.indexOf("data:") === 0){ 数据 += 行.slice(5).trim(); }
            });
            if (!数据) return;
            try {
              var ev = JSON.parse(数据);
              if (ev.type === "TEXT_MESSAGE_CONTENT" && ev.delta){ 追加(ev.delta); }
              else if (ev.type === "RUN_FINISHED"){
                任务id = ev.任务id || null;
                阶段 = ev.阶段 || "接待中";
              }
            } catch(_){}
          });
          return 泵();
        });
      }
      return 泵();
    })
    .catch(function(){
      // 降级：回退原同步 /api/dev/chat（整体返回）
      同步对话(后端, 文, 流, 载);
    });
  }

  // ── 同步对话：原 /api/dev/chat 整体返回（流式不可用时的降级路径） ──
  function 同步对话(后端, 文, 流, 载){
    fetch(后端 + "/api/dev/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 消息: 文 })
    })
    .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
    .then(function(d){
      载.remove();
      流.appendChild(渲染({ 类:"讯息", 方:"对", 名:"道祖", 时:"刚刚", 文:净化(d.回复 || "（无回复）") }));
      流.scrollTop = 流.scrollHeight;
      if (d.任务id){
        var 卡 = 建任务卡(d.任务id);
        流.appendChild(卡);
        流.scrollTop = 流.scrollHeight;
        轮询任务卡(卡, d.任务id);
      } else if (d.阶段 === "待确认"){
        var 确认卡 = 建待确认卡(后端, 流);
        // 建待确认卡 内含 appendChild；此处理 5 秒自动确认
      }
    })
    .catch(function(){
      载.remove();
      流.appendChild(渲染({
        类:"讯息", 方:"对", 名:"道祖", 时:"刚刚",
        文:"（道祖暂未在线：需后端 run_dev_agent=true 且配置 LLM 密钥）请检查数据服务后重试。"
      }));
      流.scrollTop = 流.scrollHeight;
    });
  }

  // ── 加载占位气泡 ──
  function 加载中(){
    var 容 = document.createElement("div");
    容.className = "讯息 对";
    容.innerHTML = '<div class="谁"><b class="名">道祖</b><span class="时">思考中…</span></div><div class="气泡 载">· · ·</div>';
    return 容;
  }

  // ── 净化回复：转义 HTML + 折叠 <think> 思考段 + 换行转 <br> ──
  function 净化(文本){
    var 转义 = String(文本)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    转义 = 转义.replace(/&lt;think&gt;([\s\S]*?)&lt;\/think&gt;/g, function(全, 内){
      return '<details class="思"><summary>思考过程</summary><div>' + 内.replace(/\n/g, "<br>") + '</div></details>';
    });
    转义 = 转义.replace(/\n/g, "<br>");
    return 转义;
  }

  // ── 单条消息渲染 ──
  function 渲染(m){
    if (m.类 === "讯"){
      var s = document.createElement("div");
      s.className = "讯";
      s.innerHTML = '<span>' + m.时 + '</span>' + m.文本;
      return s;
    }
    // 讯息
    var 容 = document.createElement("div");
    容.className = "讯息 " + (m.方 === "己" ? "己" : "对");

    var 谁 = document.createElement("div");
    谁.className = "谁";
    var 像 = document.createElement("span");
    像.className = "像";
    像.innerHTML = m.方 === "己" ? (m.字 || "道") : I.智;
    谁.appendChild(像);
    var 名 = document.createElement("b");
    名.className = "名";
    名.textContent = m.名;
    谁.appendChild(名);
    var 时 = document.createElement("span");
    时.className = "时";
    时.textContent = m.时;
    谁.appendChild(时);
    if (m.方 === "对"){
      谁.innerHTML += '<span class="徽">火</span>';
    }
    容.appendChild(谁);

    var 泡 = document.createElement("div");
    泡.className = "气泡";
    var p = document.createElement("p");
    p.innerHTML = m.文;
    泡.appendChild(p);

    if (m.文追){
      var p2 = document.createElement("p");
      p2.innerHTML = m.文追;
      泡.appendChild(p2);
    }

    if (m.工具){
      m.工具.forEach(function(t){
        var 卡 = document.createElement("div");
        卡.className = "工具";
        var 头 = document.createElement("header");
        var 图 = t.名 === "编辑文件" ? I.编 : (t.名 === "运行测试" ? I.查 : I.查);
        头.innerHTML = 图 + '<span class="名">' + t.名 + '</span>';
        var 状 = document.createElement("span");
        状.className = "状 " + (t.状类 || "");
        状.innerHTML = (t.状类 === "行" ? '<i class="轮"></i>' : '') + t.状;
        头.appendChild(状);
        var 耗 = document.createElement("span");
        耗.className = "ms";
        耗.textContent = (t.耗 || "");
        头.appendChild(耗);
        卡.appendChild(头);

        if (t.测){
          var ul = document.createElement("ul");
          ul.className = "测";
          t.测.forEach(function(行){
            var li = document.createElement("li");
            li.innerHTML = '<i></i>' + 行;
            ul.appendChild(li);
          });
          卡.appendChild(ul);
        } else {
          var pre = document.createElement("pre");
          pre.innerHTML = t.码;
          卡.appendChild(pre);
        }
        泡.appendChild(卡);
      });
    }

    if (m.审批){
      var 审 = document.createElement("div");
      审.className = "审批";
      审.innerHTML = '<header><span class="叹">!</span>需要决策者确认 · Diff 在右侧呈现</header><div class="描">' + m.审批.描 + '</div><div class="排"><button class="准">批准执行</button><button class="否">驳回</button><button>查看 Diff →</button></div>';
      泡.appendChild(审);
    }

    容.appendChild(泡);
    return 容;
  }

  // ── 五行任务进度卡 ──
  // 状态→五行阶段映射：木(道祖) 火(圣人) 土(大罗) 金(准圣) 水(太乙)
  var 阶段表 = [
    { 五行:"木", 名:"道祖", 状态:["待受理","待道祖澄清","道祖澄清中"] },
    { 五行:"火", 名:"圣人", 状态:["待圣人设计","圣人设计中","待重新设计"] },
    { 五行:"土", 名:"大罗", 状态:["待大罗金仙实现","大罗金仙实现中","待修复","待重新实现"] },
    { 五行:"金", 名:"准圣", 状态:["待准圣验收","准圣验收中","待道祖终审","道祖终审中","待重新验收","已完成"] },
    { 五行:"水", 名:"太乙", 状态:["待清理","清理中","待重新清理","清理完成"] },
  ];
  var 五行色 = { 木:"#6fbf73", 火:"#e87a4a", 土:"#d8b36a", 金:"#c8c8d4", 水:"#6fb0d3" };

  function 状态到阶段(状态){
    for (var i=0; i<阶段表.length; i++){
      if (阶段表[i].状态.indexOf(状态) >= 0) return i;
    }
    return -1;
  }
  function 状态到结果(状态){
    if (状态 === "已完成" || 状态 === "清理完成") return "完成";
    if (状态.indexOf("中") >= 0) return "进行";
    if (状态.indexOf("重新") >= 0) return "重跑";
    return "等待";
  }

  // ── 待确认卡片：道祖已对齐需求，等待用户确认（批准/驳回 + 5 秒自动确认） ──
  // 无人操作时 5 秒后自动调 /api/dev/chat/confirm 确认发布建任务卡（默认确认）。
  function 建待确认卡(后端, 流){
    var 卡 = document.createElement("div");
    卡.className = "任务卡 待确认";
    var 秒 = 5;
    卡.innerHTML =
      '<div class="头"><b>道祖已对齐需求</b><span class="状">待确认 '+秒+'s</span></div>'+
      '<div class="描">确认后即安排圣人设计、大罗金仙实现、准圣验收。</div>'+
      '<div class="排"><button class="准">确认发布</button><button class="否">驳回</button></div>';
    流.appendChild(卡);

    // 确认发布：调 confirm 接口，成功后建任务卡并轮询
    function 确认发布(){
      卡.querySelector(".状").textContent = "发布中…";
      fetch(后端 + "/api/dev/chat/confirm", { method: "POST" })
        .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
        .then(function(d){
          卡.querySelector(".头 b").textContent = "已确认 · 任务 #" + (d.任务id || "?");
          卡.querySelector(".状").textContent = "已发布";
          var 排 = 卡.querySelector(".排");
          if (排) 排.remove();
          var 新卡 = 建任务卡(d.任务id);
          新卡.style.display = "none";
          流.appendChild(新卡);
          新卡.style.display = "";
          轮询任务卡(新卡, d.任务id);
          流.scrollTop = 流.scrollHeight;
          // 需求已确认发布，看板同步刷新（若界面在看板页）
          if (window.乾坤界面 && window.乾坤界面.切换) { /* 看板页自行刷新 */ }
        })
        .catch(function(e){
          卡.querySelector(".状").textContent = "发布失败";
          console.error("道祖确认发布失败", e);
        });
    }
    function 驳回(){
      clearInterval(计时器);
      卡.querySelector(".头 b").textContent = "已驳回";
      卡.querySelector(".状").textContent = "未发布";
      var 排 = 卡.querySelector(".排");
      if (排) 排.remove();
    }
    var 计时器 = setInterval(function(){
      秒 -= 1;
      var 状 = 卡.querySelector(".状");
      if (秒 >= 0 && 状 && 状.textContent.indexOf("待确认") === 0){ 状.textContent = "待确认 " + 秒 + "s"; }
      if (秒 <= 0){ clearInterval(计时器); 确认发布(); }
    }, 1000);
    卡.querySelector(".准").addEventListener("click", function(){ clearInterval(计时器); 确认发布(); });
    卡.querySelector(".否").addEventListener("click", 驳回);
    return 卡;
  }

  function 建任务卡(任务id){
    var 卡 = document.createElement("div");
    卡.className = "任务卡";
    卡.setAttribute("data-任务id", 任务id);
    var 行 = 阶段表.map(function(s, i){
      var 色 = 五行色[s.五行];
      return '<div class="阶段" data-序="'+i+'">'+
        '<span class="点" style="background:'+色+'"></span>'+
        '<span class="名">'+s.五行+"·"+s.名+'</span>'+
        '<span class="态">等待</span></div>';
    }).join("");
    卡.innerHTML =
      '<div class="头"><b>任务 #'+任务id+'</b><span class="状">启动中…</span></div>'+
      '<div class="流">'+行+'</div>'+
      '<div class="过程"></div>';
    return 卡;
  }

  function 轮询任务卡(卡, 任务id){
    var 后端 = (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
    // 过程事件游标：SSE 与短轮询共用，序号单调递增，重连时据此去重
    var 事件游标 = 0;
    var 过程源 = null;      // EventSource 句柄（SSE 路径）
    var 事件计时器 = null;  // 短轮询回退句柄
    var 过程区 = 卡.querySelector(".过程");

    // 渲染一条过程事件：按任务过滤 + 序号去重（防 SSE 重连重复推送）
    function 渲染过程行(ev){
      if (!过程区) return;
      if (ev.任务id && ev.任务id !== 任务id) return;
      if (ev.序号 <= 事件游标) return;
      事件游标 = ev.序号;
      var 行 = document.createElement("div");
      行.className = "过程行 " + (ev.类型 || "");
      var 角色 = ev.角色 || "";
      var 工具 = ev.工具名 ? " · " + ev.工具名 : "";
      var 内容 = (ev.内容 || "").replace(/</g,"&lt;").replace(/\n/g,"<br>");
      行.innerHTML = '<span class="标">'+角色+工具+'</span><span class="内">'+内容+'</span>';
      过程区.appendChild(行);
    }

    // 短轮询回退：SSE 不可用或失败时按 2s 增量拉取
    function 回退过程轮询(){
      if (事件计时器) return;
      事件计时器 = setInterval(function(){
        fetch(后端 + "/api/dev/pilot/process?since=" + 事件游标)
          .then(function(r){ if(!r.ok) throw 0; return r.json(); })
          .then(function(d){
            (d.事件 || []).forEach(渲染过程行);
            if (过程区) 过程区.scrollTop = 过程区.scrollHeight;
          })
          .catch(function(){});
      }, 2000);
    }

    // AG-UI 渲染器：按 type 分发，三段式聚合为思考块/工具卡/答复块（消费 /api/dev/stream/agui 标准词）
    function 建agui渲染器(过程区){
      var 块 = { 思:null, 具:null, 复:null, 复文:"" };
      function 新行(cls, 标){
        var 行 = document.createElement("div");
        行.className = "过程行 " + cls;
        var 签 = document.createElement("span");
        签.className = "标";
        签.textContent = 标;
        行.appendChild(签);
        过程区.appendChild(行);
        return 行;
      }
      return function(ev){
        switch(ev.type){
          case "REASONING_MESSAGE_START":
            块.思 = 新行("思考", "思考");
            var 折 = document.createElement("details");
            折.className = "思"; 折.open = true;
            折.innerHTML = '<summary>思考过程</summary><div class="内"></div>';
            块.思.appendChild(折);
            break;
          case "REASONING_MESSAGE_CONTENT":
            if (块.思){
              var 思内 = 块.思.querySelector(".内");
              if (思内) 思内.textContent += (ev.delta || "");
            }
            break;
          case "REASONING_MESSAGE_END":
            块.思 = null;
            break;
          case "TOOL_CALL_START":
            块.具 = 新行("工具调用", ev.toolCallName || "工具");
            var 码 = document.createElement("pre");
            码.className = "内";
            块.具.appendChild(码);
            break;
          case "TOOL_CALL_ARGS":
            if (块.具){
              var 码内 = 块.具.querySelector(".内");
              if (码内) 码内.textContent += (ev.delta || "");
            }
            break;
          case "TOOL_CALL_END":
            块.具 = null;
            break;
          case "TOOL_CALL_RESULT":
            var 果行 = 新行("工具结果", "结果");
            var 果 = document.createElement("span");
            果.className = "内";
            果.textContent = (ev.content || "");
            果行.appendChild(果);
            break;
          case "TEXT_MESSAGE_START":
            块.复文 = "";
            块.复 = 新行("任务答复", "答复");
            var 文 = document.createElement("span");
            文.className = "内";
            块.复.appendChild(文);
            break;
          case "TEXT_MESSAGE_CONTENT":
            块.复文 += (ev.delta || "");
            if (块.复){
              var 文内 = 块.复.querySelector(".内");
              if (文内) 文内.innerHTML = 净化(块.复文);
            }
            break;
          case "TEXT_MESSAGE_END":
            块.复 = null;
            break;
        }
      };
    }

    // 订阅过程事件 SSE 长连接（AG-UI 标准词）；失败降级短轮询（中文词）
    function 订阅过程流(){
      if (typeof EventSource === "undefined"){ 回退过程轮询(); return; }
      var 渲染agui = 建agui渲染器(过程区);
      过程源 = new EventSource(后端 + "/api/dev/stream/agui?since=" + 事件游标);
      过程源.onmessage = function(e){
        try {
          渲染agui(JSON.parse(e.data));
          if (过程区) 过程区.scrollTop = 过程区.scrollHeight;
        } catch(_){}
      };
      过程源.onerror = function(){
        if (过程源){ 过程源.close(); 过程源 = null; }
        回退过程轮询();
      };
    }

    // 1. 轮询任务状态（每3秒）：驱动五行阶段卡（保留任务详情兜底，阶段推进本身为秒级）
    var 状态计时器 = setInterval(function(){
      fetch(后端 + "/api/board/" + 任务id)
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(t){
          var 状态 = t.status || t.状态 || "";
          var 序 = 状态到阶段(状态);
          var 结果 = 状态到结果(状态);
          var 头 = 卡.querySelector(".头 .状");
          if (头) 头.textContent = 状态;
          var 阶段们 = 卡.querySelectorAll(".阶段");
          阶段们.forEach(function(el, i){
            var 态 = el.querySelector(".态");
            if (i < 序) { el.className = "阶段 done"; 态.textContent = "完成"; }
            else if (i === 序) { el.className = "阶段 active"; 态.textContent = 结果 === "进行" ? "进行中" : (结果 === "重跑" ? "重跑" : "进行"); }
            else { el.className = "阶段"; 态.textContent = "等待"; }
          });
          if (状态 === "已完成" || 状态 === "清理完成"){
            if (头) 头.textContent = "✅ " + 状态;
            clearInterval(状态计时器);
            if (过程源){ 过程源.close(); 过程源 = null; }
            if (事件计时器){ clearInterval(事件计时器); 事件计时器 = null; }
          }
        })
        .catch(function(){});
    }, 3000);

    // 2. 订阅执行过程事件：优先 SSE 长连接，降级短轮询
    订阅过程流();
  }

  return {
    建: 建,
    渲染: 渲染,
    render_welcome_panel: render_welcome_panel,
    parse_command: parse_command,
    cmd_clear: cmd_clear,
    cmd_refresh: cmd_refresh,
    register_command: register_command,
    dispatch_command: dispatch_command,
    on_unknown_command: on_unknown_command
  };
})();

  var 列体集合 = {};

      列组.appendChild(列节点);
    });
    外.appendChild(列组);

    // ── 主区视图切换：对话/看板 ──
    document.addEventListener("乾坤图标", function(e){
      var 键 = e.detail && e.detail.键;
      if (键 === "看板"){
        切换主区("看板");
        载看板();
      } else if (键 === "对话"){
        切换主区("对话");
      }
    });

    // 初始载入一次（即便隐藏也预载，切换时数据就绪）
    载看板();
    return 外;
  }

  function 切换主区(目标){
    document.querySelectorAll(".主区视图").forEach(function(v){
      v.style.display = (v.getAttribute("data-视图") === 目标) ? "" : "none";
    });
  }

  function 载看板(){
    fetch(后端() + "/api/board")
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(任务){
        // 按五行归组
        var 组 = { 木:[], 火:[], 土:[], 金:[], 水:[] };
        (任务 || []).forEach(function(t){
          var 层 = 五行映射[t.status] || "木";
          (组[层] = 组[层] || []).push(t);
        });
        五行列.forEach(function(列){
          var 列表 = 组[列.层] || [];
          计数集合[列.层].textContent = String(列表.length);
          var 体 = 列体集合[列.层];
          体.innerHTML = "";
          if (!列表.length){
            var 空 = document.createElement("div");
            空.className = "看板空";
            空.textContent = "暂无任务";
            体.appendChild(空);
            return;
          }
          列表.forEach(function(t){
            体.appendChild(卡片(t, 列));
          });
        });
      })
      .catch(function(){
        五行列.forEach(function(列){
          计数集合[列.层].textContent = "—";
          列体集合[列.层].innerHTML = '<div class="看板空">看板读取失败 · 需数据服务在线</div>';
        });
      });
  }

  function 卡片(t, 列){
    var 卡 = document.createElement("button");
    卡.className = "看板卡";
    var 状 = String(t.status || "—");
    var 进行中 = 状.indexOf("中") >= 0;
    卡.innerHTML =
      '<span class="题">' + 转(t.title || "（无标题）") + '</span>' +
      '<span class="元">' +
        '<span class="状' + (进行中 ? " 行" : "") + '">' + 转(状) + '</span>' +
        (t.优先级 ? '<span class="优">' + 转(t.优先级) + '</span>' : '') +
        (t.当前承接人 && t.当前承接人 !== "道祖" ? '<span class="承">' + 转(t.当前承接人) + '</span>' : '') +
      '</span>';
    卡.title = "任务 #" + t.id;
    return 卡;
  }

  function 转(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ── 工具：构建顶栏按钮 ──
  function 按钮(html, 点击){
    var b = document.createElement("button");
    b.className = "钮";
    b.innerHTML = html;
    b.addEventListener("click", 点击);
    return b;
  }

  // ── 驱动：触发看板驱动台，随后轮询刷新直到空闲 ──
  function 驱动(到空闲){
    var 地址 = 后端() + (到空闲 ? "/api/dev/pilot/drain" : "/api/dev/pilot");
    var 体 = 到空闲 ? JSON.stringify({ 上限: 20 }) : undefined;
    fetch(地址, { method: "POST", headers: { "Content-Type": "application/json" }, body: 体 })
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(){ 轮询驱动(); })
      .catch(function(){ 载看板(); });
  }

  // 每 2 秒刷新看板 + 驱动状态，直到驱动空闲
  function 轮询驱动(){
    载看板();
    fetch(后端() + "/api/dev/pilot/status")
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.运行中){ setTimeout(轮询驱动, 2000); } })
      .catch(function(){});
  }

  return { 建: 建 };
})();

// 经挂载契约入园
乾坤界面.挂载("主区", 乾坤看板.建);

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 左栏视图 实现
   职责：
   1. 监听「乾坤图标」事件：键=记忆/图谱 → 左抽屉展开并拉取真实数据；键=对话 → 收起；
   2. 记忆：GET /api/memories → 列表（内容 · 标签 · 归档徽标 · 时间）；
   3. 图谱：GET /api/cognition/graph → 概览计数 + 按所属模块聚合 + 节点清单（前 60）；
   4. 只读写自身 DOM；数据一律来自 fetch，失败可见降级。
   ═══════════════════════════════════════════════════════════ */
window.乾坤视图 = (function(){
  // ── 后端地址：由页面模板注入 window.乾坤配置；缺省同源 ──
  function 后端(){
    return (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
  }
  function 转(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function 时戳(秒){
    if (!秒){ return ""; }
    var d = new Date(秒 * 1000);
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // ── 抽屉骨架 ──
  var 抽屉 = document.createElement("aside");
  抽屉.className = "视图-抽屉";
  抽屉.innerHTML =
    '<header class="视图-头"><b class="视图-题">视图</b>' +
    '<span class="视图-数"></span>' +
    '<button class="视图-关" aria-label="关闭视图"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>' +
    '<div class="视图-体"></div>';
  document.body.appendChild(抽屉);

  // ── 阅读覆盖层：点开文件后全屏预览内容 ──
  var 阅读 = document.createElement("div");
  阅读.className = "视图-阅读";
  阅读.innerHTML =
    '<div class="视图-阅读-面">' +
    '<header class="视图-阅读-头"><b class="视图-阅读-题">预览</b>' +
    '<button class="视图-阅读-关" aria-label="关闭预览"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>' +
    '<pre class="视图-阅读-体"></pre></div>';
  document.body.appendChild(阅读);
  var 阅读题 = 阅读.querySelector(".视图-阅读-题");
  var 阅读体 = 阅读.querySelector(".视图-阅读-体");
  阅读.querySelector(".视图-阅读-关").addEventListener("click", 关阅读);
  阅读.addEventListener("click", function(e){ if (e.target === 阅读){ 关阅读(); } });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape"){ 关阅读(); } });
  function 关阅读(){ 阅读.classList.remove("开"); }

  var 题 = 抽屉.querySelector(".视图-题");
  var 数 = 抽屉.querySelector(".视图-数");
  var 体 = 抽屉.querySelector(".视图-体");
  抽屉.querySelector(".视图-关").addEventListener("click", 收起);

  function 收起(){ 抽屉.classList.remove("开"); }
  function 打开(标题){ 题.textContent = 标题; 数.textContent = ""; 抽屉.classList.add("开"); }

  // ── 记忆视图 ──
  function 载记忆(){
    打开("记忆库");
    体.innerHTML = '<div class="视图-载">读取中…</div>';
    fetch(后端() + "/api/memories")
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(列表){
        数.textContent = (列表.length || 0) + " 条";
        if (!列表.length){
          体.innerHTML = '<div class="视图-空">记忆库为空 · 五行运转产出后自动沉淀</div>';
          return;
        }
        体.innerHTML = "";
        列表.forEach(function(m){
          var 条 = document.createElement("div");
          条.className = "视图-记忆" + (m.归档 ? " 归档" : "");
          条.innerHTML =
            '<p class="视图-记忆-内">' + 转(m.内容) + '</p>' +
            '<p class="视图-记忆-元"><span class="视图-签">' + 转(m.标签 || "无签") + '</span>' +
            (m.归档 ? '<span class="视图-徽 警">待归档</span>' : "") +
            '<em>' + 时戳(m.created_at) + '</em></p>';
          体.appendChild(条);
        });
      })
      .catch(function(){
        体.innerHTML = '<div class="视图-错">记忆库读取失败 · 需数据服务在线（127.0.0.1:8321）</div>';
      });
  }

  // ── 图谱视图：真实结构 = 符号集 / 模块集 / 依赖集 / 技术栈 ──
  function 载图谱(){
    打开("世界态图谱");
    体.innerHTML = '<div class="视图-载">扫描中…</div>';
    fetch(后端() + "/api/cognition/graph")
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(g){
        var 符号 = g.符号集 || [], 模块 = g.模块集 || [], 依赖 = g.依赖集 || [];
        数.textContent = 符号.length + " 符号 · " + 模块.length + " 模块 · " + 依赖.length + " 依赖";
        // 符号按所属模块聚合
        var 组 = {};
        符号.forEach(function(n){
          var k = n.所属模块 || "未归";
          (组[k] = 组[k] || []).push(n);
        });
        体.innerHTML = "";
        Object.keys(组).sort().forEach(function(名){
          var 块 = document.createElement("details");
          块.className = "视图-模块";
          块.innerHTML = "<summary>" + 转(名) + " <em>" + 组[名].length + "</em></summary>";
          var 限 = 60, 截 = 组[名].length > 限;
          组[名].slice(0, 限).forEach(function(n){
            var 行 = document.createElement("div");
            行.className = "视图-节点";
            行.innerHTML = '<span class="视图-种 ' + 转(n.种类 || "") + '">' + 转(n.种类 || "?") + '</span><b>' + 转(n.名称) + '</b>';
            if (n.签名){ 行.title = n.签名; }
            块.appendChild(行);
          });
          if (截){
            var 更 = document.createElement("div");
            更.className = "视图-截";
            更.textContent = "… 另有 " + (组[名].length - 限) + " 项";
            块.appendChild(更);
          }
          体.appendChild(块);
        });
        if (g.技术栈 && g.技术栈.length){
          var 栈 = document.createElement("div");
          栈.className = "视图-栈";
          栈.innerHTML = "<h6>技术栈</h6>" + g.技术栈.map(function(t){ return "<span>" + 转(t) + "</span>"; }).join("");
          体.appendChild(栈);
        }
      })
      .catch(function(){
        体.innerHTML = '<div class="视图-错">图谱读取失败 · 需数据服务在线（127.0.0.1:8321）</div>';
      });
  }

  // ── 事件路由：图标键 → 视图动作 ──
  document.addEventListener("乾坤图标", function(e){
    var 键 = e.detail && e.detail.键;
    if (键 === "记忆"){ 载记忆(); }
    else if (键 === "图谱"){ 载图谱(); }
    else if (键 === "传承殿"){ 载文件("传承殿", "传承殿"); }
    else if (键 === "门禁"){ 载文件("门禁", "门禁"); }
    else if (键 === "架构"){ 载文件("架构", "架构"); }
    else { 收起(); }
  });

  // ── 文件视图：传承殿（文档）/ 门禁（-门禁）/ 架构（架构图）──
  function 载文件(类名, 标题){
    打开(标题);
    体.innerHTML = '<div class="视图-载">读取中…</div>';
    fetch(后端() + "/api/files")
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(g){
        var 列表 = (g && g[类名]) || [];
        数.textContent = 列表.length + " 个文件";
        if (!列表.length){
          体.innerHTML = '<div class="视图-空">暂无' + 转(标题) + '文件</div>';
          return;
        }
        体.innerHTML = "";
        // 按顶层目录分组
        var 组 = {};
        列表.forEach(function(f){
          var 顶 = f.路径.split("/")[0] || "根";
          (组[顶] = 组[顶] || []).push(f);
        });
        Object.keys(组).sort().forEach(function(名){
          var 块 = document.createElement("details");
          块.className = "视图-文件组";
          块.open = true; // 默认展开，确保文件按钮直接可见可点
          块.innerHTML = "<summary>" + 转(名) + " <em>" + 组[名].length + "</em></summary>";
          组[名].forEach(function(f){
            var 行 = document.createElement("button");
            行.className = "视图-文件";
            行.innerHTML = "<b>" + 转(f.名称) + "</b><em>" + 转(f.路径) + "</em>";
            行.title = f.路径;
            行.addEventListener("click", function(){ 读文件(f.路径); });
            块.appendChild(行);
          });
          体.appendChild(块);
        });
      })
      .catch(function(){
        体.innerHTML = '<div class="视图-错">文件清单读取失败 · 需数据服务在线（127.0.0.1:8321）</div>';
      });
  }

  // ── 读取并预览单个文件内容 ──
  function 读文件(路径){
    阅读题.textContent = 路径;
    阅读体.textContent = "读取中…";
    阅读.classList.add("开");
    fetch(后端() + "/api/files/content?路径=" + encodeURIComponent(路径))
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(d){ 阅读体.textContent = d.内容 || "（空文件）"; })
      .catch(function(){ 阅读体.textContent = "读取失败：文件不可达或超出大小上限"; });
  }

  return { 抽屉: 抽屉, 载记忆: 载记忆, 载图谱: 载图谱, 载文件: 载文件, 收起: 收起 };
})();
</script>
