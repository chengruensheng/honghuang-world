    门禁:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4.5"/></svg>',
    架构:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/><path d="M12 7.2v3M7 13.5L10 17M17 13.5L14 17M10.5 5H7M13.5 5H17"/></svg>',
    图谱:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M7.6 7.6L11 16M16.4 7.6L13 16"/></svg>',
    设置:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
  };

  // ── 左侧导航：对话/看板为主区双视图，其余为抽屉视图与设置 ──
  var 左导航 = [
    { 键:"对话",   名:"对话",   图:S.对话 },
    { 键:"看板",   名:"看板",   图:S.看板 },
    { 键:"记忆",   名:"记忆",   图:S.记忆 },
    { 键:"传承殿", 名:"传承",   图:S.传承殿 },
    { 键:"门禁",   名:"门禁",   图:S.门禁 },
    { 键:"架构",   名:"架构",   图:S.架构 },
    { 键:"图谱",   名:"图谱",   图:S.图谱 },
    { 键:"设置",   名:"设置",   图:S.设置, 末:true }
  ];

  // ── 构建图标轨 ──
  function 建轨(数据, 默认键){
    var 轨 = document.createElement("div");
    轨.className = "组件-图标轨";
    数据.forEach(function(项){
      var 钮 = document.createElement("button");
      钮.className = "组件-图标" + (项.末 ? " 组件-末" : "");
      钮.setAttribute("data-键", 项.键 || "末");
      钮.setAttribute("title", 项.名 || 项.键);
      钮.innerHTML = (项.图 || S.设置) + "<em>" + (项.名 || "设置") + "</em>";
      if (项.键 === 默认键){
        钮.classList.add("是");
      }
      钮.addEventListener("click", function(){
        轨.querySelectorAll(".组件-图标").forEach(function(x){ x.classList.remove("是"); });
        钮.classList.add("是");
        // 派发图标选择事件，供对话/看板/视图/设置等组件监听（组件间经事件解耦）
        document.dispatchEvent(new CustomEvent("乾坤图标", { detail: { 键: 项.键 } }));
      });
      轨.appendChild(钮);
    });
    // 监听复位事件：面板关闭/抽屉收起时清除对应键的高亮
    document.addEventListener("乾坤图标复位", function(e){
      var 键 = e.detail && e.detail.键;
      if (!键){ return; }
      var 钮 = 轨.querySelector('.组件-图标[data-键="' + 键 + '"]');
      if (钮){ 钮.classList.remove("是"); }
    });
    return 轨;
  }

  // ── 对外：只提供「构建节点」的工厂，经挂载契约入园 ──
  return {
    左: function(){ return 建轨(左导航, "对话"); }
  };
})();

// ── 经挂载契约入园（布局与组件的唯一接口）──
乾坤界面.挂载("左栏", 乾坤组件.左);

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 设置面板 接入组件（密钥/接入向导/智能体绑定）
   职责（面板.js 消费本组件 API，故脚本聚合顺序须在本组件之后）：
   1. 密钥按钮：供应商组头展开密钥行 → discover 真实校验 + connect 保存；
   2. 接入入口：模板/自定义 → 密钥 → 获取模型 → 接入；
   3. 智能体区块：每身份绑定独立模型（agents / bind / unbind）。
   铁律：密钥一律 password 输入，绝不回显已存密钥。
   ═══════════════════════════════════════════════════════════ */
window.乾坤接入 = (function(){
  // ── 基础：后端地址 / 转义 / fetch 封装（与面板.js 同模式）──
  function 后端(){
    return (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
  }
  function 名(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function 请求(路径, 方法, 体){
    return fetch(后端() + 路径, {
      method: 方法,
      headers: { "Content-Type": "application/json" },
      body: 体 === undefined ? undefined : JSON.stringify(体)
    }).then(function(r){
      if (!r.ok){ throw new Error("HTTP " + r.status); }
      return r.json();
    });
  }
  function 反馈写(元素, 文, 坏){
    元素.textContent = 文;
    元素.classList.toggle("坏", !!坏);
  }
  function 下拉填模型(选, 模型们, 选中){
    选.innerHTML = "";
    (模型们 || []).forEach(function(m){
      var o = document.createElement("option");
      o.value = m.id;
      o.textContent = m.id;
      if (m.id === 选中){ o.selected = true; }
      选.appendChild(o);
    });
  }

  /* ═══ 1. 密钥按钮：供应商组头按钮 → 展开密钥行 ═══ */
  function 密钥按钮(信息, 组, 刷新){
    var 钮 = document.createElement("button");
    钮.type = "button";
    钮.className = "设置-密钥钮";
    钮.textContent = "密钥";
    钮.title = "修改该供应商 API 密钥";
    钮.addEventListener("click", function(){
      var 已有 = 组.querySelector(".设置-密钥行");
      if (已有){ 已有.remove(); return; }
      组.appendChild(密钥行(信息, 刷新));
    });
    return 钮;
  }

  // 密钥行：discover 真实校验（失败展示后端错误原文）→ connect 重名覆盖保存
  function 密钥行(信息, 刷新){
    var 行 = document.createElement("div");
    行.className = "设置-密钥行";
    行.innerHTML =
      "<input class=\"设置-密钥输入\" type=\"password\" placeholder=\"API 密钥（env:变量名 引用可重启恢复；明文仅会话内）\">" +
      "<button class=\"设置-密钥保存\" type=\"button\">验证并保存</button>" +
      "<span class=\"设置-密钥反馈\"></span>";
    var 输入 = 行.querySelector(".设置-密钥输入");
    var 保存钮 = 行.querySelector(".设置-密钥保存");
    var 反馈 = 行.querySelector(".设置-密钥反馈");
    保存钮.addEventListener("click", function(){
      var 密钥 = 输入.value.trim();
      if (!密钥){ 反馈写(反馈, "请输入密钥", true); return; }
      保存钮.disabled = true;
      反馈写(反馈, "验证中…");
      // discover：地址省略 → 后端回退池内已存地址
      请求("/api/llm/discover", "POST", { 供应商: 信息.名称, 密钥: 密钥 })
        .then(function(d){
          if (d.错误){ throw new Error(d.错误); }
          反馈写(反馈, "验证通过（" + 名(d.来源) + " · " + (d.模型 || []).length + " 个模型），保存中…");
          // connect：重名覆盖更新池内密钥并选中该供应商
          return 请求("/api/llm/connect", "POST",
            { 名称: 信息.名称, 地址: 信息.地址, 密钥: 密钥, 模型: 信息.模型 });
        })
        .then(function(){
          反馈写(反馈, "已保存（该供应商已选中）");
          输入.value = "";
          if (刷新){ 刷新(); }
        })
        .catch(function(e){ 反馈写(反馈, "失败：" + e.message, true); })
        .then(function(){ 保存钮.disabled = false; });
    });
    return 行;
  }

  /* ═══ 2. 接入入口：向导（模板/自定义 → 密钥 → 获取模型 → 接入）═══ */
  function 接入入口(容器, 刷新){
    var 钮 = document.createElement("button");
    钮.type = "button";
    钮.className = "设置-接入钮";
    钮.textContent = "＋ 接入供应商";
    钮.addEventListener("click", function(){
      var 已有 = 容器.querySelector(".设置-向导");
      if (已有){ 已有.remove(); return; }
      容器.appendChild(向导(刷新));
    });
    return 钮;
  }

  function 向导(刷新){
    var w = document.createElement("div");
    w.className = "设置-向导";
    w.innerHTML =
      "<div class=\"设置-向导头\"><b>接入供应商</b>" +
        "<button class=\"设置-向导关\" type=\"button\" aria-label=\"关闭\">✕</button></div>" +
      "<div class=\"设置-向导行\">" +
        "<select class=\"设置-向导模板\"><option value=\"\">自定义供应商…</option></select>" +
        "<input class=\"设置-向导名\" placeholder=\"供应商名称（自定义时必填）\">" +
      "</div>" +
      "<div class=\"设置-向导行\">" +
        "<input class=\"设置-向导址\" placeholder=\"API 地址（https://... 或 .../chat/completions）\">" +
      "</div>" +
      "<div class=\"设置-向导行\">" +
        "<input class=\"设置-向导钥\" type=\"password\" placeholder=\"API 密钥（env:变量名 引用可重启恢复）\">" +
      "</div>" +
      "<div class=\"设置-向导行\">" +
        "<button class=\"设置-向导取模\" type=\"button\">获取可用模型</button>" +
        "<select class=\"设置-向导模型\"><option value=\"\">— 先获取模型 —</option></select>" +
      "</div>" +
      "<div class=\"设置-向导行\">" +
        "<button class=\"设置-向导接\" type=\"button\">接入</button>" +
        "<span class=\"设置-向导反馈\"></span>" +
      "</div>";
    var 模板选 = w.querySelector(".设置-向导模板");
    var 名入 = w.querySelector(".设置-向导名");
    var 址入 = w.querySelector(".设置-向导址");
    var 钥入 = w.querySelector(".设置-向导钥");
    var 取模钮 = w.querySelector(".设置-向导取模");
    var 模选 = w.querySelector(".设置-向导模型");
    var 接钮 = w.querySelector(".设置-向导接");
    var 反馈 = w.querySelector(".设置-向导反馈");

    // 模板清单（含环境变量提示）；拉取失败时追加提示选项
    请求("/api/llm/templates", "GET").then(function(d){
      (d.模板 || []).forEach(function(t){
        var o = document.createElement("option");
        o.value = t.名称;
        o.textContent = t.显示名 + (t.环境变量 ? "（env:" + t.环境变量 + "）" : "");
        o.setAttribute("data-址", t.地址 || "");
        模板选.appendChild(o);
      });
    }).catch(function(){
      var o = document.createElement("option");
      o.disabled = true;
      o.textContent = "（模板加载失败，请手动填写）";
      模板选.appendChild(o);
    });

    模板选.addEventListener("change", function(){
      var o = 模板选.options[模板选.selectedIndex];
      名入.value = o.value ? o.value : "";
      址入.value = o.value ? (o.getAttribute("data-址") || "") : "";
    });

    // 获取可用模型：模板命中零网络 / 自定义网络探测
    取模钮.addEventListener("click", function(){
      var 供 = 模板选.value;
      var 址 = 址入.value.trim();
      if (!供 && !址){ 反馈写(反馈, "请选择模板或填写 API 地址", true); return; }
      取模钮.disabled = true;
      反馈写(反馈, "获取模型中…");
      请求("/api/llm/discover", "POST", {
        供应商: 供 || undefined,
        地址: 址 || undefined,
        密钥: 钥入.value.trim() || undefined
      })
      .then(function(d){
        if (d.错误){ throw new Error(d.错误); }
        下拉填模型(模选, d.模型, "");
        反馈写(反馈, "已获取 " + 模选.options.length + " 个模型（来源 " + 名(d.来源) + "）");
      })
      .catch(function(e){ 反馈写(反馈, "获取失败：" + e.message, true); })
      .then(function(){ 取模钮.disabled = false; });
    });

    // 接入：注册进池 + 选中；env: 引用落盘（llm-接入.json）重启恢复
    接钮.addEventListener("click", function(){
      var 请求体 = {
        名称: (模板选.value || 名入.value).trim(),
        地址: 址入.value.trim(),
        密钥: 钥入.value.trim(),
        模型: 模选.value
      };
      if (!请求体.名称){ 反馈写(反馈, "请选择模板或填写供应商名称", true); return; }
      if (!请求体.地址){ 反馈写(反馈, "请填写 API 地址", true); return; }
      if (!请求体.密钥){ 反馈写(反馈, "请输入密钥", true); return; }
      if (!请求体.模型){ 反馈写(反馈, "请先获取可用模型并选择", true); return; }
      接钮.disabled = true;
      反馈写(反馈, "接入中…");
      请求("/api/llm/connect", "POST", 请求体)
        .then(function(){
          反馈写(反馈, "已接入并选中（" + 名(请求体.名称) + " · " + 名(请求体.模型) + "）");
          钥入.value = "";
          if (刷新){ 刷新(); }
        })
        .catch(function(e){ 反馈写(反馈, "接入失败：" + e.message, true); })
        .then(function(){ 接钮.disabled = false; });
    });

    w.querySelector(".设置-向导关").addEventListener("click", function(){ w.remove(); });
    return w;
  }

  /* ═══ 3. 智能体绑定区块：身份 × 绑定（绑定 ?? 全局选择）═══ */
  function 智能体区块(){
    var 块 = document.createElement("div");
    块.className = "设置-绑定";
    块.innerHTML = "<div class=\"设置-绑定空\">加载中…</div>";

    function 拉(){
      Promise.all([
        请求("/api/llm/agents", "GET"),
        请求("/api/llm/status", "GET")
      ]).then(function(组){ 画(组[0].智能体 || [], 组[1]); })
      .catch(function(){
        块.innerHTML = "<div class=\"设置-绑定空\">绑定清单拉取失败（数据服务未在线）</div>";
      });
    }

    function 画(清单, 状态){
      块.innerHTML = "";
      if (!清单.length){
        块.innerHTML = "<div class=\"设置-绑定空\">LLM 池未装配，无法绑定</div>";
        return;
      }
      var 全局 = (状态 && 状态.当前选择) || { 供应商: "", 模型: "" };
      var 供应商清单 = (状态 && 状态.供应商) || [];
      清单.forEach(function(项){ 块.appendChild(绑定行(项, 全局, 供应商清单, 拉)); });
    }

    function 绑定行(项, 全局, 供应商清单, 重画){
      var 行 = document.createElement("div");
      行.className = "设置-绑定行";
      var 说明 = 项.名 === "道祖" ? "主控澄清对话" : "开发执行链";
      var 生效 = 项.绑定
        ? (项.绑定.供应商 + " · " + 项.绑定.模型)
        : (全局.供应商 + " · " + 全局.模型 + "（跟随全局）");
      行.innerHTML =
        "<div class=\"设置-绑定头\"><b>" + 名(项.名) + "</b><em>" + 名(说明) + "</em></div>" +
        "<div class=\"设置-绑定生\"><span>当前生效</span><code>" + 名(生效) + "</code></div>" +
        "<div class=\"设置-绑定选\">" +
          "<select class=\"设置-绑定供\"></select>" +
          "<select class=\"设置-绑定模\"><option value=\"\">— 模型 —</option></select>" +
        "</div>" +
        "<div class=\"设置-绑定制\">" +
          "<button class=\"设置-绑钮\" type=\"button\">绑定</button>" +
          (项.绑定 ? "<button class=\"设置-解钮\" type=\"button\">恢复默认</button>" : "") +
        "</div>";
      var 供选 = 行.querySelector(".设置-绑定供");
      var 模选 = 行.querySelector(".设置-绑定模");
      供应商清单.forEach(function(s){
        var o = document.createElement("option");
        o.value = s.名称;
        o.textContent = s.名称;
        if (项.绑定 && 项.绑定.供应商 === s.名称){ o.selected = true; }
        供选.appendChild(o);
      });
      if (项.绑定){ 拉模型(模选, 项.绑定.供应商, 项.绑定.模型); }
      供选.addEventListener("change", function(){ 拉模型(模选, 供选.value, ""); });

      行.querySelector(".设置-绑钮").addEventListener("click", function(){
        if (!供选.value || !模选.value){ 行错(行, "请选择供应商与模型"); return; }
        行错清(行);
        请求("/api/llm/agent/bind", "POST", { 智能体: 项.名, 供应商: 供选.value, 模型: 模选.value })
          .then(function(){ 重画(); })
          .catch(function(e){ 行错(行, "绑定失败：" + e.message); });
      });
      var 解钮 = 行.querySelector(".设置-解钮");
      if (解钮){
        解钮.addEventListener("click", function(){
          行错清(行);
          请求("/api/llm/agent/unbind", "POST", { 智能体: 项.名 })
            .then(function(){ 重画(); })
            .catch(function(e){ 行错(行, "解绑失败：" + e.message); });
        });
      }
      return 行;
    }

    // 模型下拉：按供应商 discover（池内已存密钥回退，零输入）
    function 拉模型(选, 供应商, 选中){
      选.innerHTML = "<option value=\"\">加载中…</option>";
      请求("/api/llm/discover", "POST", { 供应商: 供应商 })
        .then(function(d){
          if (d.错误){ throw new Error(d.错误); }
          下拉填模型(选, d.模型, 选中);
        })
        .catch(function(){ 选.innerHTML = "<option value=\"\">获取失败</option>"; });
    }

    function 行错(行, 文){
      var t = 行.querySelector(".设置-绑定错");
      if (!t){
        t = document.createElement("div");
        t.className = "设置-绑定错";
        行.appendChild(t);
      }
      t.textContent = 文;
    }
    function 行错清(行){
      var t = 行.querySelector(".设置-绑定错");
      if (t){ t.remove(); }
    }

    拉();
    return 块;
  }

  return {
    密钥按钮: 密钥按钮,
    接入入口: 接入入口,
    智能体区块: 智能体区块
  };
})();

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 设置面板 实现
   职责：
   1. 监听「乾坤图标」事件（键=设置）→ 展开/收起；关闭时发「乾坤图标复位」清高亮；
   2. 构建居中设置面板，内含 模型（真实接口）+ 智能体（独立模型绑定）；
   3. 只读写自身 DOM，不触碰布局结构；经事件与图标轨解耦。
   ═══════════════════════════════════════════════════════════ */
window.乾坤设置 = (function(){
  // ── 后端地址：由页面模板注入 window.乾坤配置；缺省同源 ──
  function 后端(){
    return (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
  }
  // ── 文本转义：接口数据进 DOM 前一律过一遍 ──
  function 名(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ── 构建面板 DOM ──
  function 构建(){
    var 托盘 = document.createElement("div");
    托盘.className = "设置-托盘";

    var 面板 = document.createElement("div");
    面板.className = "设置-面板";

    // 头部
    var 头 = document.createElement("div");
    头.className = "设置-头";
    头.innerHTML = "<b>设置</b><span class=\"设置-副\">道基 · 模型与守卫</span>";
    var 关 = document.createElement("button");
    关.className = "设置-关";
    关.setAttribute("aria-label", "关闭设置");
    关.innerHTML = "<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg>";
    头.appendChild(关);
    面板.appendChild(头);

    // ── 模型区块（接真实 /api/llm/status · /models · /select）──
    var 模型 = 模型区块();
    面板.appendChild(模型.块);

    // ── 智能体区块（每身份独立模型绑定，真实接口）──
    var 智块 = 区块("智能体");
    智块.appendChild(乾坤接入.智能体区块());
    面板.appendChild(智块);

    托盘.appendChild(面板);

    // ── 交互：关闭（三路关闭统一复位图标高亮）──
    function 收(){
      托盘.classList.remove("开");
      document.dispatchEvent(new CustomEvent("乾坤图标复位", { detail: { 键: "设置" } }));
    }
    关.addEventListener("click", 收);
    托盘.addEventListener("click", function(e){ if (e.target === 托盘){ 收(); } });
    document.addEventListener("keydown", function(e){ if (e.key === "Escape" && 托盘.classList.contains("开")){ 收(); } });

    return { 托盘: 托盘, 刷新模型: 模型.刷新 };
  }

  // ── 模型区块：当前选择 + 供应商模型清单 + 点击切换 + 密钥配置 + 接入向导 ──
  function 模型区块(){
    var 块 = 区块("模型");
    var 当前 = document.createElement("div");
    当前.className = "设置-当前模型";
    当前.innerHTML = "<span class=\"点\"></span><b>未加载</b>";
    var 列表 = document.createElement("div");
    列表.className = "设置-模型列表";
    块.appendChild(当前);
    块.appendChild(列表);
    // 接入入口：展开接入向导（模板/自定义 → 密钥 → 获取模型 → 接入）
    块.appendChild(乾坤接入.接入入口(块, 刷新));

    var 现选 = { 供应商: "", 模型: "" };
    var 切换中 = false; // 防并发切换锁
    // 供应商信息表（名称 → {名称/地址/模型}，密钥行保存时回填 connect 参数）
    var 供应商信息表 = {};

    function 画当前(d){
      if (d && d.配置 && d.当前选择){
        现选.供应商 = d.当前选择.供应商 || "";
        现选.模型 = d.当前选择.模型 || "";
        当前.innerHTML = "<span class=\"点 活\"></span><b>" + 名(现选.模型) + "</b><em>" + 名(现选.供应商) + " · 已接入</em>";
      } else {
        当前.innerHTML = "<span class=\"点 死\"></span><b>LLM 池未装配</b><em>请配置供应商密钥</em>";
      }
      // 供应商信息表（供密钥行回填 connect 参数）
      供应商信息表 = {};
      ((d && d.供应商) || []).forEach(function(s){ 供应商信息表[s.名称] = s; });
    }
    function 画列表(结果){
      列表.innerHTML = "";
      (结果 || []).forEach(function(项){
        var 组 = document.createElement("div");
        组.className = "设置-供应商组";
        var 题 = document.createElement("h6");
        题.innerHTML = "<span>" + 名(项.供应商) + "</span>";
        // 组头密钥按钮：展开密钥行（discover 校验 + connect 保存）
        var 信息 = 供应商信息表[项.供应商];
        if (信息){ 题.appendChild(乾坤接入.密钥按钮(信息, 组, 刷新)); }
        组.appendChild(题);
        if (项.模型 && 项.模型.length){
          项.模型.forEach(function(m){
            var b = document.createElement("button");
            b.className = "设置-模型项" + (项.供应商 === 现选.供应商 && m.id === 现选.模型 ? " 当前" : "");
            b.textContent = m.id;
            b.addEventListener("click", function(){ 选择(项.供应商, m.id); });
            组.appendChild(b);
          });
        } else {
          var 错 = document.createElement("span");
          错.className = "设置-模型错误";
          错.textContent = 项.错误 || "无可用模型";
          组.appendChild(错);
        }
        列表.appendChild(组);
      });
    }
    function 选择(供应商, 模型){
      if (切换中){ return; }
      切换中 = true;
      fetch(后端() + "/api/llm/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 供应商: 供应商, 模型: 模型 })
      })
      .then(function(r){
        if (!r.ok){ throw new Error("HTTP " + r.status); }
        return r.json();
      })
      .then(function(){ 现选 = { 供应商: 供应商, 模型: 模型 }; 刷新(); })
      .catch(function(){
        当前.innerHTML = "<span class=\"点 死\"></span><b>切换失败</b><em>" + 名(供应商) + " · " + 名(模型) + "</em>";
        // 清除列表中所有高亮，避免与顶部状态矛盾
        var 按钮们 = 列表.querySelectorAll(".设置-模型项.当前");
        for (var i = 0; i < 按钮们.length; i++){ 按钮们[i].classList.remove("当前"); }
      })
      .finally(function(){ 切换中 = false; });
    }
    var 刷新中 = false; // 防并发刷新锁
    function 刷新(){
      if (刷新中){ return; }
      刷新中 = true;
      // 先 status（填供应商信息表）再 models（画清单挂密钥按钮）——串行消除竞态
      fetch(后端() + "/api/llm/status")
        .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
        .then(function(d){ 画当前(d); })
        .catch(function(){
          当前.innerHTML = "<span class=\"点 死\"></span><b>数据服务未在线</b><em>需启动后端 127.0.0.1:8321</em>";
        })
        .then(function(){
          fetch(后端() + "/api/llm/models")
            .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
            .then(function(d){ 画列表(d.结果); })
            .catch(function(){
              列表.innerHTML = "<span class=\"设置-模型错误\">模型清单拉取失败（供应商端点不可达）</span>";
            });
        })
        .finally(function(){ 刷新中 = false; });
    }

    return { 块: 块, 刷新: 刷新 };
  }

  // ── 新区块 ──
  function 区块(名){
    var 块 = document.createElement("section");
    块.className = "设置-区块";
    var h = document.createElement("h5");
    h.textContent = 名;
    块.appendChild(h);
    return 块;
  }

  // 托盘实例化后挂到 body（覆盖层），初始收起
  var 实例 = 构建();
  var 托盘 = 实例.托盘;
  document.body.appendChild(托盘);

  // ── 监听图标事件：键=设置 → 展开/收起；展开时拉取真实模型状态，收起时复位图标高亮 ──
  document.addEventListener("乾坤图标", function(e){
    if (e.detail && e.detail.键 === "设置"){
      var 开 = 托盘.classList.toggle("开");
      if (开){ 实例.刷新模型(); }
      else { document.dispatchEvent(new CustomEvent("乾坤图标复位", { detail: { 键: "设置" } })); }
    }
  });

  return { 托盘: 托盘 };
})();

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 顶栏 实现
   职责：构建顶栏节点（logo · 工作区选择器 · 模型标识 · 状态徽标），
   经挂载契约进入顶栏槽位；工作区选择器可切换项目工作区根，模型标识接真实 LLM。
   ═══════════════════════════════════════════════════════════ */
window.乾坤顶栏 = (function(){
  function 后端(){
    return (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
  }

  function 建(){
    var 顶 = document.createElement("header");
    顶.className = "组件-顶栏";

    // logo
    var 标 = document.createElement("span");
    标.className = "顶栏-标";
    标.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l3 5 5 1-4 4 1 6-5-3-5 3 1-6-4-4 5-1z"/></svg>洪荒';
    顶.appendChild(标);

    // ── 工作区选择器：定义项目工作区根（文件面板/智能体产出都基于它）──
    顶.appendChild(工作区选择器());

    // 右侧区
    var 右 = document.createElement("div");
    右.className = "顶栏-右";

    // 模型标识（真实 LLM）
    var 模型 = document.createElement("span");
    模型.className = "顶栏-模型";
    模型.innerHTML = '<i class="点"></i><b>…</b>';
    右.appendChild(模型);
    fetch(后端() + "/api/llm/status")
      .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
      .then(function(d){ 模型.querySelector("b").textContent = (d && d.当前选择 && d.当前选择.模型) || "未接入"; })
      .catch(function(){ 模型.querySelector("b").textContent = "未接入"; });

    // 状态徽标
    var 徽 = document.createElement("span");
    徽.className = "顶栏-徽";
    徽.innerHTML = '<i class="点"></i>先审后写';
    右.appendChild(徽);

    顶.appendChild(右);
    return 顶;
  }

  // ── 工作区选择器：按钮 + 内联输入面板 ──
  function 工作区选择器(){
    var 外 = document.createElement("div");
    外.className = "顶栏-工作区";

    var 钮 = document.createElement("button");
    钮.className = "顶栏-工作区-钮";
    钮.type = "button";
    钮.innerHTML =
      '<svg class="夹" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>' +
      '<span class="路">…</span>' +
      '<svg class="下" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';

    // 输入面板（默认隐藏）
    var 面 = document.createElement("div");
    面.className = "顶栏-工作区-面";
    面.innerHTML =
      '<div class="题">项目工作区根目录</div>' +
      '<input class="入" placeholder="例如 F:\\洪荒 - 世界 或 ./项目" />' +
      '<div class="行">' +
        '<button class="定" type="button">确定</button>' +
        '<button class="消" type="button">取消</button>' +
      '</div>';
    外.appendChild(钮);
    外.appendChild(面);

    var 入 = 面.querySelector(".入");
    var 路 = 钮.querySelector(".路");

    // 打开面板：预填当前值
    function 开(){
      fetch(后端() + "/api/workspace")
        .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
        .then(function(d){ 入.value = d.工作区 || ""; })
        .catch(function(){ 入.value = ""; });
      面.classList.add("开");
      入.focus();
    }
    function 关(){ 面.classList.remove("开"); }

    钮.addEventListener("click", function(){ 面.classList.contains("开") ? 关() : 开(); });
    面.querySelector(".消").addEventListener("click", 关);
    document.addEventListener("keydown", function(e){ if (e.key === "Escape"){ 关(); } });
    document.addEventListener("click", function(e){
      if (!外.contains(e.target)){ 关(); }
    });

    // 确定：POST 设置工作区
    面.querySelector(".定").addEventListener("click", function(){
      var 路径 = 入.value.trim();
      if (!路径){ 入.focus(); return; }
      fetch(后端() + "/api/workspace", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 工作区: 路径 })
      })
      .then(function(r){ if (!r.ok){ return r.text().then(function(t){ throw new Error(t); }); } return r.json(); })
      .then(function(d){
        路.textContent = d.工作区 || 路径;
        路.title = d.工作区 || 路径;
        关();
      })
      .catch(function(e){
        路.textContent = "目录无效";
        setTimeout(function(){ 载入当前(); }, 1200);
      });
    });

    // 初始载入当前工作区
    载入当前();
    function 载入当前(){
      fetch(后端() + "/api/workspace")
        .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
        .then(function(d){ 路.textContent = d.工作区 || "./"; 路.title = d.工作区 || "./"; })
        .catch(function(){ 路.textContent = "./"; });
    }

    return 外;
  }

  return { 建: 建 };
})();

// 经挂载契约入园
乾坤界面.挂载("顶栏", 乾坤顶栏.建);

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 底栏 实现
   职责：构建底栏状态栏节点（引擎在线 · 记忆 · 图谱 · 规则 · 事件 · 模型 · 版本），
   经挂载契约进入底栏槽位；计数与模型/版本来自真实接口，失败降级不阻塞。
   ═══════════════════════════════════════════════════════════ */
window.乾坤底栏 = (function(){
  function 后端(){
    return (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
  }

  // 模块级槽位引用（供事件监听器和定时器使用，避免闭包泄漏）
  var 槽引用 = null;
  var 在线节点 = null;

  function 建(){
    var 底 = document.createElement("footer");
    底.className = "组件-底栏";

    // ── 左区：引擎在线 + 引擎计数 ──
    var 在线项 = 项("<i class=\"点\"></i> <span class=\"在线文\">主引擎在线</span>", "底栏-在线");
    在线节点 = 在线项;
    底.appendChild(在线项);
    底.appendChild(点());
    var 记 = 项("记忆 <b class=\"记\">…</b>");
    var 谱 = 项("图谱 <b class=\"谱\">…</b>");
    var 规 = 项("规则 <b class=\"规\">…</b>");
    var 事 = 项("事件 <b class=\"事\">…</b>");
    底.appendChild(记); 底.appendChild(点());
    底.appendChild(谱); 底.appendChild(点());
    底.appendChild(规); 底.appendChild(点());
    底.appendChild(事);

    // ── 右区：模型 + 版本 ──
    var 右 = document.createElement("div");
    右.className = "底栏-右";
    var 模型 = document.createElement("span");
    模型.className = "底栏-模型";
    模型.innerHTML = "<i class=\"点\"></i><b class=\"模\">…</b>";
    右.appendChild(模型);
    右.appendChild(点());
    var 版 = document.createElement("span");
    版.className = "底栏-版";
    版.textContent = "v…";
    右.appendChild(版);
    底.appendChild(右);

    槽引用 = { 记: 记.querySelector("b"), 谱: 谱.querySelector("b"), 规: 规.querySelector("b"), 事: 事.querySelector("b"), 模: 模型.querySelector("b"), 版: 版 };

    // ── 拉取真实数据 ──
    刷新(槽引用);

    // ── 设置面板关闭事件监听（只注册一次，在IIFE顶层）──
    document.addEventListener("乾坤图标复位", function(e){
      if (e.detail && e.detail.键 === "设置" && 槽引用){
        fetch(后端() + "/api/llm/status")
          .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
          .then(function(d){ 槽引用.模.textContent = (d && d.当前选择 && d.当前选择.模型) || "未接入"; })
          .catch(function(){});
      }
    });

    // ── 定时刷新：每30秒更新计数（保持数据新鲜）──
    setInterval(function(){
      if (槽引用){ 刷新(槽引用); }
    }, 30000);

    return 底;
  }

  // ── 并发拉取记忆/图谱/规则/事件计数 + 模型 + 版本 ──
  function 刷新(槽){
    function 数(url, 键, 取值){
      fetch(后端() + url)
        .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
        .then(function(d){ 槽[键].textContent = 取值(d); })
        .catch(function(){ 槽[键].textContent = "—"; });
    }
    数("/api/memories", "记", function(d){ return (d.length || 0) + " 条"; });
    数("/api/cognition/graph", "谱", function(d){ return (d.符号集 || []).length + " 符号"; });

    // 规则计数 = RuleSet + 心智格位，用 Promise.allSettled 消除竞态闪烁
    Promise.allSettled([
      fetch(后端() + "/api/rules").then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); }),
      fetch(后端() + "/api/cognition/cells").then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
    ]).then(function(结果组){
      var rs = 0, 格位 = 0;
      // rules
      if (结果组[0].status === "fulfilled"){
        var rd = 结果组[0].value;
        rs = rd.length || 0;
      }
      // cells
      if (结果组[1].status === "fulfilled"){
        var cd = 结果组[1].value;
        var 全部 = cd.格位集 || cd.全部 || cd.cells || [];
        for (var i = 0; i < 全部.length; i++){
          var g = 全部[i];
          if ((g.维度 === "规则" || g.dimension === "规则") && g.摘要 && g.摘要.length > 0){
            格位++;
          }
        }
      }
      槽.规.textContent = (rs + 格位) + " 条";
    });

    数("/api/events", "事", function(d){ return (d.length || 0) + " 条"; });

    // 模型状态 + 引擎在线指示器联动
    fetch(后端() + "/api/llm/status")
      .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
      .then(function(d){
        槽.模.textContent = (d && d.当前选择 && d.当前选择.模型) || "未接入";
        设置在线态(true);
      })
      .catch(function(){
        槽.模.textContent = "未接入";
        设置在线态(false);
      });

    fetch(后端() + "/api/iterations/version")
      .then(function(r){ if (!r.ok){ throw new Error(); } return r.json(); })
      .then(function(d){ 槽.版.textContent = "v" + (d.主 || 0) + "." + (d.次 || 0) + "." + (d.修订 || 0); })
      .catch(function(){ 槽.版.textContent = "v—"; });
  }

  // ── 引擎在线状态动态更新 ──
  function 设置在线态(在线){
    if (!在线节点){ return; }
    var 文 = 在线节点.querySelector(".在线文");
    var 点 = 在线节点.querySelector(".点");
    if (文){ 文.textContent = 在线 ? "主引擎在线" : "引擎离线"; }
    if (点){
      if (在线){ 点.classList.remove("死"); } else { 点.classList.add("死"); }
    }
  }

  function 项(html, 类){
    var s = document.createElement("span");
    s.className = 类 ? "底栏-项 " + 类 : "底栏-项";
    s.innerHTML = html;
    return s;
  }

  function 点(){
    var s = document.createElement("span");
    s.className = "底栏-点";
    s.textContent = "·";
    return s;
  }

  return { 建: 建 };
})();

// 经挂载契约入园
乾坤界面.挂载("底栏", 乾坤底栏.建);

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 主区对话流 实现
   职责：渲染用户/道祖消息、五行任务进度卡、待确认卡、系统消息与
   输入条，经挂载契约进入主区槽位；支持快捷指令与流式回复。
   ═══════════════════════════════════════════════════════════ */
window.乾坤对话 = (function(){
  // ── 会话状态：空态启动，内容由真实交互填充 ──
  var 数据 = [];
  var 发送中 = false;   // 防重复发送锁
  var 发按钮 = null;    // 发送按钮引用（解锁用）

  // ── SVGs ──
  var I = {
    智: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M12 7V4M8 4h8"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M9 16.5h6"/></svg>',
    发: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l18-9-6 18-3-7z"/></svg>'
  };

  // ── 快捷指令注册表（可扩展）：内置 /清空、/刷新 两条 ──
  var 指令表 = {
    "清空": function(ctx){ return Promise.resolve(cmd_clear(ctx)); },
    "刷新": function(ctx){ return cmd_refresh(ctx); }
  };

  function register_command(名, 处理器){
    if (!名 || typeof 处理器 !== "function"){ return; }
    指令表[String(名).replace(/^\//, "")] = 处理器;
  }

  function parse_command(输入){
    var 文 = String(输入 == null ? "" : 输入).trim();
    if (!文 || 文.charAt(0) !== "/"){ return null; }
    var 段 = 文.replace(/^\/+/, "").split(/\s+/);
    var 名 = 段.shift();
    if (!名){ return null; }
    return { name: 名, args: 段 };
  }

  // /清空：清空消息渲染与数据；保留会话标识与元数据
  function cmd_clear(ctx){
    ctx = ctx || {};
    var 会话id = (ctx.会话id != null ? ctx.会话id : (window.乾坤对话.会话id || ""));
    var 会话元数据 = window.乾坤对话.会话元数据 || null;
    数据.length = 0;
    var 流 = ctx.流 || document.querySelector(".对话外壳 .对话流");
    if (流){
      流.innerHTML = "";
      render_welcome_panel(流);
      流.scrollTop = 0;
    }
    window.乾坤对话.会话id = 会话id;
    window.乾坤对话.会话元数据 = 会话元数据;
  }

  // /刷新：重新拉取当前会话消息；无会话时直接跳过（避免注定失败的占位请求），失败静默降级
  function cmd_refresh(ctx){
    ctx = ctx || {};
    var 后端 = (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
    var 会话id = (ctx.会话id != null ? ctx.会话id : (window.乾坤对话.会话id || ""));
    var 真实会话id = 会话id || (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.当前会话id) || "";
    if (!真实会话id){ return Promise.resolve(); }
    var 端点 = 后端 + "/api/dev/sessions/" + encodeURIComponent(真实会话id || "current");
    return fetch(端点)
      .then(function(r){ return r.ok ? r.json() : { 事件: [] }; })
      .then(function(d){
        数据.length = 0;
        (d.事件 || []).forEach(function(ev){
          if (ev.内容 && (ev.类型 === "任务答复" || ev.类型 === "思考" || ev.类型 === "工具结果")){
            // 回放内容一律过净化后再入 DOM
            数据.push({ 类:"讯息", 方:"对", 名:ev.角色 || "系统", 时:"刚刚", 文:净化(ev.内容) });
          }
        });
        var 流 = ctx.流 || document.querySelector(".对话外壳 .对话流");
        if (流){
          流.innerHTML = "";
          if (数据.length){
            数据.forEach(function(m){ 流.appendChild(渲染(m)); });
            流.scrollTop = 流.scrollHeight;
          } else {
            render_welcome_panel(流);
          }
        }
      })
      .catch(function(){ /* 静默降级：聊天面板保持可见 */ });
  }

  function on_unknown_command(名, 流){
    if (流){
      var 泡 = document.createElement("div");
      泡.className = "讯";
      泡.appendChild(document.createTextNode("未知指令 /"));
      var 加粗 = document.createElement("b");
      加粗.textContent = String(名 || "");
      泡.appendChild(加粗);
      泡.appendChild(document.createTextNode("，已忽略。可用：/清空、/刷新"));
      流.appendChild(泡);
      流.scrollTop = 流.scrollHeight;
    }
  }

  function dispatch_command(parsed, ctx){
    ctx = ctx || {};
    if (!parsed || !parsed.name){
      on_unknown_command("", ctx.流);
      return Promise.resolve();
    }
    var 处理器 = 指令表[parsed.name];
    if (!处理器){
      on_unknown_command(parsed.name, ctx.流);
      return Promise.resolve();
    }
    try {
      return Promise.resolve(处理器(ctx)).catch(function(){
        on_unknown_command(parsed.name, ctx.流);
      });
    } catch (e){
      on_unknown_command(parsed.name, ctx.流);
      return Promise.resolve();
    }
  }

  // 首屏欢迎面板：引导文案 + 快捷指令
  function render_welcome_panel(容器){
    if (!容器){ return; }
    容器.innerHTML = "";
    var 欢迎 = document.createElement("div");
    欢迎.className = "欢迎面板";
    欢迎.innerHTML =
      '<div class="欢迎-顶">' +
        '<span class="欢迎-徽">紫霄宫</span>' +
        '<span class="欢迎-名">洪荒·世界</span>' +
      '</div>' +
      '<div class="欢迎-标">与道祖对话</div>' +
      '<div class="欢迎-次">描述你的需求，道祖澄清对齐后发布任务，<br>经 木→火→土→金→水 五行流转自主完成。</div>' +
      '<div class="欢迎-行">' +
        '<i style="background:var(--木)"></i><i style="background:var(--火)"></i><i style="background:var(--土)"></i><i style="background:var(--金)"></i><i style="background:var(--水)"></i>' +
      '</div>' +
      '<div class="快捷面板">' +
        '<button class="快捷-项" data-cmd="清空"><span class="快捷-名">/清空</span><span class="快捷-描">清空当前会话</span></button>' +
        '<button class="快捷-项" data-cmd="刷新"><span class="快捷-名">/刷新</span><span class="快捷-描">重新拉取最新消息</span></button>' +
      '</div>';
    容器.appendChild(欢迎);
    function 取输入框(){
      return document.querySelector(".对话外壳 .对话输入 textarea");
    }
    Array.prototype.forEach.call(欢迎.querySelectorAll(".快捷-项"), function(btn){
      btn.addEventListener("click", function(){
        var 名 = btn.getAttribute("data-cmd") || "";
        var 框 = 取输入框();
        // 回显指令便于所见即所发；执行后清空，避免残留已执行的命令文本
        if (框){ 框.value = "/" + 名; 框.focus(); }
        dispatch_command({ name: 名, args: [] }, { 流: 容器 });
        if (框){ 框.value = ""; }
      });
    });
  }

  // ── 净化与轻渲染：先整体转义杜绝注入，再对已转义文本做结构替换 ──
  // 支持：思考折叠、```围栏代码块、`行内码`、**粗体**、# 标题、- 列表
  function 净化(文本){
    var s = String(文本 == null ? "" : 文本)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    // 1. 思考段折叠（内容保留原始换行，交由样式 pre-wrap 呈现）
    s = s.replace(/&lt;think&gt;([\s\S]*?)&lt;\/think&gt;/g, function(全, 内){
      return '<details class="思"><summary>思考过程</summary><div>' + 内 + '</div></details>';
    });
    // 2. 围栏代码块先摘出，避免内部被行内规则改写
    //    语言标记仅参与围栏识别，不落 DOM：净化不转义引号，属性拼接会被 " 逃逸（XSS）
    var 码堆 = [];
    s = s.replace(/```([\w-]*)\n?([\s\S]*?)```/g, function(全, 语言, 码){
      码堆.push(码.replace(/\n$/, ""));
      return "\x00" + (码堆.length - 1) + "\x00";
    });
    // 3. 行内码 / 粗体 / 标题 / 列表
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/^#{1,4}\s+(.*)$/gm, "<h6>$1</h6>");
    s = s.replace(/^[-*]\s+(.*)$/gm, "<span class='列'>•</span> $1");
    // 4. 换行 → <br>
    s = s.replace(/\n/g, "<br>");
    // 5. 还原代码块（pre 内保留真实换行）
    s = s.replace(/\x00(\d+)\x00/g, function(全, 序){
      return '<pre class="码"><code>' + 码堆[Number(序)] + '</code></pre>';
    });
    return s;
  }

  // ── 标题状态点：发送后运转中，回复收尾后回空闲 ──

  // ── 流式对话：POST /api/dev/chat/stream，SSE 打字机式追加 ──
  function 流式对话(后端, 文, 流, 载){
    var 出过内容 = false; // 流中断时区分"零内容可降级重发"与"已有部分内容不可重复"
    fetch(后端 + "/api/dev/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 消息: 文 })
    })
    .then(function(r){
      if (!r.ok || !r.body){ throw new Error("HTTP " + r.status); }
      var 读 = r.body.getReader();
      var 解码 = new TextDecoder("utf-8");
      var 缓冲 = "";
      var 泡 = null;
      var p = null;
      var 回复文本 = "";
      var 任务id = null;
      var 阶段 = "接待中";

      function 建泡(){
        if (泡) return;
        出过内容 = true;
        泡 = 渲染({ 类:"讯息", 方:"对", 名:"道祖", 时:"刚刚", 文:"" });
        流.appendChild(泡);
        p = 泡.querySelector(".气泡 p");
      }
      function 追加(delta){
        建泡();
        回复文本 += delta;
        if (p){ p.innerHTML = 净化(回复文本); }
        流.scrollTop = 流.scrollHeight;
      }
      function 收尾(){
        if (载 && 载.parentNode){ 载.remove(); }
        设置态("空闲");
        if (!泡 && !任务id){
          流.appendChild(渲染({ 类:"讯息", 方:"对", 名:"道祖", 时:"刚刚", 文:"（无回复）" }));
        }
        if (任务id){
          var 卡 = 建任务卡(任务id);
          流.appendChild(卡);
          流.scrollTop = 流.scrollHeight;
          轮询任务卡(卡, 任务id);
        } else if (阶段 === "待确认"){
          // 建待确认卡 内含 appendChild，此处不再重复挂载
          建待确认卡(后端, 流);
          流.scrollTop = 流.scrollHeight;
        }
      }
      function 泵(){
        return 读.read().then(function(结果){
          if (结果.done){ 收尾(); return; }
          缓冲 += 解码.decode(结果.value, { stream: true });
          var 帧们 = 缓冲.split("\n\n");
          缓冲 = 帧们.pop() || "";
          帧们.forEach(function(帧){
            var 数据帧 = "";
            帧.split("\n").forEach(function(行){
              if (行.indexOf("data:") === 0){ 数据帧 += 行.slice(5).trim(); }
            });
            if (!数据帧) return;
            try {
              var ev = JSON.parse(数据帧);
              if (ev.type === "TEXT_MESSAGE_CONTENT" && ev.delta){ 追加(ev.delta); }
              else if (ev.type === "RUN_FINISHED"){
                任务id = ev.任务id || null;
                阶段 = ev.阶段 || "接待中";
              }
            } catch(_){}
          });
          return 泵();
        });
      }
      return 泵();
    })
    .catch(function(){
      // 已有部分流内容：只收尾不重发，避免同步降级再追加一条重复回复
      if (出过内容){
        if (载 && 载.parentNode){ 载.remove(); }
        设置态("空闲");
        return;
      }
      同步对话(后端, 文, 流, 载);
    });
  }

  // ── 同步对话：流式不可用时的降级路径 ──
  function 同步对话(后端, 文, 流, 载){
    fetch(后端 + "/api/dev/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 消息: 文 })
    })
    .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
    .then(function(d){
      载.remove();
      设置态("空闲");
      流.appendChild(渲染({ 类:"讯息", 方:"对", 名:"道祖", 时:"刚刚", 文:净化(d.回复 || "（无回复）") }));
      流.scrollTop = 流.scrollHeight;
      if (d.任务id){
        var 卡 = 建任务卡(d.任务id);
        流.appendChild(卡);
        流.scrollTop = 流.scrollHeight;
        轮询任务卡(卡, d.任务id);
      } else if (d.阶段 === "待确认"){
        建待确认卡(后端, 流);
      }
    })
    .catch(function(){
      载.remove();
      设置态("空闲");
      流.appendChild(渲染({
        类:"讯息", 方:"对", 名:"道祖", 时:"刚刚",
        文:"（道祖暂未在线：需后端 run_dev_agent=true 且配置 LLM 密钥）请检查数据服务后重试。"
      }));
      流.scrollTop = 流.scrollHeight;
    });
  }

  // ── 五行任务进度卡 ──
  var 阶段表 = [
    { 五行:"木", 名:"道祖", 状态:["待受理","待道祖澄清","道祖澄清中"] },
    { 五行:"火", 名:"圣人", 状态:["待圣人设计","圣人设计中","待重新设计"] },
    { 五行:"土", 名:"大罗", 状态:["待大罗金仙实现","大罗金仙实现中","待修复","待重新实现"] },
    { 五行:"金", 名:"准圣", 状态:["待准圣验收","准圣验收中","待道祖终审","道祖终审中","待重新验收","已完成"] },
    { 五行:"水", 名:"太乙", 状态:["待清理","清理中","待重新清理","清理完成"] },
  ];

  function 状态到阶段(状态){
    for (var i=0; i<阶段表.length; i++){
      if (阶段表[i].状态.indexOf(状态) >= 0) return i;
    }
    return -1;
  }
  function 状态到结果(状态){
    if (状态 === "已完成" || 状态 === "清理完成") return "完成";
    if (状态.indexOf("中") >= 0) return "进行";
    if (状态.indexOf("重新") >= 0) return "重跑";
    return "等待";
  }

  // ── 待确认卡片：批准/驳回 + 5 秒自动确认 ──
  function 建待确认卡(后端, 流){
    var 卡 = document.createElement("div");
    卡.className = "任务卡 待确认";
    var 秒 = 5;
    卡.innerHTML =
      '<div class="头"><b>道祖已对齐需求</b><span class="状">待确认 '+秒+'s</span></div>'+
      '<div class="描">确认后即安排圣人设计、大罗金仙实现、准圣验收。</div>'+
      '<div class="排"><button class="准">确认发布</button><button class="否">驳回</button></div>';
    流.appendChild(卡);

    function 确认发布(){
      卡.querySelector(".状").textContent = "发布中…";
      fetch(后端 + "/api/dev/chat/confirm", { method: "POST" })
        .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
        .then(function(d){
          卡.querySelector(".头 b").textContent = "已确认 · 任务 #" + (d.任务id || "?");
          卡.querySelector(".状").textContent = "已发布";
          var 排 = 卡.querySelector(".排");
          if (排) 排.remove();
          var 新卡 = 建任务卡(d.任务id);
          流.appendChild(新卡);
          轮询任务卡(新卡, d.任务id);
          流.scrollTop = 流.scrollHeight;
        })
        .catch(function(e){
          卡.querySelector(".状").textContent = "发布失败";
          console.error("道祖确认发布失败", e);
        });
    }
    function 驳回(){
      clearInterval(计时器);
      卡.querySelector(".头 b").textContent = "已驳回";
      卡.querySelector(".状").textContent = "未发布";
      var 排 = 卡.querySelector(".排");
      if (排) 排.remove();
    }
    var 计时器 = setInterval(function(){
      秒 -= 1;
      var 状 = 卡.querySelector(".状");
      if (秒 >= 0 && 状 && 状.textContent.indexOf("待确认") === 0){ 状.textContent = "待确认 " + 秒 + "s"; }
      if (秒 <= 0){ clearInterval(计时器); 确认发布(); }
    }, 1000);
    卡.querySelector(".准").addEventListener("click", function(){ clearInterval(计时器); 确认发布(); });
    卡.querySelector(".否").addEventListener("click", 驳回);
    return 卡;
  }

  function 建任务卡(任务id){
    var 卡 = document.createElement("div");
    卡.className = "任务卡";
    卡.setAttribute("data-任务id", 任务id);
    var 行 = 阶段表.map(function(s, i){
      var 色 = "var(--" + s.五行 + ")";
      return '<div class="阶段" data-序="'+i+'">'+
        '<span class="点" style="background:'+色+'"></span>'+
        '<span class="名">'+s.五行+"·"+s.名+'</span>'+
        '<span class="态">等待</span></div>';
    }).join("");
    卡.innerHTML =
      '<div class="头"><b>任务 #'+任务id+'</b><span class="状">启动中…</span></div>'+
      '<div class="流">'+行+'</div>'+
      '<div class="过程"></div>';
    return 卡;
  }

  function 轮询任务卡(卡, 任务id){
    var 后端 = (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
    var 事件游标 = 0;
    var 过程源 = null;      // EventSource 句柄（SSE 路径）
    var 事件计时器 = null;  // 短轮询回退句柄
    var 状态计时器 = null;
    var 过程区 = 卡.querySelector(".过程");

    // 停止一切：卡片已被移除（/清空）或任务终态时调用，杜绝幽灵轮询
    function 全停(){
      if (状态计时器){ clearInterval(状态计时器); 状态计时器 = null; }
      if (事件计时器){ clearInterval(事件计时器); 事件计时器 = null; }
      if (过程源){ 过程源.close(); 过程源 = null; }
    }

    function 渲染过程行(ev){
      if (!过程区) return;
      if (ev.任务id && ev.任务id !== 任务id) return;
      if (ev.序号 <= 事件游标) return;
      事件游标 = ev.序号;
      var 行 = document.createElement("div");
      行.className = "过程行 " + (ev.类型 || "");
      var 角色 = ev.角色 || "";
      var 工具 = ev.工具名 ? " · " + ev.工具名 : "";
      var 内容 = (ev.内容 || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\n/g,"<br>");
      行.innerHTML = '<span class="标">'+角色+工具+'</span><span class="内">'+内容+'</span>';
      过程区.appendChild(行);
    }

    // 短轮询回退：SSE 不可用或失败时按 2s 增量拉取
    function 回退过程轮询(){
      if (事件计时器) return;
      事件计时器 = setInterval(function(){
        if (!卡.isConnected){ 全停(); return; }
        fetch(后端 + "/api/dev/pilot/process?since=" + 事件游标)
          .then(function(r){ if(!r.ok) throw 0; return r.json(); })
          .then(function(d){
            (d.事件 || []).forEach(渲染过程行);
            if (过程区) 过程区.scrollTop = 过程区.scrollHeight;
          })
          .catch(function(){});
      }, 2000);
    }

    // AG-UI 渲染器：按 type 分发聚合为思考块/工具卡/答复块
    function 建agui渲染器(过程区){
      var 块 = { 思:null, 具:null, 复:null, 复文:"" };
      function 新行(cls, 标){
        var 行 = document.createElement("div");
        行.className = "过程行 " + cls;
        var 签 = document.createElement("span");
        签.className = "标";
        签.textContent = 标;
        行.appendChild(签);
        过程区.appendChild(行);
        return 行;
      }
      return function(ev){
        if (!卡.isConnected){ 全停(); return; }
        switch(ev.type){
          case "REASONING_MESSAGE_START":
            块.思 = 新行("思考", "思考");
            var 折 = document.createElement("details");
            折.className = "思"; 折.open = true;
            折.innerHTML = '<summary>思考过程</summary><div class="内"></div>';
            块.思.appendChild(折);
            break;
          case "REASONING_MESSAGE_CONTENT":
            if (块.思){
              var 思内 = 块.思.querySelector(".内");
              if (思内) 思内.textContent += (ev.delta || "");
            }
            break;
          case "REASONING_MESSAGE_END":
            块.思 = null;
            break;
          case "TOOL_CALL_START":
            块.具 = 新行("工具调用", ev.toolCallName || "工具");
            var 码 = document.createElement("pre");
            码.className = "内";
            块.具.appendChild(码);
            break;
          case "TOOL_CALL_ARGS":
            if (块.具){
              var 码内 = 块.具.querySelector(".内");
              if (码内) 码内.textContent += (ev.delta || "");
            }
            break;
          case "TOOL_CALL_END":
            块.具 = null;
            break;
          case "TOOL_CALL_RESULT":
            var 果行 = 新行("工具结果", "结果");
            var 果 = document.createElement("span");
            果.className = "内";
            果.textContent = (ev.content || "");
            果行.appendChild(果);
            break;
          case "TEXT_MESSAGE_START":
            块.复文 = "";
            块.复 = 新行("任务答复", "答复");
            var 文 = document.createElement("span");
            文.className = "内";
            块.复.appendChild(文);
            break;
          case "TEXT_MESSAGE_CONTENT":
            块.复文 += (ev.delta || "");
            if (块.复){
              var 文内 = 块.复.querySelector(".内");
              if (文内) 文内.innerHTML = 净化(块.复文);
            }
            break;
          case "TEXT_MESSAGE_END":
            块.复 = null;
            break;
        }
      };
    }

    // 订阅过程事件 SSE；失败降级短轮询
    function 订阅过程流(){
      if (typeof EventSource === "undefined"){ 回退过程轮询(); return; }
      var 渲染agui = 建agui渲染器(过程区);
      过程源 = new EventSource(后端 + "/api/dev/stream/agui?since=" + 事件游标);
      过程源.onmessage = function(e){
        if (!卡.isConnected){ 全停(); return; }
        try {
          渲染agui(JSON.parse(e.data));
          if (过程区) 过程区.scrollTop = 过程区.scrollHeight;
        } catch(_){}
      };
      过程源.onerror = function(){
        if (过程源){ 过程源.close(); 过程源 = null; }
        if (卡.isConnected){ 回退过程轮询(); }
      };
    }

    // 1. 轮询任务状态（每3秒）驱动五行阶段卡
    状态计时器 = setInterval(function(){
      if (!卡.isConnected){ 全停(); return; }
      fetch(后端 + "/api/board/" + 任务id)
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(t){
          var 状态 = t.status || t.状态 || "";
          var 序 = 状态到阶段(状态);
          var 结果 = 状态到结果(状态);
          var 头 = 卡.querySelector(".头 .状");
          if (头) 头.textContent = 状态;
          var 阶段们 = 卡.querySelectorAll(".阶段");
          阶段们.forEach(function(el, i){
            var 态 = el.querySelector(".态");
            if (i < 序) { el.className = "阶段 done"; 态.textContent = "完成"; }
            else if (i === 序) { el.className = "阶段 active"; 态.textContent = 结果 === "进行" ? "进行中" : (结果 === "重跑" ? "重跑" : "进行"); }
            else { el.className = "阶段"; 态.textContent = "等待"; }
          });
          if (状态 === "已完成" || 状态 === "清理完成"){
            if (头) 头.textContent = "✓ " + 状态;
            全停();
          }
        })
        .catch(function(){});
    }, 3000);

    // 2. 订阅执行过程事件
    订阅过程流();
  }

  return {
    建: 建,
    渲染: 渲染,
    render_welcome_panel: render_welcome_panel,
    parse_command: parse_command,
    cmd_clear: cmd_clear,
    cmd_refresh: cmd_refresh,
    register_command: register_command,
    dispatch_command: dispatch_command,
    on_unknown_command: on_unknown_command
  };
})();

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 主区任务看板 实现
   职责：拉取 GET /api/board 真实任务，按五行层级（木火土金水）分列渲染；
   卡片点击弹出详情弹层（GET /api/board/{id}）；驱动按钮带加载态与状态条。
   经挂载契约进入主区槽位；监听「乾坤图标」在对话/看板间切换。
   ═══════════════════════════════════════════════════════════ */
window.乾坤看板 = (function(){
  function 后端(){
    return (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
  }

  // ── 状态 → 五行 权威映射（与后端 流转逻辑.状态层级标签 一致）──
  var 五行映射 = {
    "待受理":"木", "进行中":"木", "已取消":"木", "待道祖澄清":"木", "道祖澄清中":"木",
    "待圣人设计":"火", "圣人设计中":"火", "待重新设计":"火",
    "待大罗金仙实现":"土", "大罗金仙实现中":"土", "待修复":"土", "待重新实现":"土",
    "待准圣验收":"金", "准圣验收中":"金", "待道祖终审":"金", "道祖终审中":"金", "待重新验收":"金", "已完成":"金",
    "待清理":"水", "清理中":"水", "待重新清理":"水", "清理完成":"水"
  };

  // ── 五行列定义（相生顺序：木→火→土→金→水）──
  var 五行列 = [
    { 层:"木", 名:"木 · 需求", 角:"道祖",     色:"var(--木)" },
    { 层:"火", 名:"火 · 设计", 角:"圣人",     色:"var(--火)" },
    { 层:"土", 名:"土 · 实现", 角:"大罗金仙", 色:"var(--土)" },
    { 层:"金", 名:"金 · 验收", 角:"准圣",     色:"var(--金)" },
    { 层:"水", 名:"水 · 清理", 角:"太乙金仙", 色:"var(--水)" }
  ];

  var 刷 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
  var 驱 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/></svg>';
  var 疾 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14M4 7l5 5-5 5M13 7l5 5-5 5"/></svg>';
  var 关图标 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  var 列体集合 = {};
  var 计数集合 = {};
  var 驱动条 = null;      // 状态条节点
  var 钮集合 = [];        // [刷新钮, 驱动钮, 疾钮]
  var 轮询句柄 = null;    // 驱动状态轮询定时器
  var 数据缓存 = {};      // id → 任务（弹层兜底用）

  function 建(){
    var 外 = document.createElement("div");
    外.className = "看板外壳 主区视图";
    外.setAttribute("data-视图", "看板");
    外.style.display = "none"; // 默认对话流显示，看板隐藏

    // ── 看板头 ──
    var 头 = document.createElement("div");
    头.className = "看板头";
    头.innerHTML = '<span class="标">任务看板</span><span class="次">五行相生 · 任务流转</span>';
    var 刷新钮 = 按钮(刷 + "刷新", 载看板);
    var 驱动钮 = 按钮(驱 + "驱动", function(){ 驱动(false); });
    驱动钮.classList.add("主");
    var 疾钮 = 按钮(疾 + "驱动到空闲", function(){ 驱动(true); });
    疾钮.classList.add("主");
    头.appendChild(刷新钮); 头.appendChild(驱动钮); 头.appendChild(疾钮);
    钮集合 = [刷新钮, 驱动钮, 疾钮];
    外.appendChild(头);

    // ── 驱动状态条 ──
    驱动条 = document.createElement("div");
    驱动条.className = "驱动条";
    驱动条.innerHTML = '<span class="灯"></span><span class="文">正在探测驱动台…</span>';
    外.appendChild(驱动条);

    // ── 列组 ──
    var 列组 = document.createElement("div");
    列组.className = "看板列组";
    五行列.forEach(function(列){
      var 列节点 = document.createElement("section");
      列节点.className = "看板列";
      列节点.style.setProperty("--列色", 列.色);

      var 列头 = document.createElement("header");
      列头.className = "看板列头";
      列头.innerHTML = '<span class="点"></span><span class="名">' + 列.名 + '</span><span class="角">' + 列.角 + '</span>';
      var 计 = document.createElement("span");
      计.className = "计";
      计.textContent = "0";
      列头.appendChild(计);
      计数集合[列.层] = 计;

      var 列体 = document.createElement("div");
      列体.className = "看板列体";
      列体.setAttribute("data-层", 列.层);
      列体集合[列.层] = 列体;

      列节点.appendChild(列头);
      列节点.appendChild(列体);
      列组.appendChild(列节点);
    });
    外.appendChild(列组);

    // ── 主区视图切换：对话/看板 ──
    document.addEventListener("乾坤图标", function(e){
      var 键 = e.detail && e.detail.键;
      if (键 === "看板"){
        切换主区("看板");
        载看板();
      } else if (键 === "对话"){
        切换主区("对话");
      }
    });

    载看板();
    刷状态();
    return 外;
  }

  function 切换主区(目标){
    document.querySelectorAll(".主区视图").forEach(function(v){
      v.style.display = (v.getAttribute("data-视图") === 目标) ? "" : "none";
    });
  }

  function 载看板(){
    fetch(后端() + "/api/board")
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(任务){
        var 组 = { 木:[], 火:[], 土:[], 金:[], 水:[] };
        (任务 || []).forEach(function(t){
          数据缓存[t.id] = t;
          var 层 = 五行映射[t.status] || "木";
          (组[层] = 组[层] || []).push(t);
        });
        五行列.forEach(function(列){
          var 列表 = 组[列.层] || [];
          计数集合[列.层].textContent = String(列表.length);
          var 体 = 列体集合[列.层];
          体.innerHTML = "";
          if (!列表.length){
            var 空 = document.createElement("div");
            空.className = "看板空";
            空.textContent = "暂无任务";
            体.appendChild(空);
            return;
          }
          列表.forEach(function(t){ 体.appendChild(卡片(t, 列)); });
        });
      })
      .catch(function(){
        五行列.forEach(function(列){
          计数集合[列.层].textContent = "—";
          列体集合[列.层].innerHTML = '<div class="看板空">看板读取失败 · 需数据服务在线</div>';
        });
      });
  }

  function 卡片(t, 列){
    var 卡 = document.createElement("button");
    卡.className = "看板卡";
    var 状 = String(t.status || "—");
    var 进行中 = 状.indexOf("中") >= 0;
    卡.innerHTML =
      '<span class="题">' + 转(t.title || "（无标题）") + '</span>' +
      '<span class="元">' +
        '<span class="状' + (进行中 ? " 行" : "") + '">' + 转(状) + '</span>' +
        (t.优先级 ? '<span class="优">' + 转(t.优先级) + '</span>' : '') +
        (t.当前承接人 && t.当前承接人 !== "道祖" ? '<span class="承">' + 转(t.当前承接人) + '</span>' : '') +
      '</span>';
    卡.title = "任务 #" + t.id + " · 点击查看详情";
    卡.addEventListener("click", function(){ 弹层(t.id); });
    return 卡;
  }

  // ── 卡片详情弹层：优先取详情接口，失败回退列表缓存 ──
  function 弹层(id){
    var 罩 = document.createElement("div");
    罩.className = "看板弹罩";
    var 层 = document.createElement("div");
    层.className = "看板弹层";
    层.innerHTML = '<div class="弹头"><span class="弹标">任务 #' + 转(id) + '</span><span class="弹载">加载中…</span></div>';
    罩.appendChild(层);
    document.body.appendChild(罩);

    // 关闭统一收口：摘除 Esc 监听 + 幂等移除节点（避免监听器堆积与重复关闭抛错）
    function esc(e){ if (e.key === "Escape"){ 关(); } }
    function 关(){
      document.removeEventListener("keydown", esc);
      if (罩.parentNode){ 罩.parentNode.removeChild(罩); }
    }
    罩.addEventListener("click", function(e){ if (e.target === 罩){ 关(); } });
    document.addEventListener("keydown", esc);

    var 本地 = 数据缓存[id];
    fetch(后端() + "/api/board/" + id)
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .catch(function(){ if (本地){ return 本地; } throw new Error("无数据"); })
      .then(function(t){ 渲染弹层(层, t, 关); })
      .catch(function(){
        层.innerHTML = '<div class="弹头"><span class="弹标">任务 #' + 转(id) + '</span></div>' +
          '<div class="弹空">详情读取失败 · 需数据服务在线</div>';
      });
  }

  function 渲染弹层(层, t, 关){
    var 状 = String(t.status || "—");
    var 色 = 五行列.filter(function(c){ return c.层 === (五行映射[状] || "木"); })[0].色;
    var 历史 = (t.状态历史 || []).map(function(h){
      return '<div class="史行"><span class="史迁">' + 转(h.原状态) + ' → ' + 转(h.新状态) + '</span>' +
        '<span class="史者">' + 转(h.操作者) + '</span>' +
        '<span class="史时">' + 时间(h.时间) + '</span>' +
        (h.备注 ? '<span class="史注">' + 转(h.备注) + '</span>' : '') + '</div>';
    }).join("");
    var 回退 = t.回退来源
      ? '<div class="弹块"><div class="块题">回退来源</div><div class="回退行">' +
        '<span class="史迁">' + 转(t.回退来源.来源层级) + ' → ' + 转(t.回退来源.目标层级) + '</span>' +
        '<span class="史注">' + 转(t.回退来源.原因) + '</span>' +
        '<span class="史时">' + 时间(t.回退来源.回退时间) + '</span></div></div>'
      : "";
    var 澄清 = t.澄清记录
      ? '<div class="弹块"><div class="块题">澄清记录</div><div class="史注">' + 转(t.澄清记录.结论) +
        ' · ' + (t.澄清记录.继续 ? "继续推进" : "已终止") + ' · ' + 时间(t.澄清记录.时间) + '</div></div>'
      : "";
    var 扫尾 = t.扫尾记录
      ? '<div class="弹块"><div class="块题">交付核验</div><div class="史注">变更 ' + t.扫尾记录.变更总数 +
        ' · 兑现 ' + t.扫尾记录.兑现数 + ' · 未兑现 ' + t.扫尾记录.未兑现数 +
        (t.扫尾记录.说明 ? ' · ' + 转(t.扫尾记录.说明) : '') + '</div></div>'
      : "";
    var 承接 = (t.承接历史 && t.承接历史.length)
      ? '<div class="弹块"><div class="块题">承接历史</div><div class="史注">' +
        t.承接历史.map(转).join(" · ") + '</div></div>'
      : "";

    层.innerHTML =
      '<div class="弹头">' +
        '<span class="弹标">任务 #' + 转(t.id) + '</span>' +
        '<span class="弹状" style="color:' + 色 + ';border-color:' + 色 + '">' + 转(状) + '</span>' +
        '<button class="弹关" title="关闭（Esc）">' + 关图标 + '</button>' +
      '</div>' +
      '<div class="弹体">' +
        '<div class="弹题">' + 转(t.title || "（无标题）") + '</div>' +
        '<div class="弹描">' + (t.description ? 转(t.description) : '<span class="弱">无描述</span>') + '</div>' +
        '<div class="弹表">' +
          元("场景", t.场景) + 元("优先级", t.优先级) +
          元("发起人", t.发起人) + 元("承接人", t.当前承接人) +
          元("总令牌", t.总令牌 ? Number(t.总令牌).toLocaleString() : "—") +
          元("修复轮次", t.修复轮次 || "—") +
          元("创建", 时间(t.created_at)) + 元("更新", 时间(t.updated_at)) +
        '</div>' + 回退 + 澄清 + 扫尾 + 承接 +
        (历史 ? '<div class="弹块"><div class="块题">状态历史</div><div class="弹史">' + 历史 + '</div></div>' : '') +
      '</div>';
    层.querySelector(".弹关").addEventListener("click", 关);
  }

  function 元(名, 值){
    return '<div class="元项"><span class="元名">' + 名 + '</span><span class="元值">' + 转(值 == null || 值 === "" ? "—" : 值) + '</span></div>';
  }

  function 时间(秒){
    if (!秒){ return "—"; }
    try { return new Date(秒 * 1000).toLocaleString(); } catch(e){ return "—"; }
  }

  function 转(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ── 工具：构建顶栏按钮 ──
  function 按钮(html, 点击){
    var b = document.createElement("button");
    b.className = "钮";
    b.innerHTML = html;
    b.addEventListener("click", 点击);
    return b;
  }

  // ── 驱动：触发看板驱动台；期间按钮进入加载态并轮询状态条 ──
  function 驱动(到空闲){
    if (钮集合[1].disabled){ return; } // 已有驱动进行中
    设加载(true, 到空闲 ? "正在受理驱动到空闲…" : "正在受理驱动…");
    var 地址 = 后端() + (到空闲 ? "/api/dev/pilot/drain" : "/api/dev/pilot");
    var 体 = 到空闲 ? JSON.stringify({ 上限: 20 }) : undefined;
    fetch(地址, { method: "POST", headers: { "Content-Type": "application/json" }, body: 体 })
      .then(function(r){
        if (r.status === 409){ 条文("已有驱动执行中，正在跟随进度…", "讯"); return null; }
        if (r.status === 503){ 条文("驱动台未就绪：需配置 LLM_API_KEY 并开启 run_dev_agent 后重启", "险"); 设加载(false); return null; }
        if (!r.ok){ throw new Error("HTTP " + r.status); }
        条文(到空闲 ? "已受理：驱动到空闲执行中…" : "已受理：驱动一轮执行中…", "行");
        return r.json();
      })
      .then(function(d){ if (d){ 轮状态(); } })
      .catch(function(){ 条文("驱动请求失败 · 需数据服务在线", "险"); 设加载(false); 载看板(); });
  }

  // 每 2 秒刷新状态条与看板，直到驱动空闲后恢复按钮
  function 轮状态(){
    if (轮询句柄){ return; }
    var 步 = function(){
      fetch(后端() + "/api/dev/pilot/status")
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d.运行中){
            条文("驱动执行中" + (d.最近结果 ? " · " + d.最近结果 : ""), "行");
            载看板();
            轮询句柄 = setTimeout(步, 2000);
          } else {
            轮询句柄 = null;
            设加载(false);
            条文(d && d.最近结果 ? "驱动完成 · " + d.最近结果 : "驱动完成 · 驱动台空闲", "成");
            载看板();
          }
        })
        .catch(function(){
          轮询句柄 = null;
          设加载(false);
          条文("驱动状态探测失败 · 需数据服务在线", "险");
        });
    };
    步();
  }

  // 一次性探测驱动台就绪状态（建园时与驱动结束后复用）
  function 刷状态(){
    fetch(后端() + "/api/dev/pilot/status")
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.运行中){
          设加载(true);
          条文("驱动执行中" + (d.最近结果 ? " · " + d.最近结果 : ""), "行");
          轮状态();
        } else if (d && d.就绪){
          条文("驱动台就绪 · 空闲", "闲");
        } else {
          条文("驱动台未就绪：需配置 LLM_API_KEY 并开启 run_dev_agent", "险");
        }
      })
      .catch(function(){ 条文("驱动状态未知 · 需数据服务在线", "险"); });
  }

  function 设加载(中, 文案){
    钮集合.forEach(function(b, i){
      b.disabled = 中;
      b.classList.toggle("载", 中 && i > 0);
    });
    if (中 && 文案){ 条文(文案, "行"); }
  }

  function 条文(文, 态){
    if (!驱动条){ return; }
    驱动条.className = "驱动条 态-" + (态 || "闲");
    驱动条.querySelector(".文").textContent = 文;
  }

  return { 建: 建 };
})();

/* ═══════════════════════════════════════════════════════════
   乾坤 · 功能组件-殿 —— 左栏视图 实现
   职责：
   1. 监听「乾坤图标」事件：键=记忆/图谱 → 左抽屉展开并拉取真实数据；键=对话 → 收起；
   2. 记忆：GET /api/memories → 列表（内容 · 标签 · 归档徽标 · 时间）；
   3. 图谱：GET /api/cognition/graph → 概览计数 + 按所属模块聚合 + 节点清单（前 60）；
   4. 只读写自身 DOM；数据一律来自 fetch，失败可见降级。
   ═══════════════════════════════════════════════════════════ */
window.乾坤视图 = (function(){
  // ── 后端地址：由页面模板注入 window.乾坤配置；缺省同源 ──
  function 后端(){
    return (typeof window.乾坤配置 !== "undefined" && window.乾坤配置.道祖) || "";
  }
  function 转(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function 时戳(秒){
    if (!秒){ return ""; }
    var d = new Date(秒 * 1000);
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // ── 抽屉骨架 ──
  var 抽屉 = document.createElement("aside");
  抽屉.className = "视图-抽屉";
  抽屉.innerHTML =
    '<header class="视图-头"><b class="视图-题">视图</b>' +
    '<span class="视图-数"></span>' +
    '<button class="视图-关" aria-label="关闭视图"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>' +
    '<div class="视图-体"></div>';
  document.body.appendChild(抽屉);

  // ── 阅读覆盖层：点开文件后全屏预览内容 ──
  var 阅读 = document.createElement("div");
  阅读.className = "视图-阅读";
  阅读.innerHTML =
    '<div class="视图-阅读-面">' +
    '<header class="视图-阅读-头"><b class="视图-阅读-题">预览</b>' +
    '<button class="视图-阅读-关" aria-label="关闭预览"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>' +
    '<pre class="视图-阅读-体"></pre></div>';
  document.body.appendChild(阅读);
  var 阅读题 = 阅读.querySelector(".视图-阅读-题");
  var 阅读体 = 阅读.querySelector(".视图-阅读-体");
  阅读.querySelector(".视图-阅读-关").addEventListener("click", 关阅读);
  阅读.addEventListener("click", function(e){ if (e.target === 阅读){ 关阅读(); } });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape"){ 关阅读(); } });
  function 关阅读(){ 阅读.classList.remove("开"); }

  var 题 = 抽屉.querySelector(".视图-题");
  var 数 = 抽屉.querySelector(".视图-数");
  var 体 = 抽屉.querySelector(".视图-体");

  // 当前抽屉展示键（空 = 收起）；重复点击同键 → 收起并复位图标高亮
  var 当前键 = "";
  function 复位收起(键){
    当前键 = "";
    抽屉.classList.remove("开");
    if (键){
      document.dispatchEvent(new CustomEvent("乾坤图标复位", { detail: { 键: 键 } }));
    }
  }
  抽屉.querySelector(".视图-关").addEventListener("click", function(){ 复位收起(当前键); });

  function 收起(){ 抽屉.classList.remove("开"); }
  function 打开(标题){ 题.textContent = 标题; 数.textContent = ""; 抽屉.classList.add("开"); }

  // ── 记忆视图 ──
  function 载记忆(){
    打开("记忆库");
    体.innerHTML = '<div class="视图-载">读取中…</div>';
    fetch(后端() + "/api/memories")
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(列表){
        数.textContent = (列表.length || 0) + " 条";
        if (!列表.length){
          体.innerHTML = '<div class="视图-空">记忆库为空 · 五行运转产出后自动沉淀</div>';
          return;
        }
        体.innerHTML = "";
        列表.forEach(function(m){
          var 条 = document.createElement("div");
          条.className = "视图-记忆" + (m.归档 ? " 归档" : "");
          条.innerHTML =
            '<p class="视图-记忆-内">' + 转(m.内容) + '</p>' +
            '<p class="视图-记忆-元"><span class="视图-签">' + 转(m.标签 || "无签") + '</span>' +
            (m.归档 ? '<span class="视图-徽 警">待归档</span>' : "") +
            '<em>' + 时戳(m.created_at) + '</em></p>';
          体.appendChild(条);
        });
      })
      .catch(function(){
        体.innerHTML = '<div class="视图-错">记忆库读取失败 · 需数据服务在线（127.0.0.1:8321）</div>';
      });
  }

  // ── 图谱视图：真实结构 = 符号集 / 模块集 / 依赖集 / 技术栈 ──
  function 载图谱(){
    打开("世界态图谱");
    体.innerHTML = '<div class="视图-载">扫描中…</div>';
    fetch(后端() + "/api/cognition/graph")
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(g){
        var 符号 = g.符号集 || [], 模块 = g.模块集 || [], 依赖 = g.依赖集 || [];
        数.textContent = 符号.length + " 符号 · " + 模块.length + " 模块 · " + 依赖.length + " 依赖";
        // 符号按所属模块聚合
        var 组 = {};
        符号.forEach(function(n){
          var k = n.所属模块 || "未归";
          (组[k] = 组[k] || []).push(n);
        });
        体.innerHTML = "";
        Object.keys(组).sort().forEach(function(名){
          var 块 = document.createElement("details");
          块.className = "视图-模块";
          块.innerHTML = "<summary>" + 转(名) + " <em>" + 组[名].length + "</em></summary>";
          var 限 = 60, 截 = 组[名].length > 限;
          组[名].slice(0, 限).forEach(function(n){
            var 行 = document.createElement("div");
            行.className = "视图-节点";
            行.innerHTML = '<span class="视图-种 ' + 转(n.种类 || "") + '">' + 转(n.种类 || "?") + '</span><b>' + 转(n.名称) + '</b>';
            if (n.签名){ 行.title = n.签名; }
            块.appendChild(行);
          });
          if (截){
            var 更 = document.createElement("div");
            更.className = "视图-截";
            更.textContent = "… 另有 " + (组[名].length - 限) + " 项";
            块.appendChild(更);
          }
          体.appendChild(块);
        });
        if (g.技术栈 && g.技术栈.length){
          var 栈 = document.createElement("div");
          栈.className = "视图-栈";
          栈.innerHTML = "<h6>技术栈</h6>" + g.技术栈.map(function(t){ return "<span>" + 转(t) + "</span>"; }).join("");
          体.appendChild(栈);
        }
      })
      .catch(function(){
        体.innerHTML = '<div class="视图-错">图谱读取失败 · 需数据服务在线（127.0.0.1:8321）</div>';
      });
  }

  // ── 事件路由：图标键 → 视图动作（重复点击同键 = 收起）──
  document.addEventListener("乾坤图标", function(e){
    var 键 = e.detail && e.detail.键;
    if (键 && 键 === 当前键){ 复位收起(键); return; }
    if (键 === "记忆"){ 当前键 = 键; 载记忆(); }
    else if (键 === "图谱"){ 当前键 = 键; 载图谱(); }
    else if (键 === "传承殿"){ 当前键 = 键; 载文件("传承殿", "传承殿"); }
    else if (键 === "门禁"){ 当前键 = 键; 载文件("门禁", "门禁"); }
    else if (键 === "架构"){ 当前键 = 键; 载文件("架构", "架构"); }
    else { 当前键 = ""; 收起(); }
  });

  // ── 文件视图：传承殿（文档）/ 门禁（-门禁）/ 架构（架构图）──
  function 载文件(类名, 标题){
    打开(标题);
    体.innerHTML = '<div class="视图-载">读取中…</div>';
    fetch(后端() + "/api/files")
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(g){
        var 列表 = (g && g[类名]) || [];
        数.textContent = 列表.length + " 个文件";
        if (!列表.length){
          体.innerHTML = '<div class="视图-空">暂无' + 转(标题) + '文件</div>';
          return;
        }
        体.innerHTML = "";
        // 按顶层目录分组
        var 组 = {};
        列表.forEach(function(f){
          var 顶 = f.路径.split("/")[0] || "根";
          (组[顶] = 组[顶] || []).push(f);
        });
        Object.keys(组).sort().forEach(function(名){
          var 块 = document.createElement("details");
          块.className = "视图-文件组";
          块.open = true; // 默认展开，确保文件按钮直接可见可点
          块.innerHTML = "<summary>" + 转(名) + " <em>" + 组[名].length + "</em></summary>";
          组[名].forEach(function(f){
            var 行 = document.createElement("button");
            行.className = "视图-文件";
            行.innerHTML = "<b>" + 转(f.名称) + "</b><em>" + 转(f.路径) + "</em>";
            行.title = f.路径;
            行.addEventListener("click", function(){ 读文件(f.路径); });
            块.appendChild(行);
          });
          体.appendChild(块);
        });
      })
      .catch(function(){
        体.innerHTML = '<div class="视图-错">文件清单读取失败 · 需数据服务在线（127.0.0.1:8321）</div>';
      });
  }

  // ── 读取并预览单个文件内容 ──
  function 读文件(路径){
    阅读题.textContent = 路径;
    阅读体.textContent = "读取中…";
    阅读.classList.add("开");
    fetch(后端() + "/api/files/content?路径=" + encodeURIComponent(路径))
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(d){ 阅读体.textContent = d.内容 || "（空文件）"; })
      .catch(function(){ 阅读体.textContent = "读取失败：文件不可达或超出大小上限"; });
  }

  return { 抽屉: 抽屉, 载记忆: 载记忆, 载图谱: 载图谱, 载文件: 载文件, 收起: 收起 };
})();
</script>
</body>
</html>
