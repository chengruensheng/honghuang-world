<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洪荒 · 水镜映真</title>
  <style>/* ═══════════════════════════════════════════════════════════
   水镜 · 映真样式（自包含，不依赖门面令牌；色值只在此单点定义）
   视觉取向：止水为镜——低对比底、一色点睛、克制留白
   ═══════════════════════════════════════════════════════════ */
:root{
  --水底:#0e1116;          /* 页面止水 */
  --水面:#151a22;          /* 顶/底栏 */
  --水泡:#1b2230;          /* 讯泡 */
  --水己:#20303a;          /* 界主泡（契色微染） */
  --水线:#242d3d;          /* 描边 */
  --水字:#dbe4f0;          /* 正文 */
  --水弱:#8b96ab;          /* 次要 */
  --水契:#5fd0be;          /* 点睛（状态/按钮/任务） */
  --水错:#e07a6a;          /* 河错 */
}

html,body{ height:100%; margin:0; }
body{
  background:var(--水底); color:var(--水字);
  font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;
}

.镜-框{ display:flex; flex-direction:column; height:100vh; }

/* ── 顶栏 ── */
.镜-顶{
  display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:var(--水面); border-bottom:1px solid var(--水线);
}
.镜-题名{ letter-spacing:.12em; }
.镜-态{ color:var(--水契); font-size:12px; }
.镜-态::before{ content:"◈ "; opacity:.7; }

/* ── 镜流（主区） ── */
.镜-流{ flex:1; overflow-y:auto; padding:18px 16px 10px; scroll-behavior:smooth; }

/* 讯（消息） */
.镜-讯{ margin:0 0 14px; max-width:min(760px,92%); }
.镜-讯.己{ margin-left:auto; }
.镜-谁{ margin-bottom:4px; }
.镜-名{ font-size:12px; color:var(--水弱); letter-spacing:.08em; }
.镜-泡{
  background:var(--水泡); border:1px solid var(--水线);
  border-radius:10px; padding:9px 13px;
}
.镜-己泡{ background:var(--水己); border-color:transparent; }

/* 任务卡 */
.镜-任务卡{
  max-width:min(760px,92%); margin:0 0 14px;
  background:var(--水面); border:1px solid var(--水线); border-radius:10px;
  padding:10px 13px;
}
.镜-任务头{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.镜-任务态{ color:var(--水契); font-size:12px; white-space:nowrap; }
.镜-任务过程{ margin-top:6px; display:flex; flex-direction:column; gap:2px; }
.镜-过程行{ font-size:12px; color:var(--水弱); overflow-wrap:anywhere; }

/* 待确认卡 */
.镜-确认卡{ border-color:var(--水契); }
.镜-确认态{ color:var(--水契); font-size:12px; white-space:nowrap; }
.镜-确认描{ color:var(--水弱); font-size:13px; margin:6px 0; }
.镜-确认排{ display:flex; gap:8px; margin-top:4px; }
.镜-否{ background:transparent; color:var(--水弱); border-color:var(--水线); }

/* 河错（一等事件，不入正文） */
.镜-河错{
  max-width:min(760px,92%); margin:0 0 14px;
  border-left:3px solid var(--水错); background:var(--水面);
  border-radius:6px; padding:8px 12px; color:var(--水错); font-size:13px;
}

/* ── 底栏 ── */
.镜-底{
  display:flex; gap:10px; align-items:flex-end;
  padding:12px 16px; background:var(--水面); border-top:1px solid var(--水线);
}
.镜-入{
  flex:1; resize:none; max-height:120px;
  background:var(--水底); color:var(--水字);
  border:1px solid var(--水线); border-radius:8px; padding:9px 12px;
  font:inherit;
}
.镜-入:focus{ outline:none; border-color:var(--水契); }
.镜-发{ flex:none; }

/* ── 流光渲染器（内容路径零 innerHTML） ── */
.流-固,.流-尾{ display:flex; flex-direction:column; gap:2px; }
.流-段{ overflow-wrap:anywhere; white-space:pre-wrap; }
.流-空行{ height:.5em; }
.流-尾行::after{ content:"▍"; color:var(--水契); animation:流-闪 1s steps(2) infinite; }
@keyframes 流-闪{ 50%{ opacity:0; } }

.流-题{ font-weight:700; margin-top:.5em; }
.流-题-强{ font-size:1.15em; color:var(--水契); }
.流-列{ display:flex; gap:8px; }
.流-列点{ color:var(--水契); flex:none; }
.流-内码{
  background:rgba(95,208,190,.12); border-radius:4px; padding:0 4px;
  font-family:Consolas,monospace; font-size:.92em;
}
.流-码{
  background:#0a0d12; border:1px solid var(--水线); border-radius:8px;
  padding:10px 12px; overflow-x:auto; margin:.4em 0;
}
.流-码 code{ font-family:Consolas,monospace; font-size:.9em; white-space:pre; }
.流-思{ margin:.3em 0; border-left:2px solid var(--水线); padding-left:10px; }
.流-思 summary{ cursor:pointer; color:var(--水弱); font-size:12px; user-select:none; }
.流-思体{ color:var(--水弱); font-size:13px; }

/* ── DSL-lite 组件 ── */
.dsl-card{
  background:var(--水面); border:1px solid var(--水线);
  border-radius:10px; padding:10px 13px; margin:.5em 0;
}
.dsl-card-题{ color:var(--水契); font-weight:700; margin-bottom:4px; }
.dsl-card-体 :last-child{ margin-bottom:0; }
.dsl-btn{
  background:transparent; color:var(--水契);
  border:1px solid var(--水契); border-radius:7px;
  padding:6px 14px; font:inherit; cursor:pointer;
}
.dsl-btn:hover{ background:rgba(95,208,190,.12); }

/* 窄屏：仅压缩留白，不减功能 */
@media (max-width:640px){
  .镜-流{ padding:12px 10px 8px; }
  .镜-讯,.镜-任务卡,.镜-河错{ max-width:100%; }
}
</style>
</head>
<body>
  <!-- 骨架只声明槽位；一切内容皆由长河归约事件上屏（镜不藏水） -->
  <div class="镜-框">
    <header class="镜-顶">
      <b class="镜-题名">水镜映真</b>
      <span id="镜态" class="镜-态">空闲</span>
    </header>
    <main id="镜流" class="镜-流" aria-live="polite"></main>
    <footer class="镜-底">
      <textarea id="镜入" class="镜-入" rows="1"
        placeholder="对水镜言…（/清空 · /刷新）"></textarea>
      <button id="镜发" class="dsl-btn 镜-发" type="button">发送</button>
    </footer>
  </div>
  <!-- 环境配置：同源托管（8321）走相对路径；预览端口或 file 打开时显式指向数据服务 -->
  <script>
    window.水镜配置 = {
      道祖: (location.protocol === "http:" && location.port === "8321") ? "" : "http://127.0.0.1:8321"
    };
  </script>
  <script>/* ═══════════════════════════════════════════════════════════
   水镜 · 事件长河（镜面端核心）
   规约：界面 = 对长河事件的纯归约；镜不藏水（组件不私藏业务状态）。
   本文件是 词表.rs 归约的 JS 镜像同构实现（规格 = 设计稿 §4.3）。
   订户两类：状态订户（收归约后视图，渲染结构）；
             事件订户（收原始事件，流式内容直通上屏）。
   ═══════════════════════════════════════════════════════════ */
window.水镜长河 = (function(){
  "use strict";

  var 状态 = 空河();
  var 状态订户 = [];
  var 事件订户 = [];

  function 空河(){
    return { 阶段: "空闲", 消息: [], 任务: {}, 过程游标: 0, 连接: "离线" };
  }

  // ── 归约（镜像 词表.rs）：原地更新，单写者 = 长河 ──
  function 找消息(id){
    for (var i = 0; i < 状态.消息.length; i++){
      if (状态.消息[i].消息id === id){ return 状态.消息[i]; }
    }
    return null;
  }

  function 开消息(id, 向, 角色){
    var m = 找消息(id);
    if (!m){
      m = { 消息id: id, 方向: 向, 角色: 角色, 段: [], 在流: false };
      状态.消息.push(m);
    }
    return m;
  }

  function 尾工具段(m){
    for (var i = m.段.length - 1; i >= 0; i--){
      if (m.段[i].类 === "工具"){ return m.段[i]; }
    }
    return null;
  }

  // 追段文：有对应在流尾段则续写，否则新开段（与 Rust 追段文 同构）
  function 追段文(id, 类, 文){
    var m = 找消息(id);
    if (!m || !文){ return; }
    var 尾 = m.段.length ? m.段[m.段.length - 1] : null;
    if (尾 && 尾.类 === 类 && (类 !== "正文" || m.在流)){
      尾.文 += 文;
    } else {
      m.段.push({ 类: 类, 文: 文 });
    }
  }

  function 归约(ev){
    var s = 状态;
    switch (ev.类型){
      case "回复开始": {
        var m = 开消息(ev.消息id, "对方", ev.角色 || "道祖");
        m.在流 = true;
        break;
      }
      case "回复增量":
        追段文(ev.消息id, "正文", ev.文 || "");
        break;
      case "回复结束": {
        var m1 = 找消息(ev.消息id);
        if (m1){ m1.在流 = false; }
        break;
      }
      case "己言": {
        var m0 = 开消息(ev.消息id, "己方", "界主");
        m0.段.push({ 类: "正文", 文: ev.文 || "" });
        break;
      }
      case "思考开始": {
        var m2 = 开消息(ev.消息id, "对方", "道祖");
        m2.在流 = true;
        var 有 = m2.段.some(function(x){ return x.类 === "思考"; });
        if (!有){ m2.段.push({ 类: "思考", 文: "" }); }
        break;
      }
      case "思考增量":
        追段文(ev.消息id, "思考", ev.文 || "");
        break;
      case "思考结束": {
        var m3 = 找消息(ev.消息id);
        if (m3){ m3.在流 = false; }
        break;
      }
      case "工具开始": {
        var m4 = 开消息(ev.调用id, "对方", "道祖");
        m4.在流 = true;
        m4.段.push({ 类: "工具", 名称: ev.名称 || "工具", 参数: "", 结果: "" });
        break;
      }
      case "工具参数": {
        var m5 = 找消息(ev.调用id);
        var 段5 = m5 && 尾工具段(m5);
        if (段5){ 段5.参数 += (ev.片段 || ""); }
        break;
      }
      case "工具结束":
        break;
      case "工具结果": {
        var m6 = 找消息(ev.调用id);
        var 段6 = m6 && 尾工具段(m6);
        if (段6){ 段6.结果 = ev.文 || ""; }
        break;
      }
      case "运行结束": {
        s.阶段 = ev.阶段 || "接待中";
        if (ev.任务id != null){ 保任务(ev.任务id); }
        break;
      }
      case "任务状态": {
        var t = 保任务(ev.任务id);
        t.状态 = ev.状态 || "";
        break;
      }
      case "过程事件": {
        if (ev.序号 > s.过程游标){
          s.过程游标 = ev.序号;
          var t2 = 保任务(ev.任务id);
          t2.过程.push({ 序号: ev.序号, 类别: ev.类别 || "", 角色: ev.角色 || "", 工具名: ev.工具名 || null, 内容: ev.内容 || "" });
        }
        break;
      }
      case "河错":
        // 结构不变；错误经事件订户由显影层呈现
        break;
      case "清河": {
        var 净 = 空河();
        s.阶段 = 净.阶段; s.消息 = 净.消息; s.任务 = 净.任务; s.过程游标 = 0;
        break; // 连接态保留
      }
      default:
        break;
    }
  }

  function 保任务(id){
    var key = String(id);
    if (!s任务(key)){ 状态.任务[key] = { 状态: "", 过程: [] }; }
    return 状态.任务[key];
  }
  function s任务(key){ return Object.prototype.hasOwnProperty.call(状态.任务, key); }

  // ── 订户与派发 ──
  function 派发(ev){
    if (!ev || !ev.类型){ return; }
    归约(ev);
    var i;
    for (i = 0; i < 事件订户.length; i++){ 事件订户[i](ev); }
    for (i = 0; i < 状态订户.length; i++){ 状态订户[i](状态); }
  }

  function 订状态(fn){ 状态订户.push(fn); fn(状态); }
  function 订事件(fn){ 事件订户.push(fn); }
  function 当前(){ return 状态; }

  function 置连接(态){
    if (状态.连接 !== 态){
      状态.连接 = 态;
      状态订户.forEach(function(fn){ fn(状态); });
    }
  }

  return { 派发: 派发, 订状态: 订状态, 订事件: 订事件, 当前: 当前, 置连接: 置连接 };
})();

/* ═══════════════════════════════════════════════════════════
   水镜 · 河口适配层：长河统一通道（/api/river）直连 + 旧接口降级兜底。
   v1 落地：接待流/过程流切到后端长河事件直通，方言翻译表整体退役；
   旧接口（/api/dev/chat 同步、/api/board 任务态、/api/dev/sessions 回放）保留为兜底/补位。
   ═══════════════════════════════════════════════════════════ */
window.水镜河口 = (function(){
  "use strict";

  var 河 = function(){ return window.水镜长河; };
  var 任务计时 = {};

  function 后端址(){
    return (typeof window.水镜配置 !== "undefined" && window.水镜配置.道祖) || "";
  }

  function 派(ev){ 河().派发(ev); }

  // ── 接待流：POST /api/river/chat（后端长河事件直通，无需方言翻译）──
  // 看门狗（实测依据：后端断流时 read() 挂死不 reject，降级永不触发）：
  //   每次收到帧刷新活动时间；超阈值 → AbortController.abort() 强制断流
  //   （abort 使 read() 必 reject，复用 catch 分支走降级/收尾）。
  //   双阈值：已出正文 15s 无帧判死；未出正文 90s（容忍 LLM 长思考期无帧）。
  function 发消息(文){
    var 局 = { 出过内容: false, 收过尾: false, 活动: Date.now(), 看门狗: null };
    河().置连接("接待中");
    var 控 = new AbortController();
    局.看门狗 = setInterval(function(){
      var 上限 = 局.出过内容 ? 15000 : 90000;
      if (Date.now() - 局.活动 > 上限){ 控.abort(); }
    }, 5000);
    fetch(后端址() + "/api/river/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 消息: 文 }),
      signal: 控.signal
    })
    .then(function(r){
      if (!r.ok || !r.body){ throw new Error("HTTP " + r.status); }
      var 读 = r.body.getReader();
      var 解码 = new TextDecoder("utf-8");
      var 缓冲 = "";
      function 泵(){
        return 读.read().then(function(果){
          局.活动 = Date.now();               // 有响应即刷新活动时间
          if (果.done){ 派接待尾(局); return; }
          缓冲 += 解码.decode(果.value, { stream: true });
          var 帧们 = 缓冲.split("\n\n");
          缓冲 = 帧们.pop() || "";
          帧们.forEach(function(帧){
            var 数据 = "";
            帧.split("\n").forEach(function(行){
              if (行.indexOf("data:") === 0){ 数据 += 行.slice(5).trim(); }
            });
            if (!数据){ return; }
            try {
              var ev = JSON.parse(数据);       // 长河事件直通：{"类型":...,...}
              if (ev.类型 === "回复增量"){ 局.出过内容 = true; }
              if (ev.类型 === "运行结束"){ 局.收过尾 = true; }
              派(ev);
            } catch(_){}
          });
          return 泵();
        });
      }
      return 泵();
    })
    .catch(function(){
      停看门狗(局);
      if (局.出过内容){ 派接待尾(局); return; } // 已有部分内容：只收尾不重发
      降级同步(文, 局);
    });
  }

  function 停看门狗(局){
    if (局.看门狗){ clearInterval(局.看门狗); 局.看门狗 = null; }
  }

  function 派接待尾(局){
    停看门狗(局);
    河().置连接("空闲");
    if (局.收过尾){ return; }
    派({ 类型: "回复结束", 消息id: "接待" });
    派({ 类型: "运行结束", 阶段: "接待中", 任务id: null });
  }

  // ── 同步降级：POST /api/dev/chat（river 流式不可用时兜底）──
  function 降级同步(文, 局){
    停看门狗(局);
    河().置连接("接待中");
    fetch(后端址() + "/api/dev/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 消息: 文 })
    })
    .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
    .then(function(d){
      派({ 类型: "己言", 消息id: "己-" + Date.now(), 文: 文 });
      派({ 类型: "回复开始", 消息id: "接待", 角色: "道祖" });
      派({ 类型: "回复增量", 消息id: "接待", 文: d.回复 || "" });
      派({ 类型: "回复结束", 消息id: "接待" });
      派({ 类型: "运行结束", 阶段: d.阶段 || "接待中", 任务id: (d.任务id == null ? null : d.任务id) });
      局.收过尾 = true;
      河().置连接("空闲");
    })
    .catch(function(){
      局.收过尾 = true;
      河().置连接("空闲");
      派({ 类型: "河错", 来源: "道祖", 文: "道祖暂未在线（需后端 run_dev_agent=true 且配置 LLM 密钥）" });
    });
  }

  // ── 过程流：GET /api/river/stream（后端长河事件直通，EventSource 原生重连）──
  function 订过程(){
    if (typeof EventSource === "undefined"){ return; }
    var 源 = new EventSource(后端址() + "/api/river/stream");
    源.onmessage = function(e){
      try { 派(JSON.parse(e.data)); } catch(_){}
    };
    源.onerror = function(){
      派({ 类型: "河错", 来源: "过程流", 文: "过程流中断，等待自动重连" });
    };
  }

  // ── 任务态轮询：/api/board/{id}，终态自停（river 阶段完成推送为补充，此处补全中间态）──
  function 轮任务(任务id){
    var key = String(任务id);
    if (任务计时[key]){ return; }
    任务计时[key] = setInterval(function(){
      fetch(后端址() + "/api/board/" + encodeURIComponent(key))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(t){
          if (!t){ return; }
          var 态 = t.status || t.状态 || ""; // ← 双名回退隔离点
          派({ 类型: "任务状态", 任务id: Number(key), 状态: 态 });
          if (态 === "已完成" || 态 === "清理完成"){ 停任务轮(key); }
        })
        .catch(function(){});
    }, 3000);
  }

  function 停任务轮(key){
    if (任务计时[key]){ clearInterval(任务计时[key]); delete 任务计时[key]; }
  }

  // ── 回放：GET /api/dev/sessions/{id} → 长河事件（与实时同管线）──
  function 回放(会话id){
    return fetch(后端址() + "/api/dev/sessions/" + encodeURIComponent(会话id))
      .then(function(r){ return r.ok ? r.json() : { 事件: [] }; })
      .then(function(d){
        (d.事件 || []).forEach(function(ev, i){
          var id = "回放-" + i;
          if (ev.类型 === "任务答复"){
            派({ 类型: "回复开始", 消息id: id, 角色: ev.角色 || "道祖" });
            派({ 类型: "回复增量", 消息id: id, 文: ev.内容 || "" });
            派({ 类型: "回复结束", 消息id: id });
          } else if (ev.类型 === "思考"){
            派({ 类型: "思考开始", 消息id: id });
            派({ 类型: "思考增量", 消息id: id, 文: ev.内容 || "" });
            派({ 类型: "思考结束", 消息id: id });
          } else if (ev.类型 === "工具结果"){
            派({ 类型: "工具开始", 调用id: id, 名称: "工具" });
            派({ 类型: "工具结果", 调用id: id, 文: ev.内容 || "" });
          }
        });
        河().置连接("空闲");
      })
      .catch(function(){ /* 静默降级：镜面保持可见 */ });
  }

  // ── 自动回放最新会话（解决 API 发布任务后镜面空白）──
  function 最新会话回放(){
    return fetch(后端址() + "/api/dev/sessions")
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        var 列表 = d && (d.会话 || d.sessions || []); // ← 双名回退隔离点
        if (!列表 || !列表.length){ return; }
        var 最新 = 列表[列表.length - 1];
        var sid = 最新.会话id || 最新.id;             // ← 双名回退隔离点
        if (sid){ window.水镜镜面.当前会话id = sid; return 回放(sid); }
      })
      .catch(function(){});
  }

  // ── 接入：过程流 + 运行收尾自动挂任务轮 + 清河清理 ──
  function 接入(){
    订过程();
    河().订事件(function(ev){
      if (ev.类型 === "运行结束" && ev.任务id != null){ 轮任务(ev.任务id); }
      if (ev.类型 === "清河"){
        Object.keys(任务计时).forEach(停任务轮);
      }
    });
  }

  return { 发消息: 发消息, 订过程: 订过程, 轮任务: 轮任务, 回放: 回放, 最新会话回放: 最新会话回放, 接入: 接入 };
})();

/* ═══════════════════════════════════════════════════════════
   水镜 · 流光渲染器：LLM 内容流的增量上屏
   铁律一：内容路径零 innerHTML —— 只用 createElement/textContent，
           XSS 免疫由构造保证，不靠净化纪律。
   铁律二：增量有界 —— 完整行固化后永不重渲；重渲只发生在
           单个"未完成行"尾区，工作量 ∝ 本块增量。
   支持语法（v0 极简集，TokUI 兼容语法族）：
     Markdown-lite：# 标题 / - 列表 / **粗体** / `行内码` / ```围栏```
     思考折叠：<think> ... </think>
     DSL-lite：[card tt:标题] ... [/card]
               [btn clk:动作名]文本[/btn]
               [p 文本] / [h1~h6 文本]
   ═══════════════════════════════════════════════════════════ */
window.镜流光 = (function(){
  "use strict";

  function 建(挂点, 动作表){
    var 固流 = el("div", "流-固");
    var 尾区 = el("div", "流-尾");
    挂点.appendChild(固流);
    挂点.appendChild(尾区);

    var 缓冲 = "";          // 未完成行（尾区独占）
    var 栈 = [];            // 容器栈：card / think / 围码
    var 动作 = 动作表 || {};

    function 容(){
      return 栈.length ? 栈[栈.length - 1].点 : 固流;
    }

    function 喂(增量){
      if (!增量){ return; }
      缓冲 += 增量;
      if (缓冲.indexOf("\n") < 0){ 渲尾(); return; }
      var 行们 = 缓冲.split("\n");
      缓冲 = 行们.pop();          // 未完成行留尾区
      行们.forEach(固化行);
      渲尾();
    }

    // ── 完整行处理：状态机（容器标记 → DSL → Markdown）──
    function 固化行(行){
      var 文 = 行.replace(/\s+$/, "");
      // 1. 思考折叠标记
      if (文 === "<think>"){ 开容器("think"); return; }
      if (文 === "</think>"){ 关容器("think"); return; }
      // 2. 围栏
      var 栅 = 文.match(/^```([\w-]*)\s*$/);
      if (栅){
        if (栈.length && 栈[栈.length-1].类 === "围码"){ 关容器("围码"); }
        else { 开围码(); }
        return;
      }
      if (栈.length && 栈[栈.length-1].类 === "围码"){
        栈[栈.length-1].点.appendChild(document.createTextNode(行 + "\n"));
        return;
      }
      // 3. DSL-lite
      if (试DSL(文)){ return; }
      // 4. Markdown-lite 行
      容().appendChild(文行(文));
    }

    function 试DSL(文){
      var m;
      if ((m = 文.match(/^\[card(?:\s+tt:(.+))?\]\s*$/))){ 开卡(m[1] || ""); return true; }
      if (/^\[\/card\]\s*$/.test(文)){ 关容器("card"); return true; }
      if ((m = 文.match(/^\[btn(?:\s+clk:([\w\u4e00-\u9fa5-]+))?\](.*)\[\/btn\]\s*$/))){
        容().appendChild(建按钮(m[2] || "按钮", m[1] || ""));
        return true;
      }
      if ((m = 文.match(/^\[(p|h[1-6])\s+([^\]]*)\]\s*$/))){
        容().appendChild(文行(m[2], m[1]));
        return true;
      }
      return false;
    }

    function 开卡(标题){
      var 卡 = el("div", "dsl-card");
      if (标题){ 卡.appendChild(el("div", "dsl-card-题", 标题)); }
      var 体 = el("div", "dsl-card-体");
      卡.appendChild(体);
      容().appendChild(卡);
      栈.push({ 类: "card", 点: 体 });
    }

    function 开围码(){
      var pre = document.createElement("pre");
      pre.className = "流-码";
      var 码 = document.createElement("code");
      pre.appendChild(码);
      容().appendChild(pre);
      栈.push({ 类: "围码", 点: 码 });
    }

    function 开容器(类){
      if (类 === "think"){
        var 折 = document.createElement("details");
        折.className = "流-思";
        折.open = true;
        var 摘 = document.createElement("summary");
        摘.textContent = "思考过程";
        var 体 = el("div", "流-思体");
        折.appendChild(摘); 折.appendChild(体);
        容().appendChild(折);
        栈.push({ 类: "think", 点: 体 });
      }
    }

    function 关容器(类){
      for (var i = 栈.length - 1; i >= 0; i--){
        if (栈[i].类 === 类){ 栈.length = i; return; }
      }
    }

    function 建按钮(文本, 动作名){
      var b = document.createElement("button");
      b.className = "dsl-btn";
      b.type = "button";
      b.textContent = 文本;                 // 命名引用：DSL 只带动作名，不带代码
      b.addEventListener("click", function(){
        if (动作名 && typeof 动作[动作名] === "function"){ 动作[动作名](); }
      });
      return b;
    }

    // ── 行渲染：先结构（标题/列表/空段），再内联（粗体/行内码）──
    function 文行(文, 强类型){
      var m;
      if (!文){ return el("div", "流-空行"); }
      if (强类型 && /^h[1-6]$/.test(强类型)){
        var 级 = document.createElement(强类型);
        级.className = "流-题";
        内联(文, 级);
        return 级;
      }
      if ((m = 文.match(/^#{1,4}\s+(.*)$/))){
        var t = el("div", "流-题 流-题-强");
        内联(m[1], t);
        return t;
      }
      if ((m = 文.match(/^[-*]\s+(.*)$/))){
        var 行 = el("div", "流-列");
        行.appendChild(el("span", "流-列点", "•"));
        var 体 = el("span");
        内联(m[1], 体);
        行.appendChild(体);
        return 行;
      }
      var p = el("div", "流-段");
      内联(文, p);
      return p;
    }

    // 内联：**粗体** 与 `行内码` → DOM 节点（零 HTML 拼接）
    function 内联(文, 父){
      var 尾 = 0;
      var re = /\*\*([^*\n]+)\*\*|`([^`\n]+)`/g;
      var m;
      while ((m = re.exec(文)) !== null){
        if (m.index > 尾){ 父.appendChild(document.createTextNode(文.slice(尾, m.index))); }
        if (m[1] != null){
          var b = document.createElement("b");
          b.textContent = m[1];
          父.appendChild(b);
        } else {
          var c = document.createElement("code");
          c.className = "流-内码";
          c.textContent = m[2];
          父.appendChild(c);
        }
        尾 = m.index + m[0].length;
      }
      if (尾 < 文.length){ 父.appendChild(document.createTextNode(文.slice(尾))); }
    }

    // ── 尾区：只渲染未完成行（有界重渲唯一发生地）──
    function 渲尾(){
      尾区.textContent = "";
      if (!缓冲){ return; }
      if (栈.length && 栈[栈.length-1].类 === "围码"){
        栈[栈.length-1].点.appendChild(document.createTextNode(缓冲));
        缓冲 = "";                       // 半行直接落入围码（append-only）
        return;
      }
      var p = el("div", "流-段 流-尾行");
      p.textContent = 缓冲;
      尾区.appendChild(p);
    }

    function 收尾(){
      if (缓冲){ var 残 = 缓冲; 缓冲 = ""; 固化行(残); }
      while (栈.length){ 关容器(栈[栈.length-1].类); }
      尾区.textContent = "";
    }

    return { 喂: 喂, 收尾: 收尾 };
  }

  function el(标, 类名, 文本){
    var n = document.createElement(标);
    if (类名){ n.className = 类名; }
    if (文本 != null){ n.textContent = 文本; }
    return n;
  }

  // 验收样张：注入攻击串 + 富文本语法混排（供页面/测试调用断言）
  function 样张(){
    return [
      "<think>先思考：<img src=x onerror=alert(1)>",
      "得出结论。</think>",
      "# 标题 **加粗** 与 `行内码`",
      "- 列表项 <script>alert(2)<\/script>",
      "正文段落 \" onmouseover=\"x(1)",
      "[card tt:样例卡]",
      "[p 卡内段落 <b>非标签</b>]",
      "[btn clk:无此动作]点我[/btn]",
      "[/card]",
      "```html",
      "<img src=x onerror=alert(3)>",
      "```"
    ].join("\n");
  }

  return { 建: 建, 样张: 样张 };
})();

/* ═══════════════════════════════════════════════════════════
   水镜 · 镜面（显影层组件注册表 + 页面装配）
   规约：组件不私藏业务状态——一切显示来自长河归约视图；
        动作按名注册（TokUI 安全事件思路），DSL/组件只引用动作名。
   ═══════════════════════════════════════════════════════════ */
window.水镜镜面 = (function(){
  "use strict";

  var 组件表 = {};
  var 动作表 = {};
  var 已建消息 = {};   // 消息id → { 节点, 流光, 收过 }
  var 已建任务 = {};   // 任务id → { 节点, 态点, 过程点 }
  var 待确认节点 = null;
  var 待确认计时 = null;
  var 流点 = null;
  var 态点 = null;

  function 注册组件(名, fn){ if (名 && typeof fn === "function"){ 组件表[名] = fn; } }
  function 注册动作(名, fn){ if (名 && typeof fn === "function"){ 动作表[名] = fn; } }
  function 调动作(名, 参数){ var f = 动作表[名]; return f ? f(参数) : undefined; }

  function 后端址(){
    return (typeof window.水镜配置 !== "undefined" && window.水镜配置.道祖) || "";
  }

  // ── 启：装配输入条、订阅长河、接入河口、初始回放 ──
  function 启(){
    流点 = document.querySelector("#镜流");
    态点 = document.querySelector("#镜态");
    var 输 = document.querySelector("#镜入");
    var 发 = document.querySelector("#镜发");

    window.水镜长河.订事件(河事件);
    window.水镜长河.订状态(河状态);

    if (发){ 发.addEventListener("click", 发送); }
    if (输){
      输.addEventListener("keydown", function(e){
        if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); 发送(); }
      });
    }

    注册动作("确认发布", 确认发布);
    注册动作("驳回发布", 驳回发布);

    window.水镜河口.接入();
    window.水镜河口.最新会话回放();
  }

  function 发送(){
    var 输 = document.querySelector("#镜入");
    var 文 = (输.value || "").trim();
    if (!文){ return; }
    输.value = "";
    if (文 === "/清空"){
      window.水镜长河.派发({ 类型: "清河" });
      清挂点();
      return;
    }
    if (文 === "/刷新"){
      清挂点();
      window.水镜河口.最新会话回放();
      return;
    }
    appendUser(文);
    window.水镜河口.发消息(文);
  }

  // ── 事件订户：流式增量直通上屏（增量有界）──
  function 河事件(ev){
    if ((ev.类型 === "回复增量" || ev.类型 === "思考增量") && 已建消息[ev.消息id]){
      var 记 = 已建消息[ev.消息id];
      if (ev.类型 === "思考增量"){ 记.思喂 += ev.文 || ""; }
      else { 记.流光.喂(ev.文 || ""); }
    }
    if (ev.类型 === "河错" && 流点){ 流点.appendChild(错误条(ev.来源, ev.文)); 卷底(); }
  }

  // ── 状态订户：结构 diff（消息/任务/待确认/态条）──
  function 河状态(s){
    if (态点){
      var 文 = (s.连接 === "离线" ? "空闲" : s.连接) + (s.阶段 && s.阶段 !== "空闲" ? " · " + s.阶段 : "");
      if (态点.textContent !== 文){ 态点.textContent = 文; }
    }
    if (!流点){ return; }
    var i;
    for (i = 0; i < s.消息.length; i++){ 保消息(s.消息[i]); }
    Object.keys(s.任务).forEach(function(id){ 保任务卡(id, s.任务[id]); });
    保待确认(s.阶段);
    卷底();
  }

  function 保消息(m){
    var 记 = 已建消息[m.消息id];
    if (!记){
      if (m.方向 === "己方"){ 记 = { 节点: appendUser已有(m), 流光: null, 思喂: "" }; }
      else { 记 = 建对方泡(m); }
      已建消息[m.消息id] = 记;
      // 中途入河（回放/晚连）：把已有段一次性喂入（受同一渲染器约束，天然安全）
      if (m.方向 !== "己方" && m.段.length){ 初喂段(记, m.段); }
    }
    if (记.流光 && !m.在流 && !记.收过){ 记.流光.收尾(); 记.收过 = true; }
  }

  function 初喂段(记, 段们){
    for (var i = 0; i < 段们.length; i++){
      var 段 = 段们[i];
      if (段.类 === "思考"){ 记.流光.喂("<think>\n" + 段.文 + "\n</think>\n"); }
      else if (段.类 === "正文"){ 记.流光.喂(段.文 + "\n"); }
      else if (段.类 === "工具"){ 记.流光.喂("[p ⚙ " + 段.名称 + " → " + (段.结果 || "执行中") + "]\n"); }
    }
    记.思喂 = "";
  }

  function 建对方泡(m){
    var 容 = el("div", "镜-讯 对");
    var 头 = el("div", "镜-谁");
    头.appendChild(el("b", "镜-名", m.角色 || "道祖"));
    容.appendChild(头);
    var 泡 = el("div", "镜-泡");
    var 体 = el("div", "镜-流体");
    泡.appendChild(体);
    容.appendChild(泡);
    流点.appendChild(容);
    return { 节点: 容, 流光: window.镜流光.建(体, 动作表), 思喂: "", 收过: false };
  }

  function appendUser(文){
    var 容 = el("div", "镜-讯 己");
    var 头 = el("div", "镜-谁");
    头.appendChild(el("b", "镜-名", "界主"));
    容.appendChild(头);
    var 泡 = el("div", "镜-泡 镜-己泡");
    泡.textContent = 文;              // 界主输入同样零 innerHTML
    容.appendChild(泡);
    流点.appendChild(容);
    卷底();
    return 容;
  }

  function appendUser已有(m){
    var 容 = el("div", "镜-讯 己");
    var 头 = el("div", "镜-谁");
    头.appendChild(el("b", "镜-名", m.角色 || "界主"));
    容.appendChild(头);
    var 泡 = el("div", "镜-泡 镜-己泡");
    var 文 = "";
    m.段.forEach(function(段){ if (段.类 === "正文"){ 文 += 段.文; } });
    泡.textContent = 文;
    容.appendChild(泡);
    流点.appendChild(容);
    return 容;
  }

  // 任务卡：状态词直显（状态词表唯一来源=后端；前端不做字符串猜谜）
  function 保任务卡(id, t){
    var 记 = 已建任务[id];
    if (!记){
      var 卡 = el("div", "镜-任务卡");
      var 头 = el("div", "镜-任务头");
      头.appendChild(el("b", null, "任务 #" + id));
      var 态 = el("span", "镜-任务态");
      头.appendChild(态);
      卡.appendChild(头);
      var 过 = el("div", "镜-任务过程");
      卡.appendChild(过);
      流点.appendChild(卡);
      记 = { 节点: 卡, 态点: 态, 过程点: 过, 过程数: 0 };
      已建任务[id] = 记;
    }
    if (记.态点.textContent !== (t.状态 || "")){ 记.态点.textContent = t.状态 || ""; }
    if (t.过程.length > 记.过程数){
      记.过程数 = t.过程.length;
      记.过程点.textContent = "";
      t.过程.slice(-5).forEach(function(条){
        var 行 = el("div", "镜-过程行");
        行.textContent = (条.角色 || "") + (条.工具名 ? " · " + 条.工具名 : "") + "：" + 条.内容;
        记.过程点.appendChild(行);
      });
    }
  }

  // 待确认卡：5 秒自动确认（动作按名引用）
  function 保待确认(阶段){
    if (阶段 === "待确认" && !待确认节点){ 待确认节点 = 建待确认(); }
    if (阶段 !== "待确认" && 待确认节点 && 待确认节点.dataset.态 === "开"){
      待确认节点.dataset.态 = "收";
      待确认节点.querySelector(".镜-确认态").textContent = "已处理";
      停倒计时();
      待确认节点 = null;
    }
  }

  function 建待确认(){
    var 卡 = el("div", "镜-任务卡 镜-确认卡");
    卡.dataset.态 = "开";
    var 头 = el("div", "镜-任务头");
    头.appendChild(el("b", null, "道祖已对齐需求"));
    头.appendChild(el("span", "镜-确认态", "待确认 5s"));
    卡.appendChild(头);
    卡.appendChild(el("div", "镜-确认描", "确认后即安排圣人设计、大罗金仙实现、准圣验收。"));
    var 排 = el("div", "镜-确认排");
    var 准 = el("button", "dsl-btn", "确认发布");
    var 否 = el("button", "dsl-btn 镜-否", "驳回");
    准.type = "button"; 否.type = "button";
    排.appendChild(准); 排.appendChild(否);
    卡.appendChild(排);
    流点.appendChild(卡);
    var 秒 = 5;
    待确认计时 = setInterval(function(){
      秒 -= 1;
      var 状 = 卡.querySelector(".镜-确认态");
      if (秒 <= 0){ 停倒计时(); 调动作("确认发布", 卡); }
      else if (状){ 状.textContent = "待确认 " + 秒 + "s"; }
    }, 1000);
    准.addEventListener("click", function(){ 停倒计时(); 调动作("确认发布", 卡); });
    否.addEventListener("click", function(){ 停倒计时(); 调动作("驳回发布", 卡); });
    return 卡;
  }

  function 停倒计时(){ if (待确认计时){ clearInterval(待确认计时); 待确认计时 = null; } }

  function 确认发布(卡){
    var 态 = 卡 && 卡.querySelector(".镜-确认态");
    if (态){ 态.textContent = "发布中…"; }
    fetch(后端址() + "/api/dev/chat/confirm", { method: "POST" })
      .then(function(r){ if (!r.ok){ throw new Error("HTTP " + r.status); } return r.json(); })
      .then(function(d){
        if (态){ 态.textContent = "已发布 · 任务 #" + (d.任务id != null ? d.任务id : "?"); }
        var 排 = 卡 && 卡.querySelector(".镜-确认排");
        if (排 && 排.parentNode){ 排.parentNode.removeChild(排); }
        if (d.任务id != null){
          window.水镜长河.派发({ 类型: "任务状态", 任务id: d.任务id, 状态: "启动中" });
          window.水镜河口.轮任务(d.任务id);
        }
      })
      .catch(function(){ if (态){ 态.textContent = "发布失败"; } });
  }

  function 驳回发布(卡){
    var 态 = 卡 && 卡.querySelector(".镜-确认态");
    if (态){ 态.textContent = "已驳回"; }
    var 排 = 卡 && 卡.querySelector(".镜-确认排");
    if (排 && 排.parentNode){ 排.parentNode.removeChild(排); }
  }

  function 错误条(来源, 文){
    var n = el("div", "镜-河错");
    n.textContent = "〔" + (来源 || "河") + "〕" + (文 || "");
    return n;
  }

  function 清挂点(){
    if (!流点){ return; }
    while (流点.firstChild){ 流点.removeChild(流点.firstChild); }
    Object.keys(已建消息).forEach(function(k){ delete 已建消息[k]; });
    Object.keys(已建任务).forEach(function(k){ delete 已建任务[k]; });
    待确认节点 = null;
    停倒计时();
  }

  function 卷底(){ if (流点){ 流点.scrollTop = 流点.scrollHeight; } }

  function el(标, 类名, 文本){
    var n = document.createElement(标);
    if (类名){ n.className = 类名; }
    if (文本 != null){ n.textContent = 文本; }
    return n;
  }

  return {
    启: 启, 注册组件: 注册组件, 注册动作: 注册动作, 调动作: 调动作,
    清挂点: 清挂点, 当前会话id: ""
  };
})();
</script>
  <script>
    window.addEventListener("DOMContentLoaded", function(){ window.水镜镜面.启(); });
  </script>
</body>
</html>
