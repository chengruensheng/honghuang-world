[workspace]
resolver = "2"
members = [
    "鸿蒙/基础契约-域/错误定义-府",
    "鸿蒙/基础契约-域/核心契约-府",
    "鸿蒙/基础契约-域/信号契约-府",
    "鸿蒙/基础契约-域/领域契约-府",
    "鸿蒙/基础契约-域/内容契约-府",
    "鸿蒙/基础契约-域/执行契约-府",
    "鸿蒙/基础契约-域/交互协议-府",
    "鸿蒙/基础能力-域/内容生成-府",
    "鸿蒙/基础能力-域/配置管理-府",
    "鸿蒙/基础能力-域/日志管理-府",
    "鸿蒙/基础能力-域/信号总线-府",
    "鸿蒙/基础能力-域/执行工具-府",
    "鸿蒙/基础能力-域/项目认知-府",
    "鸿蒙/基础能力-域/数据服务-府",
    "鸿蒙/系统装配-域/启动入口-府",
    "鸿蒙/系统装配-域/联动装配-府",
    "鸿蒙/系统装配-域/组件容器-府",
    "鸿蒙/系统装配-域/自主开发-府",
    "鸿蒙/系统装配-域/桌面封装-府/src-tauri",
    "证道/基础验证-域/配置测试-府",
    "太初/任务管理-域/任务核心-府",
    "证道/基础验证-域/任务测试-府",
    "量劫/迭代管理-域/迭代核心-府",
    "证道/基础验证-域/迭代测试-府",
    "乾坤/记忆管理-域/记忆核心-府",
    "乾坤/界面呈现-域/门面承载-府",
    "证道/基础验证-域/记忆测试-府",
    "证道/基础验证-域/界面测试-府",
    "道韵/规则管理-域/规则核心-府",
    "证道/基础验证-域/规则测试-府",
    "混沌/事件管理-域/事件核心-府",
    "证道/基础验证-域/事件测试-府",
    "证道/基础验证-域/联动测试-府",
    "证道/基础验证-域/内容测试-府",
    "证道/基础验证-域/信号测试-府",
    "证道/基础验证-域/执行测试-府",
    "证道/基础验证-域/智能测试-府",
    "证道/基础验证-域/认知测试-府",
    "证道/基础验证-域/数据服务测试-府",
    "证道/基础验证-域/协议测试-府",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
ureq = "2"
dotenvy = "0.15"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "rt", "time"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
async-stream = "0.3"
futures-core = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }