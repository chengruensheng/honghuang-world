[workspace]
resolver = "2"
members = [
    "鸿蒙/基础设施 - 域/识海承载-府",
    "鸿蒙/基础设施 - 域/道术施展-府",
    "鸿蒙/基础设施 - 域/天庭治理-府",
    "鸿蒙/基础设施 - 域/模型连接-府",
    "鸿蒙/基础设施 - 域/日志记录-府",
    "鸿蒙/基础设施 - 域/事件总线-府",
    "鸿蒙/基础设施 - 域/插件承载-府",
    "鸿蒙/基础设施 - 域/状态共享-府",
    "鸿蒙/世界配置 - 域/配置管理-府",
    "鸿蒙/基础设施 - 域/观测探针-府",
    "乾坤/呈现-域/命令操作-府",
    "证道/鸿蒙 - 域/单元测试-府",
    "世界",
]

# 集中元数据：12 个 crate 共享（避免重复）
[workspace.package]
edition = "2021"
rust-version = "1.75"
authors = ["此生愿"]
license = "MIT"

[workspace.dependencies]
# 跨 crate 共享依赖版本（避免重复）
parking_lot = "0.12"

# 集中 lints 配置：12 个 crate 共享（避免重复）
[workspace.lints.rust]
unsafe_code = "deny"  # 13 个 crate 全部禁止 unsafe
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# 中文命名约定：snake_case 是规范，但项目用中文 = 必须显式 allow
non_snake_case = { level = "allow", priority = 0 }
# 模块级抽象 lints
module_name_repetitions = "allow"  # 数据-抓取-殿/事件-读取-阁/... 模块名重复难避免
similar_names = "allow"  # 项目内多 crate 重名难避免
too_many_arguments = "allow"  # 9 府入口常接 5+ 参数
result_large_err = "allow"  # 错误信息是 String 不是 thiserror
too_long_first_doc_paragraph = "allow"
# §B.3.11 clippy::pedantic（更严的 lint）
missing_errors_doc = "allow"
missing_panics_doc = "allow"
