<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洪荒 · 界面呈现</title>
  <style>{{背景样式}}</style>
  <style>{{布局样式}}</style>
  <style>{{组件样式}}</style>
</head>
<body>
  <!-- 布局只声明槽位；组件由 乾坤界面.挂载 进入，二者互不知晓对方内部 -->
  <div class="界面-布局">
    <header class="界面-槽位" data-槽位名="顶栏"></header>
    <aside class="界面-槽位" data-槽位名="左栏"></aside>
    <main class="界面-槽位" data-槽位名="主区"></main>
    <aside class="界面-槽位" data-槽位名="右栏"></aside>
    <footer class="界面-槽位" data-槽位名="底栏"></footer>
  </div>
  <!-- 环境配置：同源托管（8321）走相对路径；预览端口或 file 打开时显式指向数据服务 -->
  <script>
    window.乾坤配置 = {
      道祖: (location.protocol === "http:" && location.port === "8321") ? "" : "http://127.0.0.1:8321"
    };
  </script>
  <!-- 挂载契约必须先于组件脚本加载 -->
  <script>{{挂载脚本}}</script>
  <script>{{组件脚本}}</script>
</body>
</html>
