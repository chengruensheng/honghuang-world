<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洪荒 · 水镜映真</title>
  <style>{{水镜样式}}</style>
</head>
<body>
  <!-- 骨架只声明槽位；一切内容皆由长河归约事件上屏（镜不藏水） -->
  <div class="镜-框">
    <header class="镜-顶">
      <b class="镜-题名">水镜映真</b>
      <span id="镜态" class="镜-态">空闲</span>
    </header>
    <main id="镜流" class="镜-流" aria-live="polite"></main>
    <footer class="镜-底">
      <textarea id="镜入" class="镜-入" rows="1"
        placeholder="对水镜言…（/清空 · /刷新）"></textarea>
      <button id="镜发" class="dsl-btn 镜-发" type="button">发送</button>
    </footer>
  </div>
  <!-- 环境配置：同源托管（8321）走相对路径；预览端口或 file 打开时显式指向数据服务 -->
  <script>
    window.水镜配置 = {
      道祖: (location.protocol === "http:" && location.port === "8321") ? "" : "http://127.0.0.1:8321"
    };
  </script>
  <script>{{水镜脚本}}</script>
  <script>
    window.addEventListener("DOMContentLoaded", function(){ window.水镜镜面.启(); });
  </script>
</body>
</html>
