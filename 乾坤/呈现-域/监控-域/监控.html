<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>洪荒世界 · 乾坤监控域(纯只读)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d1117;color:#c9d1d9;font-family:"Microsoft YaHei",Segoe UI,sans-serif;font-size:13px}
  #bar{position:fixed;top:0;left:0;right:0;z-index:30;background:#161b22;border-bottom:1px solid #30363d;padding:8px 14px;display:flex;align-items:center;gap:12px}
  #bar .t{font-weight:bold;color:#e6edf3;font-size:14px}
  #bar .dot{width:10px;height:10px;border-radius:50%;background:#2ea043;display:inline-block;animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.2}}
  #bar .meta{color:#8b949e;font-size:12px;margin-left:auto}
  #tabs{position:fixed;top:48px;left:0;right:0;z-index:25;background:#0d1117;border-bottom:1px solid #21262d;padding:6px 14px;display:flex;gap:8px}
  #tabs button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:5px 14px;cursor:pointer;font-size:12px}
  #tabs button.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
  #wrap{position:fixed;top:92px;bottom:0;left:0;right:0;overflow:auto;padding:12px 16px 40px}
  .panel{display:none}.panel.on{display:block}
  #overview{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px 16px;min-width:150px}
  .card .k{color:#8b949e;font-size:11px}.card .v{font-size:18px;font-weight:bold;margin-top:3px}
  .ok{color:#3fb950}.fail{color:#f85149}.run{color:#58a6ff}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{border-bottom:1px solid #21262d;padding:6px 10px;text-align:left;vertical-align:top}
  th{color:#8b949e;font-weight:600;position:sticky;top:0;background:#0d1117}
  .acc-good{color:#3fb950}.acc-bad{color:#f85149}.acc-running{color:#58a6ff}
  .tl{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #1c2128;cursor:pointer;flex-wrap:wrap}
  .tl .tm{color:#8b949e;white-space:nowrap;font-size:11.5px;width:80px}
  .tl .ty{width:70px;font-weight:600}
  .tl .tx{color:#c9d1d9;flex:1;word-break:break-all}
  .ty-验收{color:#f0883e}.ty-失败{color:#f85149}.ty-状态{color:#3fb950}.ty-工具{color:#58a6ff}.ty-定档{color:#3fb950}.ty-设计{color:#d2a8ff}
  details{margin:3px 0}summary{cursor:pointer;color:#58a6ff}
  .ob{background:#161b22;border:1px solid #30363d;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<div id="bar"><span class="dot"></span><span class="t">洪荒世界 · 乾坤监控域(纯只读)</span>
  <span class="meta"><span>引擎 <b id="live">-</b></span> · <span>节点 <b id="tcount">0</b></span></span></div>
<div id="tabs">
  <button id="tab-ov" class="on">任务列表</button>
  <button id="tab-chain">单任务文档链</button>
  <button id="tab-obs">原始观测(调试)</button>
  <button id="tab-tl">时间线</button>
  <button id="tab-sp">spill</button>
</div>
<div id="wrap">
  <div id="panel-ov" class="panel on">
    <div id="overview"></div>
    <div id="task-filter" style="margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="color:#8b949e">结论</span>
      <select id="f-verdict"><option value="">全部</option><option value="通过">通过</option><option value="打回">打回</option><option value="执行中">执行中</option></select>
      <span style="color:#8b949e">关键词</span>
      <input id="f-kw" placeholder="搜方向/要求id" style="background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:4px 8px;width:180px">
      <button onclick="loadTasks()" style="background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:5px 14px;cursor:pointer">刷新</button>
    </div>
    <table><thead><tr><th>要求</th><th>方向</th><th>结论</th><th>耗时</th><th>token</th><th>产物</th><th>说明</th></tr></thead><tbody id="task-body"></tbody></table>
    <div id="task-detail" style="margin-top:14px"></div>
  </div>
  <div id="panel-chain" class="panel">
    <div style="margin:6px 0;display:flex;gap:8px;align-items:center">
      <span style="color:#8b949e">按 要求id 还原整条执行链</span>
      <input id="chain-req" placeholder="如 要求-24" style="background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:4px 8px;width:160px">
      <button onclick="loadChain()" style="background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:5px 14px;cursor:pointer">还原</button>
    </div>
    <div id="chain-body"></div>
  </div>
  <div id="panel-obs" class="panel">
    <div style="margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="color:#8b949e">调试用：原始白箱记录按 域/角色 过滤</span>
      <select id="f-domain"><option value="">全部域</option></select>
      <select id="f-role"><option value="">全部角色</option></select>
      <input id="f-req" placeholder="要求id" style="background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:4px 8px;width:140px">
      <button onclick="loadRecords()" style="background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:5px 14px;cursor:pointer">刷新</button>
    </div>
    <div id="obs-body"></div>
  </div>
  <div id="panel-tl" class="panel"><div id="tl-body"></div></div>
  <div id="panel-sp" class="panel"><div id="sp-body"></div></div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtTs(ts){if(!ts)return'';var d=new Date(ts);function p(n){return n<10?'0'+n:n;}return p(d.toLocaleDateString()=='1/1/1970'?'':d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
function fetchJson(u,cb){fetch(u).then(r=>r.json()).then(cb).catch(()=>{document.getElementById('live').textContent='断';});}

function renderChainByTask(链){
  // 按时间戳顺序渲染为「请求(大字) → 回复(小字)」配对时间线。
  // 域配色：提示词=琥珀大字(任务原文)，回复思考=绿小字，工具=蓝小字，产物判定=橙小字，状态=紫。
  var 域色={'提示词':'#f0a53e','回复思考':'#3fb950','工具调用':'#58a6ff','工具返回':'#58a6ff','产物判定':'#f0883e','状态流转':'#d2a8ff'};
  function 净化(s){return String(s==null?'':s);}
  function 概要(s,fs){if(!s)return'';var c=s.replace(/\n/g,' ').replace(/\s+/g,' ').trim();return fs?c:c.slice(0,220)+(c.length>220?'…':'');}
  // 把 OpenAI 兼容提示词 JSON 精炼成「谁(角色)请做什么(核心指令)」一句话, 便于看出回复是对这个请求的回答。
  function 请求摘要(内容){
    try{
      var j=JSON.parse(内容);
      if(j && j.messages){ var msgs=j.messages; var sys='',usr='';
        for(var k=0;k<msgs.length;k++){var m=msgs[k]; if(m.role==='user') usr=m.content||''; if(m.role==='system'&&!sys) sys=m.content||'';}
        var 角色=概要(去掉思考(sys),false);
        var 指令=概要(去掉思考(usr),false);
        return {角色:角色,指令:指令};
      }
    }catch(e){}
    return {角色:'',指令:概要(内容,false)};
    function 去掉思考(s){return String(s).replace(/thinking[\s\S]*?response/g,' ');}
  }
  var h='';
  for(var i=0;i<链.length;i++){
    var r=链[i];
    var 域=r.域||'?'; var 色=域色[域]||'#c9d1d9';
    var 载荷=r.载荷||{}; var 内容=净化(载荷.内容); var 附加=载荷.附加||{};
    var 关联=r.关联||{}; var 轮=关联.轮次?('轮'+关联.轮次):'';
    var 角色=r.角色||'';
    // 提取工具名(工具调用/返回的附加里有)
    var 工具名=附加.工具||'';
    if(域==='提示词'){
      // 任务原文: 精炼成「角色 » 指令」大字, 让人一眼看出这条请求要它做什么
      var 摘要=请求摘要(内容);
      var 角色段=摘要.角色?('['+esc(摘要.角色)+']'):('');
      var 指令段=摘要.指令?esc(摘要.指令):'';
      h+='<div style="margin:12px 0 0;padding:9px 11px;background:#1d2430;border-left:4px solid '+色+';border-radius:5px">'
        +'<div style="font-size:12px;color:#6e7681">▸ <b style="color:'+色+';font-size:13px">请求</b> '+esc(角色)+((关联.接口)?' · '+esc(关联.接口):'')+'</div>'
        +'<div style="margin-top:5px;font-size:15px;line-height:1.55;color:#f0e6d2">'+(角色段?角色段+' ': '')+指令段+'</div>'
        +'</div>';
    } else if(域==='回复思考'){
      // 回复: 小字、绿色、缩进，作为上面那个请求卡的响应(紧贴配对)
      var 文本=概要(内容,true);
      // 去掉 think 链头, 尽量显示"结论"部分
      var 去think=内容.replace(/thinking[\s\S]*?response/g,'');
      文本=概要(去think.trim()||内容,true);
      h+='<div style="margin:0 0 2px 14px;padding:6px 10px;border-left:3px solid '+色+';color:#7ee787;font-size:13px;line-height:1.5;background:#15201a">'
        +'<b style="font-size:12px;color:#3fb950">↳ 回复 ('+esc(角色)+' '+esc(轮)+')</b>'
        +'<div style="color:#9bd6a0;font-size:12.5px;margin-top:2px;white-space:pre-wrap">'+esc(文本)+'</div></div>';
    } else if(域==='工具调用'){
      h+='<div style="margin:0 0 2px 22px;padding:3px 8px;border-left:1px solid #30363d;color:#79c0ff;font-size:12.5px">🔧 <b>'+esc(工具名)+'</b> <span style="color:#6e7681">'+esc(轮)+'</span> <span style="color:#8b949e">'+esc(概要(内容,false))+'</span></div>';
    } else if(域==='工具返回'){
      h+='<div style="margin:0 0 2px 22px;padding:3px 8px;border-left:1px solid #30363d;color:#8b949e;font-size:12px">↩ 结果('+esc(工具名)+')<span style="color:#6e7681">'+esc(轮)+'</span>: '+esc(概要(内容,true))+'</div>';
    } else if(域==='产物判定'){
      var 码=附加.退出码; var 码色=码===0?'#3fb950':'#f85149';
      h+='<div style="margin:6px 0 2px 22px;padding:4px 8px;border-left:2px solid '+色+';color:#f0883e;font-size:12.5px">🛠 构建 <span style="color:'+码色+'">退出码='+esc(码)+'</span> <span style="color:#6e7681">'+esc(附加.命令||'')+'</span></div>';
    } else {
      h+='<div style="margin:2px 0 2px 12px;padding:3px 8px;color:#c9d1d9;font-size:12px">['+esc(域)+'] '+esc(概要(内容,true))+'</div>';
    }
  }
  return h;
}
function renderTasks(rows){
  var h='';
  if(!rows||!rows.length){document.getElementById('task-body').innerHTML='<tr><td colspan="7" style="color:#8b949e">暂无任务</td></tr>';return;}
  // 筛选
  var fv=document.getElementById('f-verdict').value;
  var kw=document.getElementById('f-kw').value.trim();
  var 显=rows.filter(function(r){( !fv || (r.状态===fv) || (r.结论===fv) ) && ( !kw || (r.方向||'').indexOf(kw)>=0 || (r.要求||'').indexOf(kw)>=0);});
  document.getElementById('tcount').textContent=显.length;
  for(var i=显.length-1;i>=0;i--){
    var r=显[i];
    var cls=r.结论==='通过'?'acc-good':(r.结论==='打回'?'acc-bad':'acc-running');
    var 状态=r.状态||r.结论||'';
    // 方向大字 + 按结论着色; 要求id 加粗
    var 方向色=r.结论==='通过'?'#3fb950':(r.结论==='打回'?'#f0883e':'#58a6ff');
    h+='<tr class="taskrow" data-rid="'+esc(r.要求)+'" style="cursor:pointer">'
      +'<td style="font-weight:bold;white-space:nowrap;color:#e6edf3">'+esc(r.要求)+'</td>'
      +'<td style="font-size:15px;color:'+方向色+';line-height:1.4">'+esc(r.方向||'')+'</td>'
      +'<td class="'+cls+'" style="font-weight:bold">'+esc(状态)+'</td>'
      +'<td>'+esc(r.耗时||'')+'</td><td>'+esc(r.token||0)+'</td><td>'+esc(r.产物数||0)+'</td>'
      +'<td style="color:#8b949e;font-size:12px">'+esc((r.打回原因||'').slice(0,60))+'</td></tr>';
  }
  document.getElementById('task-body').innerHTML=h;
  if(显.length){document.getElementById('live').textContent='空闲';}
}
function loadTasks(){
  fetchJson('/api/tasks?_ts='+Date.now(), renderTasks);
}
document.getElementById('task-body').onclick=function(e){
  var tr=e.target.closest('tr.taskrow');
  if(!tr) return;
  var rid=tr.getAttribute('data-rid');
  // 找该要求，渲染其执行链到详情区（概要链，轻量；全文见 原始观测 页）
  fetchJson('/api/chain?要求='+encodeURIComponent(rid), function(链){
    if(!链||!链.length){document.getElementById('task-detail').innerHTML='<div style="color:#8b949e">该要求无观测链</div>';return;}
    document.getElementById('task-detail').innerHTML='<h3 style="color:#e6edf3">'+esc(rid)+' 执行链</h3>'+renderChainByTask(链);
  });
};
function renderTimeline(rows){
  var tl={'验收结论':'验收','失败沉淀':'失败','要求状态推进':'状态','工具调用':'工具','版本存档':'定档','设计上呈':'设计','想法投递':'想法','要求入池':'入池'};
  var ty={'验收结论':'ty-验收','失败沉淀':'ty-失败','要求状态推进':'ty-状态','工具调用':'ty-工具','版本存档':'ty-定档','设计上呈':'ty-设计','想法投递':'ty-设计','要求入池':'ty-状态'};
  var h='';
  for(var i=rows.length-1;i>=0;i--){
    var r=rows[i];
    h+='<div class="tl" title="点击展开JSON"><span class="tm">'+fmtTs(r.ts)+'</span><span class="ty '+ty[r.type]+'">'+(tl[r.type]||r.type)+'</span><span class="tx">'+esc(r.概||'')+'</span></div>';
  }
  document.getElementById('tl-body').innerHTML=h;
}
function renderObs(rows){
  var h='';
  if(!rows || !rows.length){document.getElementById('obs-body').innerHTML='<div style="color:#8b949e;padding:20px">暂无观测记录</div>';return;}
  for(var i=rows.length-1;i>=0;i--){
    var r=rows[i];
    var 关联=r.关联||{};
    var 载荷=r.载荷||{};
    var 正文=载荷.内容||'';   // full=1 时即完整原文，直接展示
    var tag=[r.域, r.角色, r.接口].filter(Boolean).join(' · ');
    var meta=[关联.任务线,关联.要求,关联.轮次?'轮'+关联.轮次:'',关联.标识].filter(Boolean).join(' / ');
    var 附加=载荷.附加? '<div style="color:#8b949e;font-size:11px">附加: '+esc(JSON.stringify(载荷.附加)).slice(0,150)+'</div>':'';
    var 域色={'提示词':'#f0a53e','回复思考':'#3fb950','工具调用':'#58a6ff','工具返回':'#8b949e','产物判定':'#f0883e','状态流转':'#d2a8ff'}[r.域]||'#c9d1d9';
    // 每个记录默认为一个展开块(open)，正文完整显示
    h+='<div class="ob"><details open><summary style="border-left:3px solid '+域色+'"> <span style="color:'+域色+'">['+esc(r.域)+']</span> '+esc(tag)+(meta?' <span style="color:#58a6ff">'+esc(meta)+'</span>':'')+'</summary><div style="padding:8px;white-space:pre-wrap;color:#c9d1d9;font-size:13px;max-height:420px;overflow:auto">'+esc(正文)+'</div>'+附加+'</details></div>';
  }
  document.getElementById('obs-body').innerHTML = h;
}
function loadRecords(){
  var qs='?_ts='+Date.now()+'&full=1&n=60&';  // 原始调试页直接拉完整正文
  var d=document.getElementById('f-domain').value;
  var r=document.getElementById('f-role').value;
  var req=document.getElementById('f-req').value.trim();
  if(d) qs+='域='+encodeURIComponent(d)+'&';
  if(r) qs+='角色='+encodeURIComponent(r)+'&';
  if(req) qs+='要求='+encodeURIComponent(req)+'&';
  fetchJson('/api/records'+qs, renderObs);
}
var 域表={'提示词':'#f0883e','回复思考':'#3fb950','工具调用':'#58a6ff','工具返回':'#58a6ff','状态流转':'#d2a8ff','产物判定':'#f0883e'};
function renderChain(rows){
  var h='';
  if(!rows.length){h='<div style="color:#8b949e;padding:20px">无该要求相关观测记录</div>';}
  for(var i=0;i<rows.length;i++){
    var r=rows[i]; var 关联=r.关联||{}; var 载荷=r.载荷||{};
    var 色=域表[r.域]||'#c9d1d9';
    var 正文=(载荷.内容||'').length>1200? (载荷.内容||'').slice(0,1200)+'…': (载荷.内容||'');
    var 附加=载荷.附加? '<div style="color:#8b949e;white-space:pre-wrap;padding-top:4px">附加: '+esc(JSON.stringify(载荷.附加))+ '</div>':'';
    h+='<div class="ob"><details><summary><span style="color:'+色+'">['+esc(r.域)+']</span> '+esc(r.接口||'')+' <span style="color:#8b949e">'+(关联.轮次?'轮'+关联.轮次:'')+' · '+(关联.任务线||'')+' · '+(关联.标识||'')+'</span></summary><div style="padding:8px;white-space:pre-wrap">'+esc(正文)+'</div>'+附加+'</details></div>';
  }
  document.getElementById('chain-body').innerHTML=h;
}
function loadChain(){
  var req=document.getElementById('chain-req').value.trim();
  if(!req) {document.getElementById('chain-body').innerHTML='<div style="color:#f85149;padding:20px">请输入 要求id</div>';return;}
  fetchJson('/api/chain?要求='+encodeURIComponent(req), renderChain);
}
function renderSpill(list){
  var h='<table><tr><th>文件</th><th>路径</th></tr>';
  for(var i=list.length-1;i>=0;i--){
    h+='<tr><td>'+esc(list[i].file)+'</td><td>'+esc(list[i].path)+'</td></tr>';
  }
  document.getElementById('sp-body').innerHTML=h+'</table>';
}
function set(which,btnId){
  ['ov','tl','obs','chain','sp'].forEach(function(w){document.getElementById('panel-'+w).classList.toggle('on',w===which);});
  ['tab-ov','tab-tl','tab-obs','tab-chain','tab-sp'].forEach(function(t){document.getElementById(t).classList.toggle('on',t===btnId);});
}
document.getElementById('tab-ov').onclick=function(){set('ov','tab-ov');loadTasks();};
document.getElementById('tab-tl').onclick=function(){set('tl','tab-tl');};
document.getElementById('tab-obs').onclick=function(){set('obs','tab-obs');loadRecords();};
document.getElementById('tab-chain').onclick=function(){set('chain','tab-chain');};
document.getElementById('tab-sp').onclick=function(){set('sp','tab-sp');loadSpill();};
function loadSpill(){fetchJson('/api/spill',renderSpill);}
function fillFilters(rows){
  var seenD={},seenR={};
  rows.forEach(function(r){if(r.域)seenD[r.域]=1;if(r.角色)seenR[r.角色]=1;});
  var sd=document.getElementById('f-domain'),sr=document.getElementById('f-role');
  sd.innerHTML='<option value="">全部域</option>'; sr.innerHTML='<option value="">全部角色</option>';
  Object.keys(seenD).sort().forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;sd.appendChild(o);});
  Object.keys(seenR).sort().forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=k;sr.appendChild(o);});
}
function boot(){
  fetchJson('/api/tasks',renderTasks);
  fetchJson('/api/timeline',renderTimeline);
  fetchJson('/api/records',function(rows){fillFilters(rows);renderObs(rows);});
  fetchJson('/api/spill',renderSpill);
}
boot();
setInterval(function(){fetchJson('/api/tasks',renderTasks);},8000);
// 观测页自动刷新: 仅当「原始观测」tab 激活时轮询, 概要模式轻量不卡。
