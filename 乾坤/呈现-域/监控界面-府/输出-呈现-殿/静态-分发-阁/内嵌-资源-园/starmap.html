<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洪荒 · 星图 · 函数级调用图谱</title>
<link rel="stylesheet" href="/static/starmap.css">
</head>
<body>
<div id="应用">

  <header id="顶栏">
    <div id="世界名">洪荒 · 星图</div>
    <nav id="视图切换">
      <a class="视图标签" href="/">群聊</a>
      <a class="视图标签" href="/trajectory.html">时序</a>
      <span class="视图标签 激活">星图</span>
    </nav>
    <div id="状态行">
      <span id="状态点"></span>
      <span id="状态文">加载中…</span>
      <span id="统计" class="运行时长">0 节点 / 0 边</span>
    </div>
    <nav id="顶工具">
      <label class="过滤项"><input type="checkbox" id="只显示有入度" checked> 只显示被调用的</label>
      <button id="重置" class="工具按钮" type="button">重置布局</button>
      <button id="暂停" class="工具按钮" type="button">暂停动画</button>
    </nav>
  </header>

  <main id="主体">
    <svg id="星图舞台" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
      <defs>
        <radialGradient id="节点光晕-紫">
          <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
          <stop offset="100%" stop-color="#7e57c2" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="连线层"></g>
      <g id="节点层"></g>
    </svg>
    <div id="详情面板" class="隐藏">
      <div class="详情-头">
        <span id="详情-名字"></span>
        <button id="详情-关闭" class="工具按钮">×</button>
      </div>
      <div class="详情-体">
        <div id="详情-签名"></div>
        <div id="详情-文件"></div>
        <div id="详情-入度"></div>
        <div id="详情-出度"></div>
      </div>
    </div>
  </main>

  <footer id="页脚">
    <span id="说明">点击节点看详情 · 拖动重排</span>
    <a class="页脚链接" href="/">← 回到群聊</a>
  </footer>
</div>
<script src="/static/starmap.js"></script>
</body>
</html>
