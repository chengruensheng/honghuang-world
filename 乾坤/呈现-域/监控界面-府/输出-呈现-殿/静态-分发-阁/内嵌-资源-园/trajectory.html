<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洪荒 · 时序·历史 · trajectory</title>
<link rel="stylesheet" href="/static/trajectory.css?v=2">
</head>
<body>
<div id="应用">

  <!-- 顶栏 -->
  <header id="顶栏">
    <div id="世界名">洪荒 · 时序</div>
    <nav id="视图切换" aria-label="视图切换">
      <a class="视图标签" href="/">群聊</a>
      <span class="视图标签 激活">时序·历史</span>
    </nav>
    <div id="状态行">
      <span id="状态点" aria-hidden="true"></span>
      <span id="状态文">接通天道中……</span>
      <span id="事件计数" class="运行时长">0 事件</span>
    </div>
    <nav id="顶工具" aria-label="顶工具栏">
      <input id="搜索框" type="search" placeholder="搜索动作/角色/影响…" autocomplete="off">
      <button id="全部折叠" class="工具按钮" type="button" title="折叠所有 Turn">折叠</button>
      <button id="全部展开" class="工具按钮" type="button" title="展开所有 Turn">展开</button>
    </nav>
  </header>

  <!-- 表格 -->
  <main id="主体">
    <div id="表头" class="表行 表头">
      <span class="列-序">#</span>
      <span class="列-类型">类型</span>
      <span class="列-时间">时间</span>
      <span class="列-角色">角色</span>
      <span class="列-摘要">摘要</span>
      <span class="列-提示词" title="提示词 token">输入</span>
      <span class="列-输出" title="输出 token">输出</span>
      <span class="列-缓存" title="缓存读 token">缓存</span>
      <span class="列-缓存写" title="缓存写 token">写</span>
      <span class="列-推理" title="思考链 token">思考</span>
      <span class="列-总计" title="总 token">总计</span>
      <span class="列-耗时" title="耗时 ms">耗时</span>
    </div>
    <div id="表体">
      <div id="加载中" class="加载">加载中……</div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer id="页脚">
    <span id="流速">流速: -- ev/s</span>
    <span id="总览">总计 0 事件 / 0 Turn</span>
    <a class="页脚链接" href="/">← 回到群聊视图</a>
  </footer>
</div>
<script src="/static/trajectory.js?v=2"></script>
</body>
</html>
