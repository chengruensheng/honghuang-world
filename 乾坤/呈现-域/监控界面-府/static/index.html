<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>洪荒 · 步骤直播</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header id="status-bar">
  <div class="row1">
    <span class="brand">洪荒 · 步骤直播</span>
    <span class="phase" id="phase">v3 步骤直播</span>
    <span class="state">事件 <strong id="footer-events">0</strong> · 流速 <strong id="footer-rate">0</strong> ev/s</span>
    <span class="indicator" id="live-indicator">🔴 未连</span>
  </div>
</header>
<main id="main">
  <aside id="task-list-pane">
    <div class="pane-head">任务列表 · <span id="task-count">0</span></div>
    <input id="search" placeholder="搜索 id 或方向…" />
    <select id="status-filter">
      <option value="">全部状态</option>
      <option>待领</option>
      <option>待实现</option>
      <option>实现中</option>
      <option>已通过</option>
      <option>已打回</option>
    </select>
    <div id="task-list"></div>
  </aside>
  <section id="steps-pane">
    <div class="pane-head">
      <div class="view-tabs" id="view-tabs">
        <button class="tab tab-on" data-tab="timeline">时间线</button>
        <button class="tab" data-tab="tree">任务树</button>
      </div>
      <span class="legend" id="task-meta">—</span>
    </div>
    <div id="timeline-view" class="view view-on"></div>
    <div id="tree-view" class="view"></div>
  </section>
</main>
<footer id="footer-bar">
  v3 步骤直播 │ 任务 <span id="footer-tasks">0</span> │ 事件 <span id="footer-events-foot">0</span> │ 网 <span id="net">🟢</span>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
